<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Header Auction Live - Voyager Upgrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault: #22005C;
  --voyager-color-vault-mid: #3B1782;
  --voyager-color-vault-dark: #2E0F70;
  --voyager-color-live: #ED8936;
  --voyager-color-live-mid: #F47A20;
  --voyager-color-live-dark: #C65C14;
  --voyager-surface-page: #F8FAF9;
  --voyager-surface-card: #FFFFFF;
  --voyager-text-on-dark: #FFFFFF;
  --voyager-text-on-dark-muted: #FFFFFF99;
  --voyager-border-ghost: #22005C1A;
  --voyager-divider-on-dark: #FFFFFF24;
  --voyager-gradient-vault: linear-gradient(135deg, var(--voyager-color-vault, #22005C) 0%, var(--voyager-color-vault-mid, #3B1782) 100%);
  --voyager-gradient-vault-deep: linear-gradient(135deg, var(--voyager-color-vault-dark, #2E0F70) 0%, var(--voyager-color-vault, #22005C) 100%);
  --voyager-gradient-live: linear-gradient(135deg, var(--voyager-color-live, #ED8936) 0%, var(--voyager-color-live-mid, #F47A20) 100%);
  --voyager-font-ui: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --voyager-font-number: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0;
  background:
    radial-gradient(ellipse 70% 50% at top left, var(--voyager-border-ghost, #22005C1A) 0%, transparent 60%),
    var(--voyager-surface-page, #F8FAF9);
  color: var(--voyager-text-on-dark, #FFFFFF);
  font-family: var(--voyager-font-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

.preview-stage {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  padding: 56px 24px;
}

.preview-grid {
  display: grid;
  grid-template-columns: auto;
  gap: 40px;
  align-items: start;
  justify-content: center;
}

.variant-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.variant-label {
  margin: 0;
  color: color-mix(in srgb, var(--voyager-color-vault, #22005C) 62%, var(--voyager-surface-card, #FFFFFF));
  font-family: var(--voyager-font-ui);
  font-size: 11px;
  font-weight: 700;
  line-height: 16px;
  letter-spacing: 0;
  text-align: center;
}

.preview-frame {
  width: 640px;
  height: 65.99px;
  overflow: hidden;
}

.preview-frame .header-auction-live {
  display: flex;
  align-items: center;
  width: 640px;
  height: 65.99px;
  margin: 0;
  padding: 0 16px;
  overflow: hidden;
  color: var(--voyager-text-on-dark, #FFFFFF);
  background: var(--voyager-gradient-vault, linear-gradient(135deg, var(--voyager-color-vault, #22005C) 0%, var(--voyager-color-vault-mid, #3B1782) 100%));
  font-family: var(--voyager-font-ui);
}

.preview-frame .header-type-room {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 28px;
  width: 28px;
  height: 65.99px;
  margin: 0 8px 0 0;
  padding: 0;
}

.preview-frame .icon-main {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  color: var(--voyager-color-live, #ED8936);
}

.preview-frame .icon {
  position: relative;
  display: inline-block;
  width: 16px;
  height: 16px;
  color: currentColor;
}

.preview-frame .icon-l7::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 4px;
  width: 8px;
  height: 8px;
  background: currentColor;
  border-radius: 9999px;
}

.preview-frame .icon-l7::after {
  content: "";
  position: absolute;
  inset: 1px;
  border: 1.5px solid currentColor;
  border-radius: 9999px;
  opacity: .45;
}

.preview-frame .header-data-auction {
  display: flex;
  align-items: center;
  flex: 1 1 auto;
  min-width: 0;
  height: 65.99px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.preview-frame .header-data-auction li {
  display: inline-flex;
  align-items: center;
  min-width: 0;
  height: 24px;
  margin: 0;
  padding: 0 12px 0 0;
  color: var(--voyager-text-on-dark, #FFFFFF);
  font-size: 20px;
  font-weight: 700;
  line-height: 24px;
  white-space: nowrap;
}

.preview-frame .header-data-auction li + li {
  padding-left: 12px;
  border-left: 1px solid var(--voyager-divider-on-dark, #FFFFFF24);
}

.preview-frame .header-data-auction .header-auction-placa {
  gap: 8px;
  padding-right: 0;
  color: var(--voyager-text-on-dark, #FFFFFF);
  font-size: 16px;
  font-weight: 500;
}

.preview-frame .header-auction-placa span {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 28px;
  min-width: 66px;
  padding: 0 10px;
  color: var(--voyager-text-on-dark, #FFFFFF);
  background: color-mix(in srgb, var(--voyager-surface-card, #FFFFFF) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--voyager-text-on-dark, #FFFFFF) 15%, transparent);
  border-radius: 6px;
  font-family: var(--voyager-font-number);
  font-size: 13px;
  font-weight: 700;
  line-height: 18px;
  font-variant-numeric: tabular-nums;
}

.preview-frame .counter-auction-init {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex: 0 0 150px;
  width: 150px;
  height: 65.99px;
  margin: 0 0 0 18px;
  padding: 0 0 0 18px;
  border-left: 1px solid var(--voyager-divider-on-dark, #FFFFFF24);
}

.preview-frame .counter-auction-init p {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  margin: 0;
  color: var(--voyager-text-on-dark, #FFFFFF);
  font-size: 15px;
  font-weight: 700;
  line-height: 20px;
  white-space: nowrap;
}

.preview-frame .counter-auction-init .icon-j8 {
  display: inline-block;
  width: 16px;
  height: 16px;
  margin-right: 5px;
  transform: translateY(2px);
}

.preview-frame .counter-auction-init .icon-j8::before {
  content: "";
  position: absolute;
  inset: 1px;
  border: 2px solid currentColor;
  border-radius: 9999px;
}

.preview-frame .counter-auction-init .icon-j8::after {
  content: "";
  position: absolute;
  left: 7px;
  top: 4px;
  width: 5px;
  height: 5px;
  border-left: 2px solid currentColor;
  border-bottom: 2px solid currentColor;
}

.preview-frame .counter-auction-init strong {
  display: block;
  flex: 0 0 100%;
  text-align: right;
  color: var(--voyager-text-on-dark, #FFFFFF);
  font-family: var(--voyager-font-number);
  font-size: 16px;
  font-weight: 700;
  line-height: 20px;
  font-variant-numeric: tabular-nums;
}

.preview-frame .counter-auction-init i {
  font-style: normal;
}

.v-plate .header-auction-live {
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--voyager-color-live, #ED8936) 9%, transparent) 0%, transparent 58%),
    var(--voyager-gradient-vault-deep, linear-gradient(135deg, var(--voyager-color-vault-dark, #2E0F70) 0%, var(--voyager-color-vault, #22005C) 100%));
}

.v-plate .header-auction-placa span {
  color: var(--voyager-text-on-dark, #FFFFFF);
  background: var(--voyager-gradient-live, linear-gradient(135deg, var(--voyager-color-live, #ED8936) 0%, var(--voyager-color-live-mid, #F47A20) 100%));
  border-color: color-mix(in srgb, var(--voyager-text-on-dark, #FFFFFF) 24%, transparent);
}

.v-plate .icon-main {
  color: var(--voyager-text-on-dark, #FFFFFF);
}

.v-plate .counter-auction-init {
  border-left-color: color-mix(in srgb, var(--voyager-color-live, #ED8936) 30%, transparent);
}

.v-plate .counter-auction-init .icon-j8 {
  color: var(--voyager-color-live, #ED8936);
}

@media (max-width: 1360px) {
  .preview-grid {
    grid-template-columns: 640px;
  }
}
</style>
</head>
<body>
  <main class="preview-stage" aria-label="Header Auction Live - Voyager upgrade variants">
    <div class="preview-grid">
      <section class="variant-block">
        <p class="variant-label">Vault live</p>
        <div class="preview-frame v-vault">
<div class="header-auction-live">
                        <div class="header-type-room">
                            <span class="icon-main"><i class="icon icon-l7"></i></span>
                        </div>
                        <ul class="header-data-auction">
                            <li>Toyota</li>
                            <li>Etios</li>
                            <li>2021</li>
                            <li class="header-auction-placa">placa: <span>P3U448</span></li>
                        </ul>
                        <div style="" class="counter-auction-init">
                            <p><i class="icon icon-j8"></i>Inició hace:<strong><i class="hour">00</i>:<i class="minutes">00</i>:<i class="seconds">10</i></strong></p>
                        </div>
                    </div>
        </div>
      </section>

      <section class="variant-block">
        <p class="variant-label">Placa live</p>
        <div class="preview-frame v-plate">
<div class="header-auction-live">
                        <div class="header-type-room">
                            <span class="icon-main"><i class="icon icon-l7"></i></span>
                        </div>
                        <ul class="header-data-auction">
                            <li>Toyota</li>
                            <li>Etios</li>
                            <li>2021</li>
                            <li class="header-auction-placa">placa: <span>P3U448</span></li>
                        </ul>
                        <div style="" class="counter-auction-init">
                            <p><i class="icon icon-j8"></i>Inició hace:<strong><i class="hour">00</i>:<i class="minutes">00</i>:<i class="seconds">10</i></strong></p>
                        </div>
                    </div>
        </div>
      </section>
    </div>
  </main>
<script src="../../variant-filter.js"></script>
</body>
</html>
