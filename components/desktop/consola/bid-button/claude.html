<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Consola Bid Button - Voyager Upgrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault: #22005C;
  --voyager-color-vault-mid: #3B1782;
  --voyager-color-vault-dark: #2E0F70;
  --voyager-color-live: #ED8936;
  --voyager-color-live-mid: #F47A20;
  --voyager-color-live-dark: #C65C14;
  --voyager-surface-page: #F8FAF9;
  --voyager-surface-section: #F2F4F3;
  --voyager-surface-card: #FFFFFF;
  --voyager-input-bg: #E1E3E2;
  --voyager-skeleton: #D1D5DC;
  --voyager-text-primary: #191C1C;
  --voyager-text-secondary: #494550;
  --voyager-text-disabled: #4A5565;
  --voyager-text-on-dark: #FFFFFF;
  --voyager-text-on-dark-muted: #FFFFFF99;
  --voyager-border-ghost: #22005C1A;
  --voyager-divider-section: #22005C0D;
  --voyager-gradient-live-button: linear-gradient(135deg, var(--voyager-color-live, #ED8936) 0%, var(--voyager-color-live-mid, #F47A20) 55%, var(--voyager-color-live-dark, #C65C14) 100%);
  --voyager-gradient-disabled-button: linear-gradient(135deg, color-mix(in srgb, var(--voyager-color-live, #ED8936) 34%, var(--voyager-input-bg, #E1E3E2)) 0%, color-mix(in srgb, var(--voyager-color-live-dark, #C65C14) 30%, var(--voyager-skeleton, #D1D5DC)) 100%);
  --voyager-font-ui: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --voyager-font-number: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0;
  background:
    radial-gradient(ellipse 70% 50% at top left, var(--voyager-border-ghost, #22005C1A) 0%, transparent 60%),
    radial-gradient(ellipse 48% 42% at bottom right, color-mix(in srgb, var(--voyager-color-live, #ED8936) 8%, transparent) 0%, transparent 58%),
    var(--voyager-surface-page, #F8FAF9);
  color: var(--voyager-text-primary, #191C1C);
  font-family: var(--voyager-font-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

.preview-stage {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  padding: 56px 24px;
}

.preview-grid {
  display: grid;
  grid-template-columns: auto;
  gap: 40px;
  align-items: start;
  justify-content: center;
}

.variant-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.variant-label {
  margin: 0;
  color: var(--voyager-text-secondary, #494550);
  font-family: var(--voyager-font-ui);
  font-size: 11px;
  font-weight: 700;
  line-height: 16px;
  letter-spacing: 0;
  text-align: center;
}

.preview-frame {
  width: 337px;
  height: 122px;
  overflow: hidden;
  background: linear-gradient(135deg, var(--voyager-color-vault-dark, #2E0F70) 0%, var(--voyager-color-vault, #22005C) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}

.preview-frame .btn-auction {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 251.99px;
  height: 70px;
  margin: 0;
  padding: 0 20px;
  overflow: hidden;
  border: 0;
  border-radius: 4px;
  color: var(--voyager-text-on-dark, #FFFFFF);
  background: var(--voyager-gradient-live-button, linear-gradient(135deg, var(--voyager-color-live, #ED8936) 0%, var(--voyager-color-live-mid, #F47A20) 55%, var(--voyager-color-live-dark, #C65C14) 100%));
  box-shadow: 0 8px 16px color-mix(in srgb, var(--voyager-color-vault, #22005C) 16%, transparent);
  font-family: var(--voyager-font-ui);
  cursor: pointer;
}

.preview-frame .btn-auction::before {
  content: attr(data-initial);
  position: absolute;
  left: 0;
  right: 0;
  top: 10px;
  color: var(--voyager-text-on-dark, #FFFFFF);
  font-family: var(--voyager-font-ui);
  font-size: 14px;
  font-weight: 700;
  line-height: 18px;
  letter-spacing: 0;
  text-align: center;
}

.preview-frame .btn-auction::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, color-mix(in srgb, var(--voyager-text-on-dark, #FFFFFF) 18%, transparent) 0%, transparent 54%);
  pointer-events: none;
}

.preview-frame .price {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: baseline;
  justify-content: center;
  gap: 6px;
  color: var(--voyager-text-on-dark, #FFFFFF);
  font-family: var(--voyager-font-ui);
  margin-top: 18px;
  font-size: 16px;
  font-weight: 600;
  line-height: 22px;
  white-space: nowrap;
}

.preview-frame #oferta {
  color: inherit;
  font-family: var(--voyager-font-number);
  font-size: 26px;
  font-weight: 700;
  line-height: 30px;
  font-variant-numeric: tabular-nums;
}

.preview-frame .btn-auction.disabled {
  color: color-mix(in srgb, var(--voyager-text-on-dark, #FFFFFF) 72%, transparent);
  background: var(--voyager-gradient-disabled-button, linear-gradient(135deg, color-mix(in srgb, var(--voyager-color-live, #ED8936) 34%, var(--voyager-input-bg, #E1E3E2)) 0%, color-mix(in srgb, var(--voyager-color-live-dark, #C65C14) 30%, var(--voyager-skeleton, #D1D5DC)) 100%));
  box-shadow: none;
  cursor: not-allowed;
}

.preview-frame .btn-auction.disabled::before {
  color: color-mix(in srgb, var(--voyager-text-on-dark, #FFFFFF) 78%, transparent);
}

.preview-frame .btn-auction.disabled::after {
  background: linear-gradient(180deg, color-mix(in srgb, var(--voyager-surface-card, #FFFFFF) 42%, transparent) 0%, transparent 55%);
}

.preview-frame .btn-auction.disabled .price {
  color: color-mix(in srgb, var(--voyager-text-on-dark, #FFFFFF) 66%, transparent);
}

@media (max-width: 640px) {
  .preview-grid {
    grid-template-columns: 337px;
  }
}
</style>
</head>
<body>
  <main class="preview-stage" aria-label="Consola Bid Button - Voyager upgrade states">
    <div class="preview-grid">
      <section class="variant-block">
        <p class="variant-label">Activo</p>
        <div class="preview-frame">
<button type="button" data-initial="Bidear" class="btn-auction btn--no-active"><span class="price">US$ <span id="oferta" data-theme="default" data-price="">5,159</span></span></button>
        </div>
      </section>

      <section class="variant-block">
        <p class="variant-label">Disabled</p>
        <div class="preview-frame">
<button type="button" data-initial="Bidear" class="btn-auction btn--no-active disabled"><span class="price">US$ <span id="oferta" data-theme="default" data-price="">5,359</span></span></button>
        </div>
      </section>
    </div>
  </main>
<script src="../../../variant-filter.js"></script>
</body>
</html>
