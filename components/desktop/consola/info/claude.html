<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Consola Info - Voyager Upgrade Variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault: #22005C;
  --voyager-color-vault-mid: #3B1782;
  --voyager-color-vault-dark: #2E0F70;
  --voyager-color-live: #ED8936;
  --voyager-color-live-mid: #F47A20;
  --voyager-color-live-dark: #C65C14;
  --voyager-surface-page: #F8FAF9;
  --voyager-surface-section: #F2F4F3;
  --voyager-surface-card: #FFFFFF;
  --voyager-text-primary: #191C1C;
  --voyager-text-secondary: #494550;
  --voyager-text-on-dark: #FFFFFF;
  --voyager-border-ghost: #22005C1A;
  --voyager-divider-section: #22005C0D;
  --voyager-gradient-vault: linear-gradient(135deg, var(--voyager-color-vault, #22005C) 0%, var(--voyager-color-vault-mid, #3B1782) 100%);
  --voyager-gradient-vault-deep: linear-gradient(135deg, var(--voyager-color-vault-dark, #2E0F70) 0%, var(--voyager-color-vault, #22005C) 100%);
  --voyager-gradient-live: linear-gradient(135deg, var(--voyager-color-live, #ED8936) 0%, var(--voyager-color-live-mid, #F47A20) 100%);
  --voyager-gradient-live-deep: linear-gradient(135deg, var(--voyager-color-live-mid, #F47A20) 0%, var(--voyager-color-live-dark, #C65C14) 100%);
  --voyager-gradient-surface: linear-gradient(135deg, var(--voyager-surface-section, #F2F4F3) 0%, var(--voyager-surface-card, #FFFFFF) 100%);
  --voyager-font-ui: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --voyager-font-number: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0;
  background:
    radial-gradient(ellipse 70% 50% at top left, color-mix(in srgb, var(--voyager-color-vault, #22005C) 5%, transparent) 0%, transparent 60%),
    radial-gradient(ellipse 50% 42% at bottom right, color-mix(in srgb, var(--voyager-color-live, #ED8936) 5%, transparent) 0%, transparent 58%),
    var(--voyager-surface-page, #F8FAF9);
  color: var(--voyager-text-primary, #191C1C);
  font-family: var(--voyager-font-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

.preview-stage {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  padding: 56px 24px;
}

.preview-grid {
  display: grid;
  grid-template-columns: auto;
  gap: 40px;
  align-items: start;
  justify-content: center;
}

.variant-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.variant-label {
  margin: 0;
  color: color-mix(in srgb, var(--voyager-color-vault, #22005C) 58%, var(--voyager-surface-card, #FFFFFF));
  font-family: var(--voyager-font-ui);
  font-size: 11px;
  font-weight: 700;
  line-height: 16px;
  letter-spacing: 0;
  text-align: center;
}

.preview-frame {
  position: relative;
  width: 305px;
  height: 119.98px;
  overflow: hidden;
  background: var(--voyager-surface-card, #FFFFFF);
}

.preview-frame .room-counter {
  position: absolute;
  inset: 0 auto auto 0;
  width: 305px;
  height: 60.99px;
  overflow: hidden;
  background: var(--voyager-gradient-surface, linear-gradient(135deg, var(--voyager-surface-section, #F2F4F3) 0%, var(--voyager-surface-card, #FFFFFF) 100%));
}

.preview-frame .room-counter ul {
  display: flex;
  width: 305px;
  height: 60.99px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.preview-frame .room-counter li {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 152.5px;
  height: 60.99px;
  margin: 0;
  padding: 6px 10px 5px;
  color: var(--voyager-color-vault, #22005C);
}

.preview-frame .room-counter li + li {
  color: var(--voyager-text-on-dark, #FFFFFF);
}

.preview-frame .counter-title {
  display: block;
  margin: 0;
  font-family: var(--voyager-font-ui);
  font-size: 14px;
  font-weight: 500;
  line-height: 18px;
  white-space: nowrap;
}

.preview-frame .margin-bottom-4 {
  margin-bottom: 4px;
}

.preview-frame .d-inline-flex {
  display: inline-flex;
}

.preview-frame .align-items-center {
  align-items: center;
}

.preview-frame .margin-left-2 {
  display: inline-flex;
  margin-left: 2px;
}

.preview-frame .counter-title svg {
  display: block;
  width: 16px;
  height: 16px;
  color: var(--voyager-text-on-dark, #FFFFFF);
}

.preview-frame .data-counter {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  height: 24px;
}

.preview-frame .data-counter > span {
  display: inline-flex;
  align-items: center;
  height: 24px;
}

.preview-frame .data-counter strong {
  display: inline-flex;
  align-items: center;
  height: 24px;
  font-family: var(--voyager-font-number);
  font-size: 20px;
  font-weight: 700;
  line-height: 24px;
  font-variant-numeric: tabular-nums;
}

.preview-frame .icon {
  position: relative;
  flex: 0 0 auto;
  width: 18px;
  height: 18px;
  margin-right: 5px;
}

.preview-frame .icon-n2::before,
.preview-frame .icon-n2::after {
  content: "";
  position: absolute;
  left: 50%;
  background: var(--voyager-color-vault, #22005C);
  transform: translateX(-50%);
}

.preview-frame .icon-n2::before {
  top: 1px;
  width: 8px;
  height: 8px;
  border-radius: 9999px;
}

.preview-frame .icon-n2::after {
  bottom: 1px;
  width: 16px;
  height: 9px;
  border-radius: 9999px 9999px 3px 3px;
}

.preview-frame .icon-i10 {
  width: 19px;
  height: 19px;
  margin-right: 4px;
  border: 1.5px solid var(--voyager-text-on-dark, #FFFFFF);
  border-radius: 4px;
  color: var(--voyager-text-on-dark, #FFFFFF);
}

.preview-frame .icon-i10::before,
.preview-frame .icon-i10::after {
  content: "";
  position: absolute;
  background: var(--voyager-text-on-dark, #FFFFFF);
}

.preview-frame .icon-i10::before {
  left: 4px;
  top: 4px;
  width: 9px;
  height: 7px;
  border-radius: 2px;
  opacity: .48;
}

.preview-frame .icon-i10::after {
  right: 3px;
  bottom: 3px;
  width: 7px;
  height: 7px;
  border-radius: 9999px;
}

.preview-frame .nro-ofert {
  letter-spacing: 0;
}

.preview-frame .room-price {
  position: absolute;
  left: 0;
  top: 60.99px;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 305px;
  height: 58.99px;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: var(--voyager-surface-card, #FFFFFF);
  border-top: 1px solid var(--voyager-divider-section, #22005C0D);
  color: var(--voyager-color-vault, #22005C);
}

.preview-frame .room-price + .room-price {
  z-index: 2;
}

.preview-frame .room-price p {
  margin: 0;
  padding: 0 12px;
  font-family: var(--voyager-font-ui);
  font-size: 16px;
  font-weight: 400;
  line-height: 24px;
  white-space: nowrap;
}

.preview-frame .room-price strong {
  font-family: var(--voyager-font-number);
  font-size: 16px;
  font-weight: 700;
  line-height: 24px;
  color: var(--voyager-color-vault, #22005C);
  font-variant-numeric: tabular-nums;
}

.v-vault .room-counter li + li {
  background: var(--voyager-gradient-vault, linear-gradient(135deg, var(--voyager-color-vault, #22005C) 0%, var(--voyager-color-vault-mid, #3B1782) 100%));
}

.v-live .room-counter {
  background: var(--voyager-gradient-surface, linear-gradient(135deg, var(--voyager-surface-section, #F2F4F3) 0%, var(--voyager-surface-card, #FFFFFF) 100%));
}

.v-live .room-counter li {
  color: var(--voyager-color-live-dark, #C65C14);
}

.v-live .room-counter li + li {
  color: var(--voyager-text-on-dark, #FFFFFF);
  background: var(--voyager-gradient-live, linear-gradient(135deg, var(--voyager-color-live, #ED8936) 0%, var(--voyager-color-live-mid, #F47A20) 100%));
}

.v-live .icon-n2::before,
.v-live .icon-n2::after {
  background: var(--voyager-color-live-dark, #C65C14);
}

.v-live .room-price,
.v-live .room-price strong {
  color: var(--voyager-color-live-dark, #C65C14);
}

@media (max-width: 1040px) {
  .preview-grid {
    grid-template-columns: 305px;
  }
}
</style>
</head>

<script src="../../../variant-filter.js"></script>
</body>
</html>
