<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Subastop Designs — Voyager Upgrade Preview · Header General</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault:        oklch(0.22 0.18 285);
  --voyager-color-vault-mid:    oklch(0.30 0.20 285);
  --voyager-color-live:         oklch(0.72 0.16 55);
  --voyager-color-live-strong:  oklch(0.62 0.18 45);
  --voyager-color-surface-page: oklch(0.98 0.004 160);
  --voyager-color-text-on-dark: oklch(1 0 0);
  --voyager-color-text-muted:   color-mix(in oklch, oklch(0.38 0.04 280) 60%, transparent);
  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-font-body:    "Roboto", system-ui, -apple-system, sans-serif;
  --voyager-radius-pill: 9999px;
  --voyager-duration-micro: 150ms;
  --voyager-ease-default: cubic-bezier(0.3, 0, 0, 1);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: oklch(0.97 0 0);
  font-family: var(--voyager-font-body);
  -webkit-font-smoothing: antialiased;
}

.preview-stage {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  min-width: max-content;
  padding: 56px 24px;
}

.preview-grid {
  display: grid;
  grid-template-columns: auto;
  gap: 40px;
  align-items: start;
}

.preview-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.preview-label {
  font-family: var(--voyager-font-display);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--voyager-color-text-muted);
  margin: 0 0 16px 0;
}

.preview-frame {
  width: 798px;
  height: 63px;
  overflow: hidden;
}

.header-bar {
  position: relative;
  width: 100%;
  height: 100%;
  background: var(--voyager-color-vault);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 0 20px;
}

.header-ingresa {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 22px;
  border: 0;
  border-radius: var(--voyager-radius-pill);
  background: var(--voyager-color-live);
  color: var(--voyager-color-text-on-dark);
  font-family: var(--voyager-font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  box-shadow: 0 2px 8px color-mix(in oklch, var(--voyager-color-live) 30%, transparent);
  transition:
    background var(--voyager-duration-micro) var(--voyager-ease-default),
    box-shadow var(--voyager-duration-micro) var(--voyager-ease-default),
    transform  var(--voyager-duration-micro) var(--voyager-ease-default);
}

.header-ingresa svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

.header-ingresa:hover {
  background: var(--voyager-color-live-strong);
  box-shadow: 0 4px 12px color-mix(in oklch, var(--voyager-color-live) 40%, transparent);
  transform: translateY(-1px);
}

.header-ingresa:focus-visible {
  outline: 2px solid var(--voyager-color-vault-mid);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .header-ingresa { transition: none; transform: none; }
}
</style>
</head>
<body>
<main class="preview-stage" aria-label="Voyager UI upgrade preview — Header General">
  <div class="preview-grid">
    <div class="preview-cell">
      <p class="preview-label">Default</p>
      <div class="preview-frame">
        <header class="header-bar">
          <button type="button" class="header-ingresa" aria-label="Ingresa">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z" fill="currentColor"/>
            </svg>
            <span>Ingresa</span>
          </button>
        </header>
      </div>
    </div>
  </div>
</main>
<script src="../../variant-filter.js"></script>
</body>
</html>
