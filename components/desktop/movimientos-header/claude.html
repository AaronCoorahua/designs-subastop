<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Subastop Designs — Voyager Upgrade · Movimientos Header</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Voyager DS — Movimientos Header
   DESIGN.md §2 · §4 · §5 · §6 · §7
   Estructura outerHTML FROZEN — solo se aplica token theming por scoping.
   Dimensiones canónicas: 766.01 × 63.96
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --voyager-color-vault:            oklch(0.22 0.18 285);   /* #22005C */
  --voyager-color-vault-mid:        oklch(0.30 0.20 285);   /* #3B1782 */
  --voyager-color-vault-dark:       oklch(0.26 0.19 285);
  --voyager-color-live:             oklch(0.72 0.16 55);    /* #ED8936 */
  --voyager-color-live-strong:      oklch(0.62 0.18 45);

  --voyager-surface-card:           oklch(1 0 0);
  --voyager-surface-section:        oklch(0.96 0.004 160);  /* #F2F4F3 */
  --voyager-surface-page:           oklch(0.98 0.004 160);  /* #F8FAF9 */

  --voyager-text-on-surface:        oklch(0.15 0.008 200);  /* #111827 */
  --voyager-text-muted:             oklch(0.55 0.02 260);
  --voyager-text-on-dark:           oklch(1 0 0);

  --voyager-color-border-ghost:     oklch(0.22 0.18 285 / 10%);

  --voyager-gradient-vault:         linear-gradient(135deg, #22005C 0%, #3B1782 100%);

  --voyager-shadow-card:            0 8px 16px oklch(0.22 0.18 285 / 6%);
  --voyager-shadow-floating:        0 12px 28px oklch(0.22 0.18 285 / 14%);

  --voyager-radius-sm:              4px;
  --voyager-radius-md:              8px;
  --voyager-radius-full:            9999px;

  --voyager-font-display:           "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-font-mono:              "Roboto Mono", monospace;
  --voyager-duration-micro:         150ms;
  --voyager-ease-default:           cubic-bezier(0.3, 0, 0, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background:
    radial-gradient(ellipse 70% 50% at top left,     oklch(0.22 0.18 285 / 4%) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at bottom right, oklch(0.72 0.16 55 / 4%) 0%, transparent 55%),
    var(--voyager-surface-page);
  font-family: var(--voyager-font-display);
  color: var(--voyager-text-on-surface);
  -webkit-font-smoothing: antialiased;
}

.preview-stage {
  display:         flex;
  align-items:     flex-start;
  justify-content: center;
  gap:             40px;
  flex-wrap:       wrap;
  flex-direction:  column;
  min-height:      100vh;
  padding:         32px 24px;
}

/* Scale-to-fit en viewports estrechos (catálogo / preview cards).
   Componente fijo en 766.01px — el zoom CSS lo reduce sin alterar layout. */
/* Scale-to-fit SOLO en catálogo (sin ?embed=1). En preview iframes con
   embed-mode el componente debe renderizar a tamaño nativo 1:1. */
@media (max-width: 840px) { html:not(.is-embed-mode) { zoom: 0.85; } }
@media (max-width: 720px) { html:not(.is-embed-mode) { zoom: 0.72; } }
@media (max-width: 620px) { html:not(.is-embed-mode) { zoom: 0.62; } }

.variant-block {
  display:        flex;
  flex-direction: column;
  gap:            12px;
}

.variant-label {
  font-size:      10px;
  font-weight:    700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color:          var(--voyager-text-muted);
  padding-left:   2px;
}

/* ══════════════════════════════════════════════════════════════════════════
   SHARED — utilidades del outerHTML, reimplementadas standalone
   El outerHTML NO se modifica: estructura + clases + dimensiones intactas.
   Estos selectores hacen el theming Voyager via scoping .mh-wrap[modifier].
   ══════════════════════════════════════════════════════════════════════════ */
.mh-wrap > div.px-8 {
  width:  766.01px;
  height: 63.96px;
}

.mh-wrap .flex          { display: flex; }
.mh-wrap .items-center  { align-items: center; }
.mh-wrap .flex-1        { flex: 1 1 0%; }
.mh-wrap .flex-shrink-0 { flex-shrink: 0; }
.mh-wrap .relative      { position: relative; }
.mh-wrap .absolute      { position: absolute; }
.mh-wrap .inline-block  { display: inline-block; }
.mh-wrap .top-0         { top: 0; }
.mh-wrap .left-0        { left: 0; }
.mh-wrap .bottom-0      { bottom: 0; }
.mh-wrap .right-0       { right: 0; }

.mh-wrap .px-8          { padding-left: 32px; padding-right: 32px; }
.mh-wrap .py-4          { padding-top: 16px; padding-bottom: 16px; }
.mh-wrap .px-3          { padding-left: 12px; padding-right: 12px; }
.mh-wrap .py-2          { padding-top: 8px; padding-bottom: 8px; }

.mh-wrap .ml-2          { margin-left: 8px; }
.mh-wrap .mx-2          { margin-left: 8px; margin-right: 8px; }

.mh-wrap .w-3           { width: 12px; }
.mh-wrap .h-3           { height: 12px; }
.mh-wrap .w-1           { width: 4px; }
.mh-wrap .h-1           { height: 4px; }

.mh-wrap .rounded       { border-radius: var(--voyager-radius-sm); }
.mh-wrap .rounded-full  { border-radius: var(--voyager-radius-full); }

.mh-wrap .fill-current  { fill: currentColor; }

.mh-wrap .text-base     { font-size: 16px; }
.mh-wrap .text-sm       { font-size: 14px; }
.mh-wrap .font-bold     { font-weight: 700; }
.mh-wrap .leading-none  { line-height: 1; }
.mh-wrap .uppercase     { text-transform: uppercase; }
.mh-wrap .font-display  { font-family: var(--voyager-font-display); }

/* Tabular-nums obligatorio en datos numéricos (Saldo, SubasCoins)
   DESIGN.md §10 · evita jitter en actualizaciones de WebSocket. */
.mh-wrap .text-sm {
  font-variant-numeric: tabular-nums;
}

/* ══════════════════════════════════════════════════════════════════════════
   VARIANT 1 — VAULT · GRADIENT
   Hero header: gradient vault profundo · texto blanco · brackets live brillante
   ══════════════════════════════════════════════════════════════════════════ */
.mh--vault .bg-coral-100    { background: var(--voyager-gradient-vault); }
.mh--vault .text-coral-400  { color:      var(--voyager-color-live); }
.mh--vault .text-purple-400 { color:      var(--voyager-text-on-dark); }
.mh--vault .text-purple-500 { color:      var(--voyager-text-on-dark); }
.mh--vault .bg-coral-500    { background: var(--voyager-color-live); }
.mh--vault .shadow-lg       { box-shadow: var(--voyager-shadow-floating); }

/* ══════════════════════════════════════════════════════════════════════════
   VARIANT 2 — MODERN · CLEAN
   Surface blanco · ghost border · sombra sutil · brackets live · dot vault
   El más sobrio — para vistas densas (movimientos largos en tabla).
   ══════════════════════════════════════════════════════════════════════════ */
.mh--modern .bg-coral-100   {
  background: var(--voyager-surface-card);
  border: 1px solid var(--voyager-color-border-ghost);
}
.mh--modern .text-coral-400 { color:      var(--voyager-color-live); }
.mh--modern .text-purple-400{ color:      var(--voyager-color-vault); }
.mh--modern .text-purple-500{ color:      var(--voyager-color-vault); }
.mh--modern .bg-coral-500   { background: var(--voyager-color-vault); }
.mh--modern .shadow-lg      { box-shadow: var(--voyager-shadow-card); }

/* ─── prefers-reduced-motion ─────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<main class="preview-stage" aria-label="Voyager DS — Movimientos Header">

  <!-- ════════════════════════════════════════════════════════════════════════
       VARIANT 1 — VAULT · GRADIENT
       ════════════════════════════════════════════════════════════════════ -->
  <div class="variant-block">
    <span class="variant-label">Vault · Gradient</span>
    <div class="mh-wrap mh--vault">
      <div class="px-8 py-4 rounded shadow-lg bg-coral-100">
        <div class="flex items-center">
            <div class="flex items-center flex-1">
                <div class="relative inline-block px-3 py-2">
                    <svg class="absolute top-0 left-0 w-3 h-3 fill-current text-coral-400" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5.75 22C7.82107 22 9.5 20.3211 9.5 18.25L9.5 9.5H18.25C20.3211 9.5 22 7.82107 22 5.75C22 3.67893 20.3211 2 18.25 2L7 2C4.23858 2 2 4.23858 2 7L2 18.25C2 20.3211 3.67893 22 5.75 22Z" fill="currentColor"></path>
                    </svg>
                    <h4 class="text-base font-bold leading-none text-purple-400 uppercase font-display">Billetera</h4>
                    <svg class="absolute bottom-0 right-0 w-3 h-3 fill-current text-coral-400" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18.25 2C16.1789 2 14.5 3.67893 14.5 5.75V14.5L5.75 14.5C3.67893 14.5 2 16.1789 2 18.25C2 20.3211 3.67893 22 5.75 22H17C19.7614 22 22 19.7614 22 17V5.75C22 3.67893 20.3211 2 18.25 2Z" fill="currentColor"></path>
                    </svg>
                </div>
            </div>
            <div class="flex items-center flex-shrink-0">
                <div class="flex items-center text-sm text-purple-500 font-display">
                    <span class="font-bold">Saldo:</span>
                    <span class="ml-2">US$ 0</span>
                </div>
                <div class="w-1 h-1 mx-2 rounded-full bg-coral-500"></div>
                <div class="flex items-center text-sm text-purple-500 font-display">
                    <span class="font-bold">SubasCoins:</span>
                    <span class="ml-2"><span class="font-bold">&gt;S&lt;</span> 0</span>
                </div>
            </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════════════════════════════════════════
       VARIANT 2 — MODERN · CLEAN
       ════════════════════════════════════════════════════════════════════ -->
  <div class="variant-block">
    <span class="variant-label">Modern · Clean</span>
    <div class="mh-wrap mh--modern">
      <div class="px-8 py-4 rounded shadow-lg bg-coral-100">
        <div class="flex items-center">
            <div class="flex items-center flex-1">
                <div class="relative inline-block px-3 py-2">
                    <svg class="absolute top-0 left-0 w-3 h-3 fill-current text-coral-400" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5.75 22C7.82107 22 9.5 20.3211 9.5 18.25L9.5 9.5H18.25C20.3211 9.5 22 7.82107 22 5.75C22 3.67893 20.3211 2 18.25 2L7 2C4.23858 2 2 4.23858 2 7L2 18.25C2 20.3211 3.67893 22 5.75 22Z" fill="currentColor"></path>
                    </svg>
                    <h4 class="text-base font-bold leading-none text-purple-400 uppercase font-display">Billetera</h4>
                    <svg class="absolute bottom-0 right-0 w-3 h-3 fill-current text-coral-400" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18.25 2C16.1789 2 14.5 3.67893 14.5 5.75V14.5L5.75 14.5C3.67893 14.5 2 16.1789 2 18.25C2 20.3211 3.67893 22 5.75 22H17C19.7614 22 22 19.7614 22 17V5.75C22 3.67893 20.3211 2 18.25 2Z" fill="currentColor"></path>
                    </svg>
                </div>
            </div>
            <div class="flex items-center flex-shrink-0">
                <div class="flex items-center text-sm text-purple-500 font-display">
                    <span class="font-bold">Saldo:</span>
                    <span class="ml-2">US$ 0</span>
                </div>
                <div class="w-1 h-1 mx-2 rounded-full bg-coral-500"></div>
                <div class="flex items-center text-sm text-purple-500 font-display">
                    <span class="font-bold">SubasCoins:</span>
                    <span class="ml-2"><span class="font-bold">&gt;S&lt;</span> 0</span>
                </div>
            </div>
        </div>
      </div>
    </div>
  </div>

</main>
<script src="../../variant-filter.js"></script>
</body>
</html>
