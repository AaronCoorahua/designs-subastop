/* ─────────────────────────────────────────────────────────────────────────
   Voyager DS — local token surface.  DESIGN.md §2 Color · §6 Radius · §7
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --voyager-color-vault:        oklch(0.22 0.18 285);
  --voyager-color-vault-mid:    oklch(0.30 0.20 285);
  --voyager-color-live:         oklch(0.72 0.16 55);
  --voyager-color-negotiable:   oklch(0.78 0.14 195);
  --voyager-color-surface-page:    oklch(0.98 0.004 160);
  --voyager-color-surface-section: oklch(0.96 0.004 160);
  --voyager-color-surface-card:    oklch(1 0 0);
  --voyager-color-text-on-surface: oklch(0.15 0.008 200);
  --voyager-color-text-muted:      color-mix(in oklch, oklch(0.38 0.04 280) 60%, transparent);
  --voyager-color-skeleton:        oklch(0.85 0.008 220);
  --voyager-color-divider-section: color-mix(in oklch, var(--voyager-color-vault) 5%, transparent);
  --voyager-tint-live-soft:        color-mix(in oklch, var(--voyager-color-live) 10%, var(--voyager-color-surface-card));
  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-font-body:    "Roboto", system-ui, -apple-system, sans-serif;
  --voyager-radius-sm:   4px;
  --voyager-radius-md:   8px;
  --voyager-radius-lg:   16px;
  --voyager-shadow-card:     0 8px 16px oklch(0.22 0.18 285 / 6%);
  --voyager-shadow-floating: 0 12px 28px oklch(0.22 0.18 285 / 14%);
  --voyager-shadow-sm:       0 2px 8px  oklch(0.22 0.18 285 / 8%);
  --voyager-duration-micro:    150ms;
  --voyager-duration-standard: 300ms;
  --voyager-ease-default:      cubic-bezier(0.3, 0, 0, 1);
}

/* ── Preview canvas ─────────────────────────────────────────────────────── */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background:
    radial-gradient(ellipse at top left,   color-mix(in oklch, var(--voyager-color-vault) 4%, transparent) 0%, transparent 60%),
    radial-gradient(ellipse at bottom right, color-mix(in oklch, var(--voyager-color-live) 4%, transparent) 0%, transparent 55%),
    var(--voyager-color-surface-page);
  font-family: var(--voyager-font-body);
  color: var(--voyager-color-text-on-surface);
  -webkit-font-smoothing: antialiased;
}

.preview-stage {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  padding: 56px 24px;
}

.preview-grid {
  display: grid;
  grid-template-columns: auto;
  gap: 40px;
  align-items: start;
}

.preview-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.preview-label {
  font-family: var(--voyager-font-display);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--voyager-color-text-muted);
  margin: 0 0 16px 0;
}

/* ── KEY FIX: frame clips content at exact component height ─────────────── */
.preview-frame {
  width: 440px;
  height: 247.71px;
  overflow: hidden;
}

/* ── Layout primitives ──────────────────────────────────────────────────── */
.preview-frame .p-4          { padding: 12px; }
.preview-frame .px-3         { padding-left: 10px; padding-right: 10px; }
.preview-frame .px-4         { padding-left: 10px; padding-right: 10px; }
.preview-frame .px-2         { padding-left: 6px; padding-right: 6px; }
.preview-frame .py-2         { padding-top: 0; padding-bottom: 0; }
.preview-frame .pt-3         { padding-top: 6px; }
.preview-frame .pl-1         { padding-left: 4px; }
.preview-frame .mt-4         { margin-top: 12px; }
.preview-frame .mb-2         { margin-bottom: 8px; }
.preview-frame .mr-2         { margin-right: 8px; }
.preview-frame .flex         { display: flex; }
.preview-frame .inline-flex  { display: inline-flex; }
.preview-frame .inline-block { display: inline-block; }
.preview-frame .block        { display: block; }
.preview-frame .grid         { display: grid; }
.preview-frame .grid-cols-3  { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.preview-frame .gap-4        { gap: 10px; }
.preview-frame .gap-2        { gap: 6px; }
.preview-frame .items-center { align-items: center; }
.preview-frame .flex-1       { flex: 1 1 0%; }
.preview-frame .flex-shrink-0 { flex-shrink: 0; }
.preview-frame .justify-center { justify-content: center; }
.preview-frame .relative     { position: relative; }
.preview-frame .absolute     { position: absolute; }
.preview-frame .top-0        { top: 0; }
.preview-frame .left-0       { left: 0; }
.preview-frame .bottom-0     { bottom: 0; }
.preview-frame .right-0      { right: 0; }
.preview-frame .bottom-2     { bottom: 8px; }
.preview-frame .left-2       { left: 8px; }
.preview-frame .z-1          { z-index: 1; }
.preview-frame .z-2          { z-index: 2; }
.preview-frame .w-full       { width: 100%; }
.preview-frame .h-full       { height: 100%; }
.preview-frame .w-2          { width: 6px; }
.preview-frame .h-2          { height: 6px; }
.preview-frame .w-4          { width: 14px; }
.preview-frame .h-4          { height: 14px; }
.preview-frame .w-6          { width: 22px; }
.preview-frame .h-6          { height: 22px; }
.preview-frame .h-28         { height: 96px; }
.preview-frame .h-12         { height: 50px; }
.preview-frame .pointer-events-none { pointer-events: none; }
.preview-frame .overflow-hidden     { overflow: hidden; }
.preview-frame .truncate            { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Typography ─────────────────────────────────────────────────────────── */
.preview-frame .font-display { font-family: var(--voyager-font-display); }
.preview-frame .text-base    { font-size: 15px; line-height: 18px; }
.preview-frame .text-xs      { font-size: 11px; }
.preview-frame .font-bold    { font-weight: 700; }
.preview-frame .font-normal  { font-weight: 400; }
.preview-frame .font-light   { font-weight: 300; }
.preview-frame .leading-none { line-height: 1; }
.preview-frame .leading-tight { line-height: 1.25; }
.preview-frame .uppercase    { text-transform: uppercase; }

/* ── Images ─────────────────────────────────────────────────────────────── */
.preview-frame .object-cover  { object-fit: cover; }
.preview-frame .object-center { object-position: center; }

/* ── Icons ───────────────────────────────────────────────────────────────── */
.preview-frame svg           { display: inline-block; vertical-align: middle; }
.preview-frame .fill-current { fill: currentColor; }

/* ── Voyager color mapping ──────────────────────────────────────────────── */

/* Outer card surface */
.preview-frame .bg-coral-100 {
  background-color: var(--voyager-color-surface-card, #FFFFFF);
}

/* Corner bracket SVGs */
.preview-frame .text-coral-400 {
  color: var(--voyager-color-live, #ED8936);
}

/* "Recomendados" heading */
.preview-frame .text-purple-400 {
  color: var(--voyager-color-vault, #22005C);
}

/* Inner card surface */
.preview-frame .bg-white {
  background-color: var(--voyager-color-surface-card, #FFFFFF);
}

/* Title + year text */
.preview-frame .text-purple-900 {
  color: var(--voyager-color-vault, #22005C);
}

/* Heart icon color */
.preview-frame .text-purple-300 {
  color: color-mix(in oklch, var(--voyager-color-vault) 35%, oklch(0.92 0.004 280));
}

/* Price badge background */
.preview-frame .bg-yellow-100 {
  background-color: var(--voyager-tint-live-soft);
}

/* Price badge text */
.preview-frame .text-turquoise-900 {
  color: var(--voyager-color-vault, #22005C);
}

/* ── Rounded ────────────────────────────────────────────────────────────── */
.preview-frame .rounded-full { border-radius: 9999px; }
.preview-frame .rounded-lg   { border-radius: var(--voyager-radius-md, 8px); }
.preview-frame .rounded-t    { border-radius: var(--voyager-radius-sm, 4px) var(--voyager-radius-sm, 4px) 0 0; }
.preview-frame .rounded-br   { border-radius: 0 0 var(--voyager-radius-sm, 4px) 0; }

/* ── Auction card status bottom borders ─────────────────────────────────── */
.preview-frame .border-b-8 {
  border-bottom-width: 8px;
  border-bottom-style: solid;
}
.preview-frame .border-turquoise-500 {
  border-color: var(--voyager-color-negotiable, #00CACE);
}
.preview-frame .border-yellow-500 {
  border-color: var(--voyager-color-live, #ED8936);
}

/* ── Inner card image area — gradient fallback when image is loading ─────── */
.preview-frame .w-full.h-28 {
  background: linear-gradient(
    145deg,
    oklch(0.91 0.022 285) 0%,
    oklch(0.94 0.010 220) 60%,
    oklch(0.96 0.005 160) 100%
  );
}

/* ── Year mini-pill — floats from .description up onto the image area ────── */
.preview-frame .description {
  position: relative;
}

.preview-frame .description a {
  text-decoration: none;
}

.preview-frame .description a > p {
  position: absolute;
  bottom: calc(100% + 6px);   /* 6px above .description = inside image bottom */
  left: 6px;
  margin: 0;
  padding: 2px 8px;
  background: var(--voyager-color-surface-card, #FFFFFF);
  color: var(--voyager-color-vault, #22005C);
  border-radius: 9999px;
  box-shadow: 0 2px 6px oklch(0.22 0.18 285 / 16%);
  font-size: 10px;
  font-weight: 700;
  line-height: 14px;
  letter-spacing: 0.02em;
  z-index: 5;
  white-space: nowrap;
}

/* ── Inner auction card border-radius + shadow ───────────────────────────── */
.preview-frame .bg-white.rounded {
  border-radius: var(--voyager-radius-sm, 4px);
}

.preview-frame .bg-white.shadow-md {
  box-shadow: var(--voyager-shadow-sm);
}

/* ── Heart button ────────────────────────────────────────────────────────── */
.preview-frame .rounded-full.shadow-lg {
  box-shadow: 0 2px 8px oklch(0.22 0.18 285 / 12%);
}
.preview-frame button.shadow {
  background-color: var(--voyager-color-surface-card, #FFFFFF);
  border: none;
  cursor: pointer;
}

/* ── Outer card — KEY FIX: height + overflow + ::after stripe ───────────── */
.preview-frame .bg-coral-100.rounded {
  border-radius: var(--voyager-radius-lg, 16px);
  height: 247.71px;    /* ← fills exactly the clipped frame */
  overflow: hidden;    /* ← clips all content inside */
  position: relative;  /* ← anchors ::after */
}

.preview-frame .bg-coral-100.shadow-lg {
  box-shadow: var(--voyager-shadow-card);
  background-image:
    linear-gradient(145deg,
      color-mix(in oklch, var(--voyager-color-vault) 2%, transparent) 0%,
      transparent 50%);
  transition:
    box-shadow var(--voyager-duration-standard) var(--voyager-ease-default),
    transform  var(--voyager-duration-micro)    var(--voyager-ease-default);
}

/* Vault purple stripe — lives INSIDE the overflow:hidden container */
.preview-frame .bg-coral-100.shadow-lg::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 8px;
  border-radius: 0 0 var(--voyager-radius-lg, 16px) var(--voyager-radius-lg, 16px);
  background: var(--voyager-color-vault, #22005C);
  pointer-events: none;
  z-index: 10;
}

/* ── HR divider ──────────────────────────────────────────────────────────── */
.preview-frame hr.border-t {
  border: none;
  border-top: 1px solid var(--voyager-color-divider-section);
}
.preview-frame .my-4 { margin-top: 16px; margin-bottom: 16px; }

/* ── Frozen states ──────────────────────────────────────────────────────── */
.frame--hover .bg-coral-100.shadow-lg {
  box-shadow: var(--voyager-shadow-floating);
  transform: translateY(-2px);
}

/* prefers-reduced-motion */
@media (prefers-reduced-motion: reduce) {
  .preview-frame * { transition: none !important; transform: none !important; }
}
</style>
