<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Subastop Designs — Voyager Upgrade · Seleccionar Canje</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Voyager DS — Seleccionar Canje (Puntos VMC)
   Component dimensions: 272.01 × 463.99 px
   3 variantes: Live · Vault · Modern
   ──────────────────────────────────────────────────────────────────────── */
:root {
  /* ── Tier 1: Primitives ──────────────────────────────────────────────── */
  --voyager-color-vault:           oklch(0.22 0.18 285);  /* #22005C */
  --voyager-color-vault-mid:       oklch(0.30 0.20 285);  /* #3B1782 */
  --voyager-color-vault-dark:      oklch(0.26 0.19 285);  /* #2E0F70 */
  --voyager-color-live:            oklch(0.72 0.16 55);   /* #ED8936 */

  /* Live stops (Figma) */
  --voyager-orange-500:            #F4AC59;
  --voyager-orange-600:            #ED8936;
  --voyager-orange-700:            #D07128;
  --voyager-orange-800:            #B25614;
  --voyager-orange-900:            #93420A;

  /* Vault stops (Figma · vault-700/800/900 · vaultgradient1/2) */
  --voyager-vault-700:             #3B1782;
  --voyager-vault-800:             #2E0F70;
  --voyager-vault-900:             #22005C;
  --voyager-vault-grad-1:          #200068;
  --voyager-vault-grad-2:          #4E38AF;

  /* ── Tier 2: Surfaces ────────────────────────────────────────────────── */
  --voyager-surface-card:          #FFFFFF;
  --voyager-surface-section:       oklch(0.96 0.004 160);
  --voyager-surface-page:          oklch(0.98 0.004 160);
  --voyager-surface-row:           oklch(0.95 0.005 280);

  /* Selected tinted backgrounds */
  --voyager-tint-vault:            #ECE6F3;
  --voyager-tint-live:             #FCEEDD;

  /* ── Tier 2: Text ────────────────────────────────────────────────────── */
  --voyager-text-on-surface:       oklch(0.15 0.008 200);
  --voyager-text-muted:            oklch(0.55 0.02 260);
  --voyager-text-on-dark:          #FFFFFF;
  --voyager-text-on-dark-muted:    oklch(1 0 0 / 75%);
  --voyager-text-disabled:         #B8B8B8;

  /* ── Tier 2: Borders ─────────────────────────────────────────────────── */
  --voyager-border-ghost:          oklch(0.22 0.18 285 / 10%);
  --voyager-border-input:          oklch(0.22 0.18 285 / 22%);

  /* ── Disabled ────────────────────────────────────────────────────────── */
  --voyager-surface-disabled:      #DDDDDD;

  /* ── Tier 3: Gradients · LIVE ────────────────────────────────────────── */
  --voyager-grad-live-default:     linear-gradient(90deg, #F4AC59 0%, #ED8936 50%, #D07128 100%);
  --voyager-grad-live-hover:       linear-gradient(90deg, #ED8936 0%, #D07128 50%, #B25614 100%);
  --voyager-grad-live-pressed:     linear-gradient(90deg, #B25614 0%, #93420A 100%);

  /* ── Tier 3: Gradients · VAULT (reversed 270deg) ─────────────────────── */
  --voyager-grad-vault-default:    linear-gradient(270deg, #200068 0%, #4E38AF 100%);
  --voyager-grad-vault-hover:      linear-gradient(270deg, #22005C 0%, #3B1782 100%);
  --voyager-grad-vault-pressed:    linear-gradient(270deg, #3B1782 0%, #2E0F70 100%);

  /* ── Shadows ─────────────────────────────────────────────────────────── */
  --voyager-shadow-card:           0 8px 16px oklch(0.22 0.18 285 / 6%);
  --voyager-shadow-floating:       0 12px 28px oklch(0.22 0.18 285 / 12%);
  --voyager-shadow-live-cta:       0 8px 18px rgba(208, 113, 40, 0.32);
  --voyager-shadow-vault-cta:      0 8px 18px rgba(34, 0, 92, 0.32);
  --voyager-shadow-row-selected:   0 4px 12px rgba(34, 0, 92, 0.12);

  /* Text shadows */
  --voyager-text-shadow-live:      0 1px 2px rgba(120, 56, 8, 0.35);
  --voyager-text-shadow-vault:     0 1px 2px rgba(0, 0, 0, 0.25);

  /* ── Radius ──────────────────────────────────────────────────────────── */
  --voyager-radius-sm:             4px;
  --voyager-radius-md:             8px;
  --voyager-radius-lg:             16px;
  --voyager-radius-full:           9999px;

  /* ── Typography ──────────────────────────────────────────────────────── */
  --voyager-font-display:          "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-font-mono:             "Roboto Mono", monospace;

  /* ── Motion ──────────────────────────────────────────────────────────── */
  --voyager-duration-micro:        160ms;
  --voyager-ease-default:          cubic-bezier(0.3, 0, 0, 1);
}

/* ─── Canvas ───────────────────────────────────────────────────────────── */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background:
    radial-gradient(ellipse 70% 50% at top left,    oklch(0.22 0.18 285 / 4%) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at bottom right, oklch(0.72 0.16 55 / 4%) 0%, transparent 55%),
    var(--voyager-surface-page);
  font-family: var(--voyager-font-display);
  color: var(--voyager-text-on-surface);
  -webkit-font-smoothing: antialiased;
}

/* ─── Preview stage ─────────────────────────────────────────────────────── */
.preview-stage {
  display:         flex;
  align-items:     flex-start;
  justify-content: center;
  gap:             56px;
  flex-wrap:       wrap;
  min-height:      100vh;
  padding:         56px 40px;
}

.variant-block {
  display:        flex;
  flex-direction: column;
  gap:            12px;
}

.variant-label {
  font-size:      10px;
  font-weight:    700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color:          var(--voyager-text-muted);
  padding-left:   2px;
}

/* ═══════════════════════════════════════════════════════════════════════════
   SC ROOT — Live & Vault shared structure
   ══════════════════════════════════════════════════════════════════════════ */
.sc-root {
  width:           272.01px;
  display:         flex;
  flex-direction:  column;
  gap:             12px;
}

/* ── Radio row ──────────────────────────────────────────────────────────── */
.sc-option {
  position:       relative;
  display:        flex;
  align-items:    center;
  padding:        16px 20px;
  background:     var(--voyager-surface-card);
  border:         1px solid var(--voyager-border-ghost);
  border-radius:  var(--voyager-radius-md);
  cursor:         pointer;
  transition:     background var(--voyager-duration-micro) var(--voyager-ease-default),
                  border-color var(--voyager-duration-micro) var(--voyager-ease-default),
                  box-shadow var(--voyager-duration-micro) var(--voyager-ease-default);
}

.sc-option:hover {
  border-color: var(--voyager-border-input);
}

.sc-option-inner {
  display:     flex;
  align-items: center;
  flex:        1;
}

.sc-radio {
  appearance:    none;
  -webkit-appearance: none;
  width:         20px;
  height:        20px;
  border-radius: var(--voyager-radius-sm);
  border:        2px solid var(--voyager-color-vault);
  background:    var(--voyager-surface-card);
  cursor:        pointer;
  position:      relative;
  flex-shrink:   0;
  transition:    background var(--voyager-duration-micro) var(--voyager-ease-default),
                 border-color var(--voyager-duration-micro) var(--voyager-ease-default);
}

.sc-radio::after {
  content:    '';
  position:   absolute;
  top:        2px;
  left:       6px;
  width:      4px;
  height:     9px;
  border:     solid #FFFFFF;
  border-width: 0 2px 2px 0;
  transform:  rotate(45deg) scale(0);
  transition: transform var(--voyager-duration-micro) var(--voyager-ease-default);
}

.sc-radio:checked::after {
  transform: rotate(45deg) scale(1);
}

.sc-radio:focus-visible {
  outline:        2px solid var(--voyager-color-vault-mid);
  outline-offset: 2px;
}

.sc-option-text {
  margin-left:  16px;
  font-size:    14px;
  font-weight:  300;
  line-height:  1.4286;
  color:        var(--voyager-color-vault);
}

.sc-option-text-bold { font-weight: 700; }

/* Popular pill — flotante en la esquina superior derecha del row,
   no empuja el ancho intrínseco del componente (272.01px). */
.sc-popular-pill {
  position:       absolute;
  top:            -8px;
  right:          12px;
  display:        inline-flex;
  align-items:    center;
  padding:        3px 8px;
  font-size:      9px;
  font-weight:    800;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color:          var(--voyager-text-on-dark);
  border-radius:  var(--voyager-radius-full);
  line-height:    1;
  z-index:        2;
  pointer-events: none;
}

.sc--live .sc-popular-pill {
  background: var(--voyager-grad-live-default);
  box-shadow: 0 2px 6px rgba(208, 113, 40, 0.30);
}

.sc--vault .sc-popular-pill {
  background: var(--voyager-grad-vault-default);
  box-shadow: 0 2px 6px rgba(34, 0, 92, 0.30);
}

/* ── Custom amount block ────────────────────────────────────────────────── */
.sc-custom-wrap { position: relative; }

.sc-custom-overlay-label {
  position: absolute;
  inset:    0;
  display:  block;
  cursor:   pointer;
  z-index:  2;
}

.sc-custom-inner {
  position: relative;
  z-index:  1;
}

.sc-custom-title {
  font-size:    12px;
  line-height:  1.25;
  color:        var(--voyager-text-muted);
  margin-bottom: 6px;
  font-weight:  600;
  letter-spacing: 0.3px;
}

.sc-custom-row {
  position:       relative;
  display:        flex;
  align-items:    center;
  padding:        14px 20px;
  background:     var(--voyager-surface-card);
  border:         1px solid var(--voyager-border-ghost);
  border-radius:  var(--voyager-radius-md);
  transition:     background var(--voyager-duration-micro) var(--voyager-ease-default),
                  border-color var(--voyager-duration-micro) var(--voyager-ease-default);
}

.sc-custom-input-wrap {
  position:    relative;
  display:     flex;
  align-items: center;
  margin-left: 16px;
}

.sc-custom-amount {
  padding:        4px 4px;
  font-size:      14px;
  font-weight:    700;
  line-height:    1.25;
  color:          var(--voyager-vault-900);
  background:     transparent;
  border:         none;
  outline:        none;
  font-family:    var(--voyager-font-display);
  box-sizing:     content-box;
  max-width:      100px;
  min-width:      24px;
  width:          28px;
}

.sc-custom-suffix {
  font-size:    14px;
  font-weight:  300;
  line-height:  1.4286;
  color:        var(--voyager-color-vault);
}

/* ── CTA Button (gradient · 3 estados: default/hover/pressed) ───────────── */
.sc-cta-wrap { padding-top: 6px; }

.sc-cta {
  display:        flex;
  align-items:    center;
  justify-content: center;
  width:          100%;
  padding:        12px 24px;
  font-family:    var(--voyager-font-display);
  font-size:      14px;
  font-weight:    700;
  line-height:    1.5;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color:          var(--voyager-text-on-dark);
  border:         none;
  border-radius:  var(--voyager-radius-md);
  cursor:         pointer;
  transition:     background var(--voyager-duration-micro) var(--voyager-ease-default),
                  transform  var(--voyager-duration-micro) var(--voyager-ease-default),
                  box-shadow var(--voyager-duration-micro) var(--voyager-ease-default);
}

.sc-cta:focus-visible {
  outline:        2px solid var(--voyager-color-vault-mid);
  outline-offset: 2px;
}

.sc-cta:disabled {
  background:     var(--voyager-surface-disabled) !important;
  color:          var(--voyager-text-disabled) !important;
  cursor:         not-allowed;
  box-shadow:     none !important;
  text-shadow:    none !important;
  transform:      none !important;
}

/* ═══════════════════════════════════════════════════════════════════════════
   VARIANT 1 — LIVE
   Selección con tint live + radio en gradiente live · Botón live
   ══════════════════════════════════════════════════════════════════════════ */
.sc--live .sc-option:has(.sc-radio:checked),
.sc--live .sc-custom-row:has(.sc-radio:checked) {
  background:   var(--voyager-tint-live);
  border-color: var(--voyager-orange-600);
  box-shadow:   var(--voyager-shadow-row-selected);
}

.sc--live .sc-radio:checked {
  background:   var(--voyager-grad-live-default);
  border-color: var(--voyager-orange-700);
}

.sc--live .sc-cta {
  background:  var(--voyager-grad-live-default);
  box-shadow:  var(--voyager-shadow-live-cta);
  text-shadow: var(--voyager-text-shadow-live);
}

.sc--live .sc-cta:hover:not(:disabled) {
  background: var(--voyager-grad-live-hover);
  box-shadow: 0 10px 22px rgba(178, 86, 20, 0.40);
}

.sc--live .sc-cta:active:not(:disabled) {
  background: var(--voyager-grad-live-pressed);
  box-shadow: 0 4px 10px rgba(147, 66, 10, 0.40);
  transform:  translateY(1px);
}

/* ═══════════════════════════════════════════════════════════════════════════
   VARIANT 2 — VAULT
   Selección con tint vault + radio en gradiente vault · Botón vault
   ══════════════════════════════════════════════════════════════════════════ */
.sc--vault .sc-option:has(.sc-radio:checked),
.sc--vault .sc-custom-row:has(.sc-radio:checked) {
  background:   var(--voyager-tint-vault);
  border-color: var(--voyager-vault-grad-2);
  box-shadow:   var(--voyager-shadow-row-selected);
}

.sc--vault .sc-radio:checked {
  background:   var(--voyager-grad-vault-default);
  border-color: var(--voyager-vault-900);
}

.sc--vault .sc-cta {
  background:  var(--voyager-grad-vault-default);
  box-shadow:  var(--voyager-shadow-vault-cta);
  text-shadow: var(--voyager-text-shadow-vault);
}

.sc--vault .sc-cta:hover:not(:disabled) {
  background: var(--voyager-grad-vault-hover);
  box-shadow: 0 10px 22px rgba(34, 0, 92, 0.45);
}

.sc--vault .sc-cta:active:not(:disabled) {
  background: var(--voyager-grad-vault-pressed);
  box-shadow: 0 4px 10px rgba(46, 15, 112, 0.45);
  transform:  translateY(1px);
}

/* ═══════════════════════════════════════════════════════════════════════════
   VARIANT 3 — MODERN (chips grid + custom chip clickable + CTA dinámico)
   ══════════════════════════════════════════════════════════════════════════ */
.sc-modern {
  width:           272.01px;
  display:         flex;
  flex-direction:  column;
  gap:             14px;
  padding:         20px;
  border-radius:   var(--voyager-radius-lg);
  background:      var(--voyager-surface-card);
  box-shadow:      var(--voyager-shadow-floating);
  border:          1px solid var(--voyager-border-ghost);
}

.sc-modern-eyebrow {
  font-size:      10px;
  font-weight:    700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color:          var(--voyager-text-muted);
}

.sc-modern-title {
  font-size:   18px;
  font-weight: 800;
  line-height: 1.2;
  color:       var(--voyager-color-vault);
  margin-top:  -4px;
}

.sc-modern-chips {
  display:               grid;
  grid-template-columns: repeat(2, 1fr);
  gap:                   8px;
}

.sc-modern-chip {
  position:        relative;
  display:         flex;
  flex-direction:  column;
  align-items:     center;
  justify-content: center;
  padding:         12px 8px;
  background:      var(--voyager-surface-row);
  border:          1.5px solid transparent;
  border-radius:   var(--voyager-radius-md);
  cursor:          pointer;
  transition:      background var(--voyager-duration-micro) var(--voyager-ease-default),
                   border    var(--voyager-duration-micro) var(--voyager-ease-default),
                   transform var(--voyager-duration-micro) var(--voyager-ease-default);
}

.sc-modern-chip:hover {
  background: oklch(0.93 0.008 280);
  transform:  translateY(-1px);
}

.sc-modern-chip-radio {
  position: absolute;
  opacity:  0;
  pointer-events: none;
}

.sc-modern-chip-num {
  font-family:          var(--voyager-font-mono);
  font-variant-numeric: tabular-nums;
  font-size:            20px;
  font-weight:          700;
  line-height:          1.1;
  color:                var(--voyager-color-vault);
}

.sc-modern-chip-label {
  font-size:      9px;
  font-weight:    700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color:          var(--voyager-text-muted);
  margin-top:     2px;
}

.sc-modern-chip:has(.sc-modern-chip-radio:checked) {
  background:   var(--voyager-grad-vault-default);
  border-color: transparent;
  box-shadow:   0 4px 12px rgba(34, 0, 92, 0.28);
}

.sc-modern-chip:has(.sc-modern-chip-radio:checked) .sc-modern-chip-num {
  color: var(--voyager-text-on-dark);
}

.sc-modern-chip:has(.sc-modern-chip-radio:checked) .sc-modern-chip-label {
  color: var(--voyager-text-on-dark-muted);
}

/* "Otro monto" chip = quinta opción seleccionable con stepper inline */
.sc-modern-other {
  position:       relative;
  display:        flex;
  align-items:    center;
  justify-content: space-between;
  padding:        12px 14px;
  background:     var(--voyager-surface-row);
  border:         1.5px dashed var(--voyager-border-input);
  border-radius:  var(--voyager-radius-md);
  cursor:         pointer;
  transition:     background var(--voyager-duration-micro) var(--voyager-ease-default),
                  border var(--voyager-duration-micro) var(--voyager-ease-default);
}

.sc-modern-other:hover { background: oklch(0.93 0.008 280); }

.sc-modern-other-radio {
  position: absolute;
  opacity:  0;
  pointer-events: none;
}

.sc-modern-other-label {
  font-size:      10px;
  font-weight:    700;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color:          var(--voyager-text-muted);
}

.sc-modern-stepper {
  display:     flex;
  align-items: center;
  gap:         8px;
}

.sc-modern-step-btn {
  width:         26px;
  height:        26px;
  border-radius: var(--voyager-radius-full);
  border:        1px solid var(--voyager-border-input);
  background:    var(--voyager-surface-card);
  color:         var(--voyager-color-vault);
  font-size:     14px;
  font-weight:   700;
  line-height:   1;
  cursor:        pointer;
  display:       flex;
  align-items:   center;
  justify-content: center;
  transition:    background var(--voyager-duration-micro) var(--voyager-ease-default);
}

.sc-modern-step-btn:hover { background: var(--voyager-tint-vault); }
.sc-modern-step-btn:active { transform: translateY(1px); }

.sc-modern-step-value {
  font-family:          var(--voyager-font-mono);
  font-variant-numeric: tabular-nums;
  font-size:            16px;
  font-weight:          700;
  color:                var(--voyager-color-vault);
  min-width:            36px;
  text-align:           center;
}

/* Otro monto seleccionado: gradiente vault */
.sc-modern-other:has(.sc-modern-other-radio:checked) {
  background:   var(--voyager-grad-vault-default);
  border-style: solid;
  border-color: transparent;
  box-shadow:   0 4px 12px rgba(34, 0, 92, 0.28);
}

.sc-modern-other:has(.sc-modern-other-radio:checked) .sc-modern-other-label,
.sc-modern-other:has(.sc-modern-other-radio:checked) .sc-modern-step-value {
  color: var(--voyager-text-on-dark);
}

.sc-modern-other:has(.sc-modern-other-radio:checked) .sc-modern-step-btn {
  background:   rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.30);
  color:        var(--voyager-text-on-dark);
}

/* CTA con total dinámico (texto + valor) */
.sc-modern-cta {
  display:        flex;
  align-items:    center;
  justify-content: center;
  gap:            8px;
  width:          100%;
  padding:        14px 24px;
  font-family:    var(--voyager-font-display);
  font-size:      14px;
  font-weight:    700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color:          var(--voyager-text-on-dark);
  background:     var(--voyager-grad-live-default);
  border:         none;
  border-radius:  var(--voyager-radius-md);
  cursor:         pointer;
  text-shadow:    var(--voyager-text-shadow-live);
  box-shadow:     var(--voyager-shadow-live-cta);
  transition:     background var(--voyager-duration-micro) var(--voyager-ease-default),
                  transform  var(--voyager-duration-micro) var(--voyager-ease-default),
                  box-shadow var(--voyager-duration-micro) var(--voyager-ease-default);
}

.sc-modern-cta:hover  { background: var(--voyager-grad-live-hover);   box-shadow: 0 10px 22px rgba(178, 86, 20, 0.40); }
.sc-modern-cta:active { background: var(--voyager-grad-live-pressed); transform: translateY(1px); box-shadow: 0 4px 10px rgba(147, 66, 10, 0.40); }
.sc-modern-cta:focus-visible { outline: 2px solid var(--voyager-color-vault-mid); outline-offset: 2px; }

.sc-modern-cta-amount {
  font-family:          var(--voyager-font-mono);
  font-variant-numeric: tabular-nums;
  font-weight:          800;
}

/* ─── prefers-reduced-motion ────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

<script src="../../variant-filter.js"></script>
<script>
/* Modern · CTA dinámico: refleja el monto seleccionado */
(function () {
  const root = document.querySelector('[data-modern-root]');
  if (!root) return;
  const ctaAmount = root.querySelector('[data-cta-amount]');
  const stepValue = root.querySelector('[data-step-value]');
  const otherInput = root.querySelector('[data-custom]');
  const radios = root.querySelectorAll('input[name="points-modern"]');
  const stepBtns = root.querySelectorAll('[data-step]');

  function updateCta() {
    const checked = root.querySelector('input[name="points-modern"]:checked');
    if (!checked) return;
    const value = checked.hasAttribute('data-custom')
      ? stepValue.textContent.trim()
      : checked.getAttribute('data-amount');
    ctaAmount.textContent = value;
  }

  radios.forEach(function (r) { r.addEventListener('change', updateCta); });

  stepBtns.forEach(function (btn) {
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      const delta = parseInt(btn.getAttribute('data-step'), 10);
      let current = parseInt(stepValue.textContent.trim(), 10) || 0;
      current = Math.max(10, current + delta);
      stepValue.textContent = current;
      otherInput.setAttribute('data-amount', current);
      if (otherInput.checked) ctaAmount.textContent = current;
    });
  });
})();

</script>
