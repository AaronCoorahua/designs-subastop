<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Subastop Designs — Voyager Upgrade Preview · Sidebar Nav</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Voyager DS — local token surface.  DESIGN.md §2 Color · §6 Radius
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --voyager-color-vault:           oklch(0.22 0.18 285);   /* #22005C */
  --voyager-color-vault-mid:       oklch(0.30 0.20 285);   /* #3B1782 */
  --voyager-color-vault-dark:      oklch(0.26 0.19 285);   /* #2E0F70 */
  --voyager-color-live:            oklch(0.72 0.16 55);    /* #ED8936 */
  --voyager-color-surface-page:    oklch(0.98 0.004 160);
  --voyager-color-text-on-surface: oklch(0.15 0.008 200);
  --voyager-color-text-muted:      oklch(0.38 0.04 280 / 60%);
  --voyager-font-display: "Plus Jakarta Sans", system-ui, sans-serif;
  --voyager-font-body:    "Roboto", system-ui, sans-serif;
  --voyager-radius-sm:   4px;
  --voyager-duration-micro:    150ms;
  --voyager-ease-default: cubic-bezier(0.3, 0, 0, 1);

  /* Sidebar-specific derived values */
  --nav-text-default:  oklch(1 0 0 / 65%);
  --nav-text-hover:    oklch(1 0 0 / 100%);
  --nav-bg-hover:      oklch(1 0 0 / 8%);
  --nav-bg-active:     oklch(1 0 0 / 12%);
  --nav-chevron:       oklch(1 0 0 / 35%);
  --nav-chevron-hover: oklch(1 0 0 / 65%);
  --nav-section-label: oklch(1 0 0 / 30%);
  --nav-sub-bg:        color-mix(in oklch, var(--voyager-color-vault) 65%, oklch(0 0 0));
  --nav-count:         oklch(1 0 0 / 35%);
}

/* ── Reset ─────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { text-decoration: none; color: inherit; }

/* ── Page ──────────────────────────────────────────────────────────────── */
html, body {
  background:
    radial-gradient(ellipse at top left,   oklch(0.22 0.18 285 / 4%) 0%, transparent 60%),
    radial-gradient(ellipse at bottom right, oklch(0.72 0.16 55 / 4%) 0%, transparent 55%),
    var(--voyager-color-surface-page);
  font-family: var(--voyager-font-body);
  color: var(--voyager-color-text-on-surface);
  -webkit-font-smoothing: antialiased;
}

/* ── Preview scaffold ──────────────────────────────────────────────────── */
.preview-stage {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  padding: 56px 24px;
}

.preview-grid {
  display: flex;
  flex-direction: column;
  gap: 48px;
  align-items: center;
}

.preview-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.preview-label {
  font-family: var(--voyager-font-display);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--voyager-color-text-muted);
  margin-bottom: 16px;
}

/* Component frame — 220px wide, auto height (compact design ≈ 268px) */
.preview-frame {
  width: 220px;
  border-radius: var(--voyager-radius-sm);
  background: var(--voyager-color-vault);
  overflow: hidden;
}

/* ── Utility class translations ─────────────────────────────────────────── */
.w-full         { width: 100%; }
.flex           { display: flex; }
.items-center   { align-items: center; }
.justify-between{ justify-content: space-between; }
.flex-1         { flex: 1 1 0%; }
.flex-shrink-0  { flex-shrink: 0; }
.block          { display: block; }
.leading-6      { line-height: 24px; }
.font-display   { font-family: var(--voyager-font-display); }
.font-normal    { font-weight: 400; }
.fill-current   { fill: currentColor; }
.cursor-pointer { cursor: pointer; }
.list-none      { list-style: none; }
.truncate       { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ml-3           { margin-left: 10px; }
.ml-2           { margin-left: 6px; }
.pr-2           { padding-right: 6px; }
.px-2           { padding-left: 6px; padding-right: 6px; }
.pl-1           { padding-left: 4px; }
.pl-3           { padding-left: 12px; }
.pl-5           { padding-left: 20px; }
.pb-3           { padding-bottom: 12px; }
.py-3           { padding-top: 12px; padding-bottom: 12px; }
.rounded-full   { border-radius: 9999px; }
.relative       { position: relative; }
.group          { }

/* Icons — 18px (improved from original 20px) */
.w-5 { width: 18px; }
.h-5 { height: 18px; }
.w-1 { width: 4px; }
.h-1 { height: 4px; }

/* Font sizes — improved: 12px text-sm (vs original 14px) */
.text-sm { font-size: 12px; }
.text-xs { font-size: 11px; }

/* Chevron rotation utility */
.transform      { }
.transition-all { transition: transform 200ms ease; }
.duration-200   { transition-duration: 200ms; }
.rotate-0       { transform: rotate(0deg); }

/* text-white → inherit nav-item color (controlled by parent opacity) */
.nav-menu .text-white { color: inherit; }

/* Details / summary */
details { width: 100%; }
summary { cursor: pointer; }
summary::-webkit-details-marker { display: none; }
summary::marker                 { display: none; }

/* Collapse sub-menus for static preview */
details > *:not(summary) { display: none; }

/* Hide empty nav-list separator */
.nav-list:empty { display: none; }

/* ── Nav item row — DESIGN IMPROVEMENT applied ────────────────────────── */
.nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 10px 20px;              /* compact: py-3 equivalent */
  line-height: 24px;
  cursor: pointer;
  font-family: var(--voyager-font-display);
  font-size: 12px;                 /* improved from 14px */
  font-weight: 400;
  color: var(--nav-text-default);  /* white 65% */
  outline: none;
  transition:
    background var(--voyager-duration-micro) var(--voyager-ease-default),
    color      var(--voyager-duration-micro) var(--voyager-ease-default);
}

.nav-item:hover {
  background: var(--nav-bg-hover);
  color: var(--nav-text-hover);
}

.nav-item:focus-visible {
  outline: 2px solid oklch(1 0 0 / 40%);
  outline-offset: -2px;
}

/* Chevron wrapper — more muted than label */
.nav-item > span:not(.flex) {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  color: var(--nav-chevron);
  transition: color var(--voyager-duration-micro) var(--voyager-ease-default);
}

.nav-item:hover > span:not(.flex) {
  color: var(--nav-chevron-hover);
}

/* ── SOPORTE section label — pure CSS, no DOM change ─────────────────── */
.nav-menu > .nav-list:last-child::before {
  content: "SOPORTE";
  display: block;
  font-family: var(--voyager-font-display);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.10em;
  color: var(--nav-section-label);
  padding: 14px 20px 2px;
  border-top: 1px solid oklch(1 0 0 / 6%);
  margin-top: 4px;
}

/* ── Sub-menu (collapsed in preview — shown for completeness) ─────────── */
.nav-sub {
  background: var(--nav-sub-bg);
  padding: 6px 0;
  box-shadow: inset 0 2px 4px oklch(0 0 0 / 15%);
}

.nav-sub .nav-item {
  font-size: 12px;
  padding: 10px 20px;
  color: oklch(1 0 0 / 70%);
}

/* Count badges */
.text-purple-200 { color: var(--nav-count); font-size: 10px; }

/* Bullet dots in sub-sub items */
.bg-gray-100    { background: oklch(1 0 0 / 55%); }
.bg-purple-600  { background: var(--nav-sub-bg); }
.shadow-inner   { box-shadow: inset 0 2px 4px oklch(0 0 0 / 15%); }

/* py-4 — override to compact equivalent (nav-item padding wins) */
.py-4 { padding-top: 10px; padding-bottom: 10px; }
.px-5 { padding-left: 20px; padding-right: 20px; }

/* ── Variant 3 overrides — Stroke · Modern ────────────────────────────── */
.v3 .nav-item {
  padding: 14px 20px;
  font-size: 13px;
  color: oklch(1 0 0 / 82%);
}
.v3 .nav-item:hover { color: oklch(1 0 0 / 100%); }
.v3 .ml-3 { margin-left: 12px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; transform: none !important; }
}
</style>
