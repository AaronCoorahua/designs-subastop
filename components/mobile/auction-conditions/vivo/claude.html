<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mobile · Auction Conditions · Vivo — Voyager Upgrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault:           oklch(0.22 0.18 285);
  --voyager-color-vault-mid:       oklch(0.30 0.20 285);
  --voyager-color-vault-light:     oklch(0.44 0.18 285);
  --voyager-color-live:            oklch(0.72 0.16 55);
  --voyager-color-surface-card:    oklch(1 0 0);
  --voyager-color-surface-section: oklch(0.96 0.004 160);
  --voyager-color-surface-page:    oklch(0.98 0.004 160);
  --voyager-color-text-on-dark:    oklch(1 0 0);
  --voyager-color-text-muted:      color-mix(in oklch, oklch(0.22 0.18 285) 50%, white);
  --voyager-color-neutral-700:     oklch(0.70 0.015 257);  /* #99A1AF */

  --voyager-radius-sm:  4px;
  --voyager-radius-md:  8px;

  --voyager-shadow-card: 0 8px 16px oklch(0.22 0.18 285 / 6%);

  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-ease-default: cubic-bezier(0.3, 0, 0, 1);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background:
    radial-gradient(ellipse 70% 50% at top left, oklch(0.22 0.18 285 / 4%) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at bottom right, oklch(0.72 0.16 55 / 4%) 0%, transparent 55%),
    var(--voyager-color-surface-page);
  font-family: var(--voyager-font-display);
  color: oklch(0.15 0.008 200);
  -webkit-font-smoothing: antialiased;
}

.preview-stage {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  padding: 56px 24px;
}
.variants-col {
  display: flex;
  flex-direction: column;
  gap: 40px;
  align-items: center;
}
.variant-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.variant-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--voyager-color-text-muted);
  text-align: center;
}

.preview-frame {
  width: 372px;
  min-height: 189.88px;
}

.preview-frame .flex          { display: flex; }
.preview-frame .flex-wrap     { flex-wrap: wrap; }
.preview-frame .justify-center { justify-content: center; }
.preview-frame .items-center  { align-items: center; }
.preview-frame .p-2           { padding: 8px; }
.preview-frame .px-2          { padding-left: 8px; padding-right: 8px; }
.preview-frame .py-2          { padding-top: 8px; padding-bottom: 8px; }
.preview-frame .mx-1          { margin-left: 4px; margin-right: 4px; }
.preview-frame .my-2          { margin-top: 8px; margin-bottom: 8px; }
.preview-frame .text-xs       { font-size: 11px; }
.preview-frame .leading-tight { line-height: 1.2; }
.preview-frame .text-center   { text-align: center; }
.preview-frame .font-display  { font-family: var(--voyager-font-display); font-weight: 600; text-shadow: 0 1px 3px oklch(0 0 0 / 25%); }

.preview-frame .w-\[calc\(50\%-\.5rem\)\] { width: calc(50% - .5rem); }
.preview-frame .h-\[46px\]   { height: 46px; }

.preview-frame .rounded-md   { border-radius: var(--voyager-radius-sm); }
.preview-frame .rounded-b-lg {
  border-bottom-left-radius:  var(--voyager-radius-md);
  border-bottom-right-radius: var(--voyager-radius-md);
}

/* VARIANT 3 — Modern: vivid gradient + ghost inactive */
.v3 .bg-white {
  background-color: var(--voyager-color-surface-card);
  box-shadow: var(--voyager-shadow-card);
}

.v3 .bg-purple-300 {
  background-color: var(--voyager-color-neutral-700);
  color: var(--voyager-color-text-on-dark);
  letter-spacing: 0.01em;
  box-shadow:
    0 4px 12px oklch(0.70 0.015 257 / 50%),
    0 1px 0   oklch(1 0 0 / 15%);
}

.v3 .bg-gray-400 {
  background-color: transparent;
  border: 1.5px solid var(--voyager-color-neutral-700);
  color: var(--voyager-color-neutral-700);
}

.preview-frame .text-white { color: var(--voyager-color-text-on-dark); }

.v3 .bg-gray-400.text-white {
  color: var(--voyager-color-neutral-700);
}
</style>
</head>
<body>
  <main class="preview-stage" aria-label="Mobile · Auction Conditions · Vivo — Voyager upgrade">
    <div class="variants-col">

      <div class="variant-block">
        <p class="variant-label">Modern · Vivid gradient + Ghost inactive</p>
        <div class="preview-frame v3">
          <div class="flex flex-wrap justify-center p-2 bg-white rounded-b-lg shadow"><div class="px-2 py-2 mx-1 my-2 w-[calc(50%-.5rem)] text-xs leading-tight text-center h-[46px] flex items-center justify-center text-white rounded-md font-display bg-purple-300">Con Fee de Habilitacion</div><div class="px-2 py-2 mx-1 my-2 w-[calc(50%-.5rem)] text-xs leading-tight text-center h-[46px] flex items-center justify-center text-white rounded-md font-display bg-purple-300">Con Precio Reserva</div><div class="px-2 py-2 mx-1 my-2 w-[calc(50%-.5rem)] text-xs leading-tight text-center h-[46px] flex items-center justify-center text-white rounded-md font-display bg-gray-400">Sin Opción a Visitas</div><div class="px-2 py-2 mx-1 my-2 w-[calc(50%-.5rem)] text-xs leading-tight text-center h-[46px] flex items-center justify-center text-white rounded-md font-display bg-gray-400">Sin Comisión</div><div class="px-2 py-2 mx-1 my-2 w-[calc(50%-.5rem)] text-xs leading-tight text-center h-[46px] flex items-center justify-center text-white rounded-md font-display bg-purple-300">Cuota mínima de participantes: 2</div></div>
        </div>
      </div>

    </div>
  </main>
<script src="../../../variant-filter.js"></script>
</body>
</html>
