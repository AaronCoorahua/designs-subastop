<style>
:root {
  --voyager-color-vault:        oklch(0.22 0.18 285);
  --voyager-color-live:         oklch(0.72 0.16 55);

  --voyager-color-surface-card:    oklch(1 0 0);
  --voyager-color-text-on-surface: oklch(0.15 0.008 200);
  --voyager-color-text-on-dark:    oklch(1 0 0);

  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;

  --voyager-radius-md:   8px;
  --voyager-radius-pill: 9999px;

  --voyager-duration-micro: 150ms;
  --voyager-ease-default:   cubic-bezier(0.3, 0, 0, 1);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  font-family: var(--voyager-font-display);
  color: var(--voyager-color-text-on-surface);
  -webkit-font-smoothing: antialiased;
}

.preview-stage {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  padding: 0;
}

.preview-frame {
  width: 100%;
  max-width: 372px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ── Header — brackets pegados al texto, color live ─────────────────────── */
.preview-frame .head-info {
  position: relative;
  display: inline-block;
  width: fit-content;
  padding: 8px 12px;
  color: var(--voyager-color-live);
}

.preview-frame .head-info .bracket {
  position: absolute;
  width: 8px;
  height: 8px;
  color: var(--voyager-color-live);
  fill: var(--voyager-color-live);
}

.preview-frame .head-info .bracket-tl { top: 0; left: 0; }
.preview-frame .head-info .bracket-br { bottom: 0; right: 0; }

.preview-frame .head-title {
  font-family: var(--voyager-font-display);
  font-size: 12px;
  font-weight: 700;
  line-height: 16px;
  color: var(--voyager-color-vault);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin: 0;
  white-space: nowrap;
}

/* ── Row de 4 cards ──────────────────────────────────────────────────────── */
.preview-frame .row {
  display: flex;
  flex-direction: row;
  gap: 16px;
}

.preview-frame .category-card {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1 1 0;
  min-width: 0;
  height: 92px;
  padding: 8px 12px;
  gap: 8px;
  background: var(--voyager-color-surface-card);
  border-radius: var(--voyager-radius-md);
  box-shadow: 0 0 8px rgba(0, 0, 0, 0.14);
  text-decoration: none;
  transition:
    transform var(--voyager-duration-micro) var(--voyager-ease-default),
    box-shadow var(--voyager-duration-micro) var(--voyager-ease-default);
}

.preview-frame .category-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
}

.preview-frame .category-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  color: var(--voyager-color-vault);
}

.preview-frame .category-icon svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
}

.preview-frame .category-icon-pill {
  width: 24px;
  height: 24px;
  border-radius: var(--voyager-radius-pill);
  background: var(--voyager-color-vault);
  color: var(--voyager-color-text-on-dark);
}

.preview-frame .category-icon-pill svg {
  width: 12px;
  height: 12px;
  fill: currentColor;
}

.preview-frame .category-label {
  font-family: var(--voyager-font-display);
  font-size: 10px;
  font-weight: 700;
  line-height: 14px;
  text-align: center;
  color: var(--voyager-color-vault);
  text-transform: uppercase;
}

@media (prefers-reduced-motion: reduce) {
  .preview-frame * { transition: none !important; transform: none !important; }
}
</style>
</head>
