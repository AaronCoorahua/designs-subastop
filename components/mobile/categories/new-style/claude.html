<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Subastop Designs — Mobile · Categorías · New Style</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ─────────────────────────────────────────────────────────────────────────
   CategoryCard · New Style — Icon-wrap vault
   Spec visual: 93 × 92 · superficie blanca · icon-wrap = square tinted vault
   con icono vault sólido al centro · label vault uppercase.
   Default · Hover · Focus armonizados con OfferType cinematic.
   ───────────────────────────────────────────────────────────────────────── */
:root {
  --voyager-color-vault:           oklch(0.22 0.18 285);
  --voyager-color-vault-soft:      color-mix(in oklch, var(--voyager-color-vault) 10%, oklch(1 0 0));
  --voyager-color-vault-tint:      color-mix(in oklch, var(--voyager-color-vault) 16%, oklch(1 0 0));
  --voyager-color-live:            oklch(0.72 0.16 55);

  --voyager-color-surface-card:    oklch(1 0 0);
  --voyager-color-text-on-surface: oklch(0.15 0.008 200);

  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;

  --voyager-radius-sm:   6px;
  --voyager-radius-md:   8px;
  --voyager-radius-lg:   12px;

  --voyager-duration-micro: 220ms;
  --voyager-ease-default:   cubic-bezier(0.25, 0.8, 0.25, 1);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  font-family: var(--voyager-font-display);
  color: var(--voyager-color-text-on-surface);
  -webkit-font-smoothing: antialiased;
}

.preview-stage {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  padding: 0;
}

.preview-frame {
  width: 100%;
  max-width: 408px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ── Header — brackets pegados al texto, color live ─────────────────────── */
.preview-frame .head-info {
  position: relative;
  display: inline-block;
  width: fit-content;
  padding: 8px 12px;
  color: var(--voyager-color-live);
}

.preview-frame .head-info .bracket {
  position: absolute;
  width: 8px;
  height: 8px;
  color: var(--voyager-color-live);
  fill: var(--voyager-color-live);
}

.preview-frame .head-info .bracket-tl { top: 0; left: 0; }
.preview-frame .head-info .bracket-br { bottom: 0; right: 0; }

.preview-frame .head-title {
  font-family: var(--voyager-font-display);
  font-size: 12px;
  font-weight: 700;
  line-height: 16px;
  color: var(--voyager-color-vault);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin: 0;
  white-space: nowrap;
}

/* ── Row de 4 cards ─────────────────────────────────────────────────────── */
.preview-frame .row {
  display: flex;
  flex-direction: row;
  gap: 12px;
}

/* ── CategoryCard cinematic — 93 × 92 ────────────────────────────────────
   Estructura: icon-wrap (36×36 vault-tinted) + label vault.
   ───────────────────────────────────────────────────────────────────────── */
.pcat {
  flex: 1 1 0;
  min-width: 0;
  height: 92px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 8px;
  background: var(--voyager-color-surface-card);
  border-radius: var(--voyager-radius-lg);
  text-decoration: none;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  outline: none;
  box-shadow:
    0 4px 16px oklch(0 0 0 / 0.10),
    0 1px 4px  oklch(0 0 0 / 0.05);
  transition:
    transform  0.2s  var(--voyager-ease-default),
    box-shadow 0.25s ease;
  transform: translateZ(0);
}

/* Top inset shine — añade profundidad */
.pcat::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg,
    oklch(1 0 0 / 0.55) 0%,
    transparent 40%
  );
  pointer-events: none;
  z-index: 0;
}

/* ── Icon-wrap — square tinted vault ─────────────────────────────────── */
.pcat-icon-wrap {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: var(--voyager-radius-md);
  background: var(--voyager-color-vault-soft);
  box-shadow: inset 0 0 0 1px color-mix(in oklch, var(--voyager-color-vault) 8%, transparent);
  color: var(--voyager-color-vault);
  transition:
    background var(--voyager-duration-micro) ease,
    box-shadow var(--voyager-duration-micro) ease,
    color      var(--voyager-duration-micro) ease;
}

.pcat-icon-wrap svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

/* ── Label ──────────────────────────────────────────────────────────── */
.pcat-label {
  position: relative;
  z-index: 1;
  font-family: var(--voyager-font-display);
  font-size: 10px;
  font-weight: 700;
  line-height: 14px;
  text-align: center;
  color: var(--voyager-color-vault);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* ── Hover lift ─────────────────────────────────────────────────────── */
.pcat:hover,
.pcat--hover {
  transform: translateY(-2px);
  box-shadow:
    0 6px 16px oklch(0 0 0 / 0.14),
    0 2px 6px  oklch(0 0 0 / 0.08);
}

.pcat:hover .pcat-icon-wrap,
.pcat--hover .pcat-icon-wrap {
  background: var(--voyager-color-vault-tint);
}

/* ── Focus / pressed ────────────────────────────────────────────────── */
.pcat:active,
.pcat--focus {
  transform: scale(0.97);
  box-shadow:
    0 2px 8px oklch(0 0 0 / 0.10),
    inset 0 2px 6px oklch(0 0 0 / 0.10);
}

.pcat:active .pcat-icon-wrap,
.pcat--focus .pcat-icon-wrap {
  background: var(--voyager-color-vault);
  color: oklch(1 0 0);
}

@media (prefers-reduced-motion: reduce) {
  .preview-frame * { transition: none !important; transform: none !important; }
}
</style>
