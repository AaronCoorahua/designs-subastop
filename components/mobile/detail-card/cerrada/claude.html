<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mobile · Detail Card · Cerrada — Voyager Upgrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault:         oklch(0.22 0.18 285);
  --voyager-color-live:          oklch(0.72 0.16 55);
  --voyager-color-live-light:    oklch(0.80 0.13 70);
  --voyager-color-live-dark:     oklch(0.62 0.17 50);
  --voyager-color-surface-card:  oklch(1 0 0);
  --voyager-color-surface-page:  oklch(0.98 0.004 160);
  --voyager-color-text-on-dark:  oklch(1 0 0);

  --voyager-gradient-live:
    linear-gradient(160deg,
      oklch(0.80 0.13 70)  0%,
      oklch(0.72 0.16 55) 55%,
      oklch(0.62 0.17 50) 100%);

  --voyager-radius-sm:   4px;
  --voyager-radius-md:   8px;
  --voyager-shadow-card: 0 8px 16px oklch(0.22 0.18 285 / 6%);
  --voyager-ease: cubic-bezier(0.3, 0, 0, 1);
  --voyager-font: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background:
    radial-gradient(ellipse 65% 45% at top left,    oklch(0.22 0.18 285 / 5%) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at bottom right, oklch(0.72 0.16 55 / 5%) 0%, transparent 55%),
    var(--voyager-color-surface-page);
  font-family: var(--voyager-font);
  -webkit-font-smoothing: antialiased;
}

.preview-stage {
  display: flex;
  justify-content: center;
  padding: 56px 24px 80px;
}
.variants-row {
  display: flex;
  flex-direction: column;
  gap: 48px;
  align-items: center;
}
.variant-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.variant-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: color-mix(in oklch, var(--voyager-color-vault) 45%, white);
  text-align: center;
}
.variant-desc {
  font-size: 11px;
  font-weight: 400;
  color: color-mix(in oklch, var(--voyager-color-vault) 35%, white);
  text-align: center;
  margin-top: -8px;
  max-width: 280px;
  line-height: 1.4;
}

.card-closed {
  width: 372px;
  height: 422px;
  border-radius: 0 0 var(--voyager-radius-md) var(--voyager-radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  box-shadow: var(--voyager-shadow-card);
}

.card-closed-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 0;
  padding: 32px 40px;
  position: relative;
  z-index: 2;
  width: 100%;
}

.headline {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  margin-bottom: 20px;
}
.label-oferta {
  font-family: var(--voyager-font);
  font-size: 20px;
  font-weight: 300;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  line-height: 1;
}
.label-cerrada {
  font-family: var(--voyager-font);
  font-size: 40px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  line-height: 1;
}
.divider {
  width: 40px;
  height: 1px;
  margin: 0 auto 20px;
  border: none;
}
.label-sub {
  font-family: var(--voyager-font);
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.04em;
  margin: 0 0 24px;
  line-height: 1;
}
.cta-btn {
  display: inline-block;
  font-family: var(--voyager-font);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-decoration: none;
  padding: 11px 22px;
  border-radius: var(--voyager-radius-sm);
  cursor: pointer;
  transition:
    background 200ms var(--voyager-ease),
    border-color 200ms var(--voyager-ease),
    color 200ms var(--voyager-ease),
    box-shadow 200ms var(--voyager-ease),
    transform 120ms var(--voyager-ease),
    filter 150ms var(--voyager-ease);
}

/* V1 — NARANJA SÓLIDO */
.v1 {
  background: var(--voyager-gradient-live);
}
.v1::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, oklch(1 0 0 / 10%) 0%, transparent 40%);
  pointer-events: none;
}
.v1::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 40%;
  background: linear-gradient(0deg, oklch(0.62 0.17 50 / 25%) 0%, transparent 100%);
  pointer-events: none;
}
.v1 .label-oferta  { color: oklch(1 0 0 / 75%); }
.v1 .label-cerrada { color: var(--voyager-color-text-on-dark); }
.v1 .divider       { background: oklch(1 0 0 / 28%); }
.v1 .label-sub     { color: oklch(1 0 0 / 72%); }
.v1 .cta-btn {
  border: 1.5px solid oklch(1 0 0 / 55%);
  background: transparent;
  color: var(--voyager-color-text-on-dark);
}
.v1 .cta-btn:hover {
  background: white;
  border-color: white;
  color: var(--voyager-color-live);
  box-shadow: 0 4px 16px oklch(0.62 0.17 50 / 30%);
  transform: translateY(-1px);
}
</style>
</head>
<body>
<main class="preview-stage" aria-label="Mobile · Detail Card · Cerrada — Voyager upgrade">
  <div class="variants-row">

    <div class="variant-block">
      <p class="variant-label">Naranja Sólido</p>
      <div class="card-closed v1">
        <div class="card-closed-content">
          <div class="headline">
            <span class="label-oferta">Oferta</span>
            <span class="label-cerrada">Cerrada</span>
          </div>
          <hr class="divider" />
          <p class="label-sub">En Consulta</p>
          <a class="cta-btn" href="#">Ver ofertas relacionadas</a>
        </div>
      </div>
    </div>

  </div>
</main>
<script src="../../../variant-filter.js"></script>
</body>
</html>
