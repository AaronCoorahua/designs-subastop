<style>
:root {
  --voyager-color-vault:           oklch(0.22 0.18 285);
  --voyager-color-vault-mid:       oklch(0.30 0.20 285);
  --voyager-color-live:            oklch(0.72 0.16 55);
  --voyager-color-negotiable:      oklch(0.78 0.14 195);
  --voyager-color-surface-card:    oklch(1 0 0);
  --voyager-color-surface-page:    oklch(0.98 0.004 160);
  --voyager-color-text-on-dark:    oklch(1 0 0);
  --voyager-color-text-muted:      color-mix(in oklch, oklch(0.22 0.18 285) 45%, white);

  --voyager-gradient-vault:
    linear-gradient(135deg, oklch(0.22 0.18 285) 0%, oklch(0.30 0.20 285) 100%);
  --voyager-gradient-live:
    linear-gradient(180deg,
      oklch(0.82 0.14 70) 0%,
      oklch(0.72 0.16 55) 55%,
      oklch(0.60 0.17 48) 100%
    );

  --voyager-radius-sm:   4px;
  --voyager-radius-md:   8px;
  --voyager-radius-full: 9999px;

  --voyager-shadow-card:      0 8px 16px oklch(0.22 0.18 285 / 6%);
  --voyager-shadow-like:      0 4px 16px oklch(0.22 0.18 285 / 20%);
  --voyager-shadow-cta-live:  0 8px 24px oklch(0.72 0.16 55 / 32%),
                               inset 0 1px 0 oklch(1 0 0 / 18%);

  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-ease-default: cubic-bezier(0.3, 0, 0, 1);

  --voyager-color-text-price: oklch(0.53 0.13 193);  /* #008688 */
  --voyager-gradient-vault2:  linear-gradient(135deg, oklch(0.15 0.27 278) 0%, oklch(0.38 0.21 282) 100%);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background:
    radial-gradient(ellipse 70% 50% at top left,    oklch(0.22 0.18 285 / 4%) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at bottom right, oklch(0.72 0.16 55 / 4%) 0%, transparent 55%),
    var(--voyager-color-surface-page);
  font-family: var(--voyager-font-display);
  -webkit-font-smoothing: antialiased;
}
.preview-stage {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  padding: 56px 24px;
}
.variants-row {
  display: flex;
  flex-direction: row;
  gap: 40px;
  align-items: flex-start;
  flex-wrap: wrap;
  justify-content: center;
}
.variant-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.variant-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--voyager-color-text-muted);
  text-align: center;
}
.preview-frame { width: 372px; height: 422px; overflow: hidden; }
.preview-frame .detail-process-app,
.preview-frame .wrap-process,
.preview-frame [device="web"],
.preview-frame .card-process { height: 100%; }

.preview-frame .vmc-detail-relative  { position: relative; }
.preview-frame .vmc-detail-absolute  { position: absolute; }
.preview-frame .vmc-detail-flex      { display: flex; }
.preview-frame .vmc-detail-flex-col  { flex-direction: column; }
.preview-frame .vmc-detail-flex-1    { flex: 1 1 0%; }
.preview-frame .vmc-detail-flex-shrink   { flex-shrink: 1; }
.preview-frame .vmc-detail-items-center   { align-items: center; }
.preview-frame .vmc-detail-justify-center { justify-content: center; }
.preview-frame .vmc-detail-justify-end    { justify-content: flex-end; }
.preview-frame .vmc-detail-justify-start  { justify-content: flex-start; }
.preview-frame .vmc-detail-w-full   { width: 100%; }
.preview-frame .vmc-detail-w-1\/2   { width: 50%; }
.preview-frame .vmc-detail-h-5      { height: 20px; }
.preview-frame .vmc-detail-h-6      { height: 24px; }
.preview-frame .vmc-detail-w-6      { width: 24px; }
.preview-frame .vmc-detail-w-auto   { width: auto; }
.preview-frame .vmc-detail-inset-x-0 { left: 0; right: 0; }
.preview-frame .vmc-detail-top-0     { top: 0; }
.preview-frame .vmc-detail-select-none    { user-select: none; }
.preview-frame .vmc-detail-cursor-pointer { cursor: pointer; }
.preview-frame .vmc-detail-z-1  { z-index: 1; }
.preview-frame .vmc-detail-z-2  { z-index: 2; }
.preview-frame .vmc-detail-z-9  { z-index: 9; }
.preview-frame .vmc-detail-z-10 { z-index: 10; }
.preview-frame .vmc-detail-inline-flex   { display: inline-flex; }

.preview-frame .vmc-detail-px-5  { padding-left: 20px;  padding-right: 20px; }
.preview-frame .vmc-detail-px-8  { padding-left: 32px;  padding-right: 32px; }
.preview-frame .vmc-detail-py-3  { padding-top: 12px;   padding-bottom: 12px; }
.preview-frame .vmc-detail-py-5  { padding-top: 20px;   padding-bottom: 20px; }
.preview-frame .vmc-detail-pl-6  { padding-left: 24px; }
.preview-frame .vmc-detail-mt-2  { margin-top: 8px; }
.preview-frame .vmc-detail-mt-4  { margin-top: 16px; }
.preview-frame .vmc-detail-mt-5  { margin-top: 20px; }
.preview-frame .vmc-detail-mb-2  { margin-bottom: 8px; }
.preview-frame .vmc-detail-ml-2  { margin-left: 8px; }
.preview-frame .vmc-detail-ml-3  { margin-left: 12px; }
.preview-frame .vmc-detail-mr-2  { margin-right: 8px; }
.preview-frame .vmc-detail--mt-8 { margin-top: -32px; }
.preview-frame .vmc-detail--mt-3 { margin-top: -12px; }
.preview-frame .vmc-detail-mx-1  { margin-left: 4px; margin-right: 4px; }

.preview-frame .vmc-detail-font-display  { font-family: var(--voyager-font-display); }
.preview-frame .vmc-detail-font-bold     { font-weight: 700; }
.preview-frame .vmc-detail-font-normal   { font-weight: 400; }
.preview-frame .vmc-detail-font-light    { font-weight: 300; }
.preview-frame .vmc-detail-font-semibold { font-weight: 600; }
.preview-frame .vmc-detail-text-sm       { font-size: 13px; }
.preview-frame .vmc-detail-text-lg       { font-size: 17px; }
.preview-frame .vmc-detail-text-xl       { font-size: 20px; }
.preview-frame .vmc-detail-text-2xl      { font-size: 24px; }
.preview-frame .vmc-detail-text-xxs      { font-size: 10px; }
.preview-frame .vmc-detail-uppercase     { text-transform: uppercase; }
.preview-frame .vmc-detail-text-center   { text-align: center; }
.preview-frame .vmc-detail-leading-none  { line-height: 1; }
.preview-frame .vmc-detail-leading-tight { line-height: 1.2; }
.preview-frame .vmc-detail-leading-thing { line-height: 1.15; }

.preview-frame .vmc-detail-rounded-full { border-radius: var(--voyager-radius-full); }
.preview-frame .vmc-detail-rounded      { border-radius: var(--voyager-radius-sm); }
.preview-frame .vmc-detail-border       { border-width: 1.5px; border-style: solid; }
.preview-frame .vmc-detail-border-none  { border: none; }
.preview-frame .vmc-detail-fill-current { fill: currentColor; }
.preview-frame .vmc-detail-transition-colors {
  transition: color 150ms var(--voyager-ease-default),
              background-color 150ms var(--voyager-ease-default);
}
.preview-frame .vmc-detail-duration-200  { transition-duration: 200ms; }
.preview-frame .vmc-detail-shadow-lg     { box-shadow: var(--voyager-shadow-card); }
.preview-frame .focus\:vmc-detail-outline-none:focus { outline: none; }
.preview-frame .v-portal { display: none !important; }
.preview-frame .vue-portal-target { display: none !important; }

.preview-frame .card-process {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 0 0 var(--voyager-radius-md) var(--voyager-radius-md);
  box-shadow: var(--voyager-shadow-card);
}
.preview-frame .cp-content  { flex: 1; display: flex; flex-direction: column; }
.preview-frame .cta-contains { flex: 1; }

.preview-frame .cp-header           { color: var(--voyager-color-text-on-dark); padding-top: 20px; }
.preview-frame .cp-header *         { color: inherit; }
.preview-frame .vmc-detail-border-b { border-bottom: 1px solid oklch(1 0 0 / 14%); }
.preview-frame .vmc-detail-border-l { border-left:   1px solid oklch(1 0 0 / 14%); }

.preview-frame .cp-indicators-icon.vmc-detail-border {
  width: 28px; height: 28px;
  border: 1.5px solid oklch(1 0 0 / 28%) !important;
  color: white;
}

.preview-frame .cta-like-button {
  width: 44px; height: 44px;
  background: oklch(1 0 0 / 12%);

  color: oklch(1 0 0 / 70%);

}
.preview-frame .cta-like-button.is-guest {

.preview-frame .content-like-button .vmc-detail-font-display { color: white; }

.preview-frame .vmc-detail-bg-white {

}

.preview-frame .vmc-detail-text-damask {

}

.preview-frame .vmc-detail-text-oracle {

}
.preview-frame .cp-base-price-info.vmc-detail-text-oracle {

}

.preview-frame .vmc-detail-bg-casablanca {
  width: 227px;
  height: 47px;
  padding-top: 0;
  padding-bottom: 0;
  margin: 0 auto;
  cursor: pointer;
  font-family: var(--voyager-font-display);
  color: var(--voyager-color-text-on-dark);
  transition: filter 150ms var(--voyager-ease-default),
              transform 100ms var(--voyager-ease-default);
}
.preview-frame .vmc-detail-bg-casablanca:hover  { filter: brightness(1.07); }
.preview-frame .vmc-detail-bg-casablanca:active { transform: scale(0.98); }
.preview-frame .vmc-detail-bg-casablanca .vmc-detail-text-white {
  color: var(--voyager-color-text-on-dark);
}

.preview-frame .display-countdown-number {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
}
.preview-frame .display-countdown-name {
  opacity: 0.7;
}

/* VARIANT 1 — Vault2 Gradient · Live Banner · Live CTA */

.v1 .vmc-detail-shadow-lg {

}
.v1 .vmc-detail-bg-casablanca {
  background: var(--voyager-gradient-live);
  position: relative;
  overflow: hidden;
}
.v1 .vmc-detail-bg-casablanca::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, oklch(1 0 0 / 14%) 0%, transparent 50%);
  pointer-events: none;
  border-radius: inherit;
}
.v1 .vmc-detail-shadow-lg {
  box-shadow: var(--voyager-shadow-cta-live);
}
</style>
