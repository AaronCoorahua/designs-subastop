<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mobile · Ofertas Relacionadas — Voyager Upgrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault:        oklch(0.22 0.18 285);
  --voyager-color-vault-mid:    oklch(0.30 0.20 285);

  --voyager-color-live:         oklch(0.72 0.16 55);
  --voyager-color-negotiable:   oklch(0.78 0.14 195);

  --voyager-color-surface-page:    oklch(0.98 0.004 160);
  --voyager-color-surface-section: oklch(0.96 0.004 160);
  --voyager-color-surface-card:    oklch(1 0 0);

  --voyager-color-text-on-surface: oklch(0.15 0.008 200);
  --voyager-color-text-muted:      color-mix(in oklch, oklch(0.38 0.04 280) 60%, transparent);

  --voyager-tint-vault-soft:    color-mix(in oklch, var(--voyager-color-vault) 6%, transparent);

  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-font-body:    "Roboto", system-ui, -apple-system, sans-serif;

  --voyager-radius-sm:   4px;
  --voyager-radius-md:   8px;
  --voyager-radius-lg:   16px;
  --voyager-radius-pill: 9999px;

  --voyager-shadow-card:     0 8px 16px oklch(0.22 0.18 285 / 6%);
  --voyager-shadow-sm:       0 2px 8px  oklch(0.22 0.18 285 / 8%);

  --voyager-duration-micro:    150ms;
  --voyager-duration-standard: 300ms;
  --voyager-ease-default:      cubic-bezier(0.3, 0, 0, 1);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: oklch(0.97 0 0);
  font-family: var(--voyager-font-body);
  color: var(--voyager-color-text-on-surface);
  -webkit-font-smoothing: antialiased;
}

.preview-stage {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  padding: 56px 24px;
}

.preview-grid {
  display: grid;
  grid-template-columns: auto;
  gap: 40px;
  align-items: start;
}

.preview-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.preview-label {
  font-family: var(--voyager-font-display);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--voyager-color-text-muted);
  margin: 0 0 16px 0;
}

.preview-frame {
  width: 430px;
  overflow: hidden;
}

.preview-frame .root {
  position: relative;
  width: 100%;
  padding: 16px 0 16px;
  border-radius: var(--voyager-radius-lg);
  background: var(--voyager-color-surface-card);
  box-shadow: var(--voyager-shadow-card);
  background-image:
    linear-gradient(145deg,
      color-mix(in oklch, var(--voyager-color-vault) 2%, transparent) 0%,
      transparent 50%);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.preview-frame .root::after {
  content: "";
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 6px;
  background: var(--voyager-color-vault);
  border-radius: 0 0 var(--voyager-radius-lg) var(--voyager-radius-lg);
  pointer-events: none;
  z-index: 0;
}

/* Header — head-simple variante (título + link "Ver más") */
.preview-frame .head.head-simple {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0;
  margin: 0 16px;
}

.preview-frame .head-simple .head-info {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  gap: 2px;
  flex: 0 0 auto;
  width: fit-content;
  padding: 4px 12px 4px 12px;
}

.preview-frame .head .bracket {
  position: absolute;
  width: 8px;
  height: 8px;
  color: var(--voyager-color-live);
  fill: currentColor;
}
.preview-frame .head .bracket-tl { top: 0; left: 0; }
.preview-frame .head .bracket-br { bottom: 0; right: 0; }

.preview-frame .head-title {
  font-family: var(--voyager-font-display);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--voyager-color-vault);
  line-height: 1;
}

.preview-frame .head-sub {
  font-family: var(--voyager-font-display);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--voyager-color-text-muted);
  line-height: 1.2;
}

.preview-frame .head-simple .head-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 10px;
  margin: -4px -8px 0 0;
  font-family: var(--voyager-font-display);
  font-size: 11px;
  font-weight: 700;
  color: var(--voyager-color-vault);
  background: transparent;
  border-radius: var(--voyager-radius-sm);
  text-decoration: none;
  transition: background-color var(--voyager-duration-micro) var(--voyager-ease-default);
}

.preview-frame .head-simple .head-link svg {
  width: 11px;
  height: 11px;
  fill: var(--voyager-color-vault);
  transition: transform var(--voyager-duration-micro) var(--voyager-ease-default);
}

.preview-frame .head-simple .head-link:hover {
  background-color: var(--voyager-tint-vault-soft);
}
.preview-frame .head-simple .head-link:hover svg {
  transform: translateX(2px);
}

/* Grid — 2 columnas × 2 filas */
.preview-frame .grid {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 0 16px;
}

/* Vehicle card simple */
.preview-frame .vcard-simple {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--voyager-color-surface-card);
  border-radius: var(--voyager-radius-sm);
  box-shadow: var(--voyager-shadow-sm);
  overflow: hidden;
  border-bottom: 6px solid var(--voyager-color-live);
  min-width: 0;
}

.preview-frame .vcard-simple[data-status="negotiable"] {
  border-bottom-color: var(--voyager-color-negotiable);
}

.preview-frame .vcard-simple .simple-image {
  position: relative;
  width: 100%;
  height: 100px;
  background: linear-gradient(
    145deg,
    oklch(0.91 0.022 285) 0%,
    oklch(0.94 0.010 220) 60%,
    oklch(0.96 0.005 160) 100%);
  overflow: hidden;
}

.preview-frame .vcard-simple .simple-image img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

.preview-frame .vcard-simple .live-dot {
  position: absolute;
  top: 8px;
  right: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: var(--voyager-radius-pill);
  background: var(--voyager-color-live);
  box-shadow: 0 2px 6px color-mix(in oklch, var(--voyager-color-live) 40%, transparent);
}

.preview-frame .vcard-simple .live-dot::after {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: var(--voyager-radius-pill);
  background: var(--voyager-color-surface-card);
}

.preview-frame .vcard-simple .simple-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 12px 4px;
}

.preview-frame .vcard-simple .simple-title {
  font-family: var(--voyager-font-display);
  font-size: 14px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--voyager-color-vault);
  line-height: 1.1;
}

.preview-frame .vcard-simple .simple-year {
  font-family: var(--voyager-font-display);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--voyager-color-text-muted);
  line-height: 1.2;
}

.preview-frame .vcard-simple .simple-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px 12px;
  margin-top: auto;
}

.preview-frame .vcard-simple .simple-price {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: 1 1 auto;
  min-width: 0;
}

.preview-frame .vcard-simple .shield {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: var(--voyager-radius-pill);
  background: var(--voyager-color-negotiable);
  color: var(--voyager-color-surface-card);
}

.preview-frame .vcard-simple .shield svg {
  width: 13px;
  height: 13px;
  fill: currentColor;
}

.preview-frame .vcard-simple .price-text {
  font-family: var(--voyager-font-display);
  font-size: 12px;
  font-weight: 700;
  color: var(--voyager-color-vault);
  line-height: 1;
  white-space: nowrap;
}

.preview-frame .vcard-simple .heart-outline {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--voyager-radius-pill);
  background: var(--voyager-color-surface-card);
  color: var(--voyager-color-vault);
  border: 0;
  cursor: pointer;
  box-shadow: 0 2px 6px color-mix(in oklch, var(--voyager-color-vault) 16%, transparent);
  transition:
    background var(--voyager-duration-micro) var(--voyager-ease-default),
    transform  var(--voyager-duration-micro) var(--voyager-ease-default);
}

.preview-frame .vcard-simple .heart-outline svg {
  width: 14px;
  height: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
}

.preview-frame .vcard-simple .heart-outline:hover {
  background: var(--voyager-tint-vault-soft);
  transform: scale(1.06);
}

@media (prefers-reduced-motion: reduce) {
  .preview-frame * { transition: none !important; transform: none !important; }
}
</style>
