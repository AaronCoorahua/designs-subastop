<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mobile · User Profile Card — Voyager Upgrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault:           oklch(0.22 0.18 285);
  --voyager-color-vault-mid:       oklch(0.30 0.20 285);
  --voyager-color-live:            oklch(0.72 0.16 55);
  --voyager-color-surface-page:    oklch(0.98 0.004 160);
  --voyager-color-surface-card:    oklch(1 0 0);
  --voyager-color-text-on-surface: oklch(0.15 0.008 200);
  --voyager-color-text-muted:      color-mix(in oklch, oklch(0.38 0.04 280) 60%, transparent);
  --voyager-color-skeleton:        oklch(0.85 0.008 220);
  --voyager-color-divider-section: color-mix(in oklch, oklch(0.22 0.18 285) 5%, transparent);

  --voyager-radius-sm:    0px;
  --voyager-radius-md:    0px;
  --voyager-radius-lg:    0px;
  --voyager-radius-pill:  9999px;

  --voyager-shadow-card:  0 8px 16px oklch(0.22 0.18 285 / 6%);

  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-ease-default: cubic-bezier(0.3, 0, 0, 1);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: transparent;
  font-family: var(--voyager-font-display);
  color: var(--voyager-color-text-on-surface);
  -webkit-font-smoothing: antialiased;
}

.preview-stage {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  padding: 0;
}

.preview-frame {
  width: 100%;
  max-width: 430.4px;
  height: 150.6px;
  overflow: hidden;
}

.preview-frame .card {
  position: relative;
  width: 100%;
  height: 100%;
  background: var(--voyager-color-surface-card);
  box-shadow: var(--voyager-shadow-card);
  padding: 20px 22px 24px;
  border-radius: 12px;
  overflow: hidden;
  background-image:
    linear-gradient(135deg,
      color-mix(in oklch, var(--voyager-color-vault) 3%, transparent) 0%,
      transparent 60%);
}

.preview-frame .card::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 8px;
  background: var(--voyager-color-live);
  pointer-events: none;
}

.preview-frame .row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.preview-frame .row + .row { margin-top: 12px; }

.preview-frame .greeting {
  flex: 1 1 0%;
  color: var(--voyager-color-vault);
  text-transform: uppercase;
  font-family: var(--voyager-font-display);
}

.preview-frame .greeting .hi {
  display: block;
  font-size: 17px;
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: 0.04em;
}

.preview-frame .greeting .name {
  display: block;
  font-size: 24px;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.01em;
}

.preview-frame .link-profile,
.preview-frame .link-history {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--voyager-font-display);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.5;
  color: var(--voyager-color-vault);
  text-decoration: none;
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
}

.preview-frame .link-profile svg { color: var(--voyager-color-live); }
.preview-frame .link-history svg { color: var(--voyager-color-vault); }

.preview-frame .risk {
  flex: 1 1 0%;
  font-family: var(--voyager-font-display);
  font-size: 14px;
  font-weight: 400;
  color: var(--voyager-color-vault);
}
.preview-frame .risk strong { font-weight: 700; }

.preview-frame .points {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--voyager-font-display);
  font-size: 14px;
  color: var(--voyager-color-vault);
}
.preview-frame .points .star { width: 20px; height: 20px; color: var(--voyager-color-skeleton); }
.preview-frame .points .num { font-weight: 700; }
.preview-frame .points .info {
  width: 16px; height: 16px;
  color: var(--voyager-color-vault-mid);
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.preview-frame svg { display: inline-block; vertical-align: middle; }
.preview-frame .fill-current { fill: currentColor; }
</style>
</head>
<body>
  <main class="preview-stage" aria-label="Mobile · User Profile Card — Voyager upgrade">
    <div class="preview-frame">
      <div class="card">
        <div class="row">
          <div class="greeting">
            <span class="hi">Hola,</span>
            <span class="name">COOT8R</span>
          </div>
          <a href="#" class="link-profile">
            Tu perfil
            <svg class="fill-current" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 17.4L13.6 12 8 6.6 9.7 5 17 12 9.7 19 8 17.4Z" fill="currentColor"/></svg>
          </a>
        </div>
        <div class="row">
          <div class="risk">Riesgo: <strong>Regular</strong></div>
          <div class="points">
            <span>Puntos VMC:</span>
            <svg class="star fill-current" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.9L22 9.6l-5.5 4.8L18 22l-6-3.6L6 22l1.5-7.6L2 9.6l7.1-.7z"/></svg>
            <span class="num">0</span>
            <button type="button" class="info" aria-label="leyenda">
              <svg class="fill-current" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm.9 15h-1.8v-6h1.8v6zM12 8.2a1.1 1.1 0 110-2.2 1.1 1.1 0 010 2.2z"/></svg>
            </button>
          </div>
        </div>
        <div class="row">
          <button type="button" class="link-history">
            Historial
            <svg class="fill-current" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 17.4L13.6 12 8 6.6 9.7 5 17 12 9.7 19 8 17.4Z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
<script src="../../variant-filter.js"></script>
</body>
</html>
