<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Subastop Designs — Voyager Upgrade · Your Profile Info</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Voyager DS — token surface
   ──────────────────────────────────────────────────────────────────────── */
:root {
  /* Brand */
  --voyager-color-vault:           oklch(0.22 0.18 285);   /* #22005C */
  --voyager-color-vault-mid:       oklch(0.30 0.20 285);   /* #3B1782 */
  --voyager-color-vault-dark:      oklch(0.26 0.19 285);   /* #2E0F70 */
  --voyager-color-live:            oklch(0.72 0.16 55);    /* #ED8936 */
  --voyager-color-live-strong:     oklch(0.62 0.18 45);

  /* Surfaces */
  --voyager-color-surface-card:    oklch(1 0 0);

  /* Text */
  --voyager-color-text-on-surface: oklch(0.15 0.008 200);
  --voyager-color-text-muted:      color-mix(in oklch, oklch(0.38 0.04 280) 60%, transparent);

  /* Utility */
  --voyager-color-border-ghost:    color-mix(in oklch, var(--voyager-color-vault) 10%, transparent);

  /* Typography */
  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-font-body:    "Roboto", system-ui, -apple-system, sans-serif;

  /* Radius */
  --voyager-radius-sm:   4px;
  --voyager-radius-md:   8px;

  /* Shadows */
  --voyager-shadow-card:     0 8px 16px oklch(0.22 0.18 285 / 6%);
  --voyager-shadow-floating: 0 12px 28px oklch(0.22 0.18 285 / 12%);

  /* Motion */
  --voyager-duration-micro: 150ms;
  --voyager-ease-default:   cubic-bezier(0.3, 0, 0, 1);

  /* ── Button Vault (purple) gradients ────────────────────────────────── */
  --btn-vault-bg:           linear-gradient(135deg, #200068 0%, #4E38AF 100%);
  --btn-vault-hover-bg:     linear-gradient(135deg, #22005C 0%, #3B1782 100%);
  --btn-vault-pressed-bg:   linear-gradient(135deg, #3B1782 0%, #2E0F70 100%);
  --btn-vault-shadow:       0 4px 16px oklch(0.22 0.18 285 / 36%);
  --btn-vault-shadow-hover: 0 6px 22px oklch(0.22 0.18 285 / 50%);
  --btn-vault-focus-ring:   oklch(0.30 0.20 285);   /* #3B1782 */

  /* ── Button Live (orange) gradients ─────────────────────────────────── */
  --btn-live-bg:            linear-gradient(135deg, #F4AC59 0%, #ED8936 50%, #D07128 100%);
  --btn-live-hover-bg:      linear-gradient(135deg, #ED8936 0%, #D07128 50%, #B25614 100%);
  --btn-live-pressed-bg:    linear-gradient(135deg, #B25614 0%, #93420A 100%);
  --btn-live-shadow:        0 4px 16px oklch(0.72 0.16 55 / 36%);
  --btn-live-shadow-hover:  0 6px 22px oklch(0.72 0.16 55 / 50%);
  --btn-live-focus-ring:    oklch(0.62 0.18 45);    /* live-strong */
}

/* ─────────────────────────────────────────────────────────────────────────
   Preview canvas
   ──────────────────────────────────────────────────────────────────────── */
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background:
    radial-gradient(ellipse 70% 50% at top left, oklch(0.22 0.18 285 / 4%), transparent 60%),
    radial-gradient(ellipse 55% 40% at bottom right, oklch(0.72 0.16 55 / 5%), transparent 55%),
    oklch(0.97 0 0);
  font-family: var(--voyager-font-body);
  color: var(--voyager-color-text-on-surface);
  -webkit-font-smoothing: antialiased;
}

.preview-stage {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  min-width: max-content;
  padding: 56px 24px;
}

.preview-grid {
  display: grid;
  grid-template-columns: auto;
  gap: 40px;
  align-items: start;
}

.preview-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.preview-label {
  font-family: var(--voyager-font-display);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--voyager-color-text-muted);
  margin: 0 0 16px;
}

/* ─────────────────────────────────────────────────────────────────────────
   Card root — 766×277px per spec
   ──────────────────────────────────────────────────────────────────────── */
.card-root {
  width: 766px;
  background: var(--voyager-color-surface-card);
  border-radius: var(--voyager-radius-md);
  box-shadow: var(--voyager-shadow-card);
  padding: 24px 32px 28px;
}

/* Title */
.card-title {
  font-family: var(--voyager-font-display);
  font-size: 24px;
  font-weight: 700;
  line-height: 1.25;
  color: var(--voyager-color-live);
  margin: 0;
  letter-spacing: -0.01em;
}

/* ── Info row ────────────────────────────────────────────────────────────── */
.info-section {
  display: grid;
  grid-template-columns: 300px 1fr;
  align-items: center;
  column-gap: 16px;
  margin-top: 16px;
}

.risk-row {
  display: flex;
  align-items: center;
  font-family: var(--voyager-font-display);
  font-size: 14px;
  font-weight: 300;
  color: var(--voyager-color-vault);
}

.risk-label {
  flex-grow: 1;
}

.risk-label strong {
  font-weight: 700;
}

.points-wrap {
  flex-shrink: 0;
}

.points-inner {
  display: flex;
  align-items: center;
  gap: 4px;
  font-family: var(--voyager-font-display);
  font-size: 14px;
  font-weight: 300;
  color: var(--voyager-color-vault);
}

.points-star-group {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: 4px;
}

.star-inactive {
  width: 20px;
  height: 20px;
  fill: oklch(0.82 0.02 220);
  flex-shrink: 0;
}

.pts-value {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.25;
  color: var(--voyager-color-vault);
}

/* ── Button area ─────────────────────────────────────────────────────────── */
.btn-area {
  text-align: right;
}

.btn-redeem {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  border: none;
  border-radius: var(--voyager-radius-md);
  font-family: var(--voyager-font-display);
  font-size: 16px;
  font-weight: 600;
  line-height: 24px;
  color: #ffffff;
  text-decoration: none;
  cursor: pointer;
  outline: 2px solid transparent;
  outline-offset: 3px;
  transition:
    background     var(--voyager-duration-micro) var(--voyager-ease-default),
    box-shadow     var(--voyager-duration-micro) var(--voyager-ease-default),
    transform      var(--voyager-duration-micro) var(--voyager-ease-default),
    outline-color  var(--voyager-duration-micro) var(--voyager-ease-default);
}

.btn-redeem svg {
  width: 24px;
  height: 24px;
  fill: currentColor;
  flex-shrink: 0;
}

/* Vault variant */
.btn-vault {
  background: var(--btn-vault-bg);
  box-shadow: var(--btn-vault-shadow);
}
.btn-vault:hover {
  background: var(--btn-vault-hover-bg);
  box-shadow: var(--btn-vault-shadow-hover);
  transform: translateY(-1px);
}
.btn-vault:active {
  background: var(--btn-vault-pressed-bg);
  box-shadow: none;
  transform: translateY(0);
}
.btn-vault:focus-visible {
  outline-color: var(--btn-vault-focus-ring);
}

/* Live variant */
.btn-live {
  background: var(--btn-live-bg);
  box-shadow: var(--btn-live-shadow);
}
.btn-live:hover {
  background: var(--btn-live-hover-bg);
  box-shadow: var(--btn-live-shadow-hover);
  transform: translateY(-1px);
}
.btn-live:active {
  background: var(--btn-live-pressed-bg);
  box-shadow: none;
  transform: translateY(0);
}
.btn-live:focus-visible {
  outline-color: var(--btn-live-focus-ring);
}

/* ── Frozen states for preview cells ─────────────────────────────────────── */
.cell--hover .btn-vault {
  background: var(--btn-vault-hover-bg);
  box-shadow: var(--btn-vault-shadow-hover);
  transform: translateY(-1px);
}
.cell--hover .btn-live {
  background: var(--btn-live-hover-bg);
  box-shadow: var(--btn-live-shadow-hover);
  transform: translateY(-1px);
}
.cell--focus .btn-vault {
  outline-color: var(--btn-vault-focus-ring);
}
.cell--focus .btn-live {
  outline-color: var(--btn-live-focus-ring);
}

/* ── Personal info section ───────────────────────────────────────────────── */
.personal-section {
  padding-top: 16px;
  margin-top: 16px;
}

.section-title {
  font-family: var(--voyager-font-display);
  font-size: 14px;
  font-weight: 400;
  line-height: 1.25;
  color: var(--voyager-color-vault);
  margin: 0 0 16px;
}

.fields-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.field-label {
  font-family: var(--voyager-font-display);
  font-size: 14px;
  font-weight: 400;
  line-height: 1.25;
  color: var(--voyager-color-vault);
}

.field-value {
  width: 100%;
  height: 40px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  font-family: var(--voyager-font-body);
  font-size: 14px;
  font-weight: 400;
  line-height: 1.25;
  color: var(--voyager-color-text-on-surface);
  background: var(--voyager-color-surface-card);
  border: 1px solid var(--voyager-color-border-ghost);
  border-radius: var(--voyager-radius-sm);
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; transform: none !important; }
}
</style>
</head>
