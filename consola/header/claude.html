<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Consola Header - Voyager Upgrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault: #22005C;
  --voyager-color-vault-mid: #3B1782;
  --voyager-color-vault-dark: #2E0F70;
  --voyager-color-live: #ED8936;
  --voyager-color-live-mid: #F47A20;
  --voyager-color-live-dark: #C65C14;
  --voyager-color-negotiable: #00CACE;
  --voyager-surface-page: #F8FAF9;
  --voyager-surface-card: #FFFFFF;
  --voyager-text-primary: #191C1C;
  --voyager-text-secondary: #494550;
  --voyager-text-on-dark: #FFFFFF;
  --voyager-text-on-dark-muted: #FFFFFF99;
  --voyager-border-ghost: #22005C1A;
  --voyager-divider-on-dark: #FFFFFF24;
  --voyager-gradient-vault: linear-gradient(135deg, var(--voyager-color-vault, #22005C) 0%, var(--voyager-color-vault-mid, #3B1782) 100%);
  --voyager-gradient-vault-deep: linear-gradient(135deg, var(--voyager-color-vault-dark, #2E0F70) 0%, var(--voyager-color-vault, #22005C) 100%);
  --voyager-gradient-live: linear-gradient(135deg, var(--voyager-color-live, #ED8936) 0%, var(--voyager-color-live-mid, #F47A20) 100%);
  --voyager-font-ui: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --voyager-font-number: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0;
  background:
    radial-gradient(ellipse 70% 50% at top left, var(--voyager-border-ghost, #22005C1A) 0%, transparent 60%),
    var(--voyager-surface-page, #F8FAF9);
  color: var(--voyager-text-primary, #191C1C);
  font-family: var(--voyager-font-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

.preview-stage {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  padding: 56px 24px;
}

.preview-grid {
  display: grid;
  grid-template-columns: auto;
  gap: 40px;
  align-items: start;
  justify-content: center;
}

.variant-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.variant-label {
  margin: 0;
  color: color-mix(in srgb, var(--voyager-color-vault, #22005C) 62%, var(--voyager-surface-card, #FFFFFF));
  font-family: var(--voyager-font-ui);
  font-size: 11px;
  font-weight: 700;
  line-height: 16px;
  letter-spacing: 0;
  text-align: center;
}

.preview-frame {
  width: 640px;
  height: 60px;
  overflow: hidden;
}

.preview-frame .d-flex {
  display: flex;
}

.preview-frame .align-items-center {
  align-items: center;
}

.preview-frame .align-items-start {
  align-items: flex-start;
}

.preview-frame .justify-content-between {
  justify-content: space-between;
}

.preview-frame .justify-content-end {
  justify-content: flex-end;
}

.preview-frame .flex-column {
  flex-direction: column;
}

.preview-frame .flex-1 {
  flex: 1 1 auto;
}

.preview-frame .h-100 {
  height: 100%;
}

.preview-frame .position-relative,
.preview-frame .relative {
  position: relative;
}

.preview-frame .absolute {
  position: absolute;
}

.preview-frame .padding-x-10 {
  padding-left: 10px;
  padding-right: 10px;
}

.preview-frame .padding-left-10 {
  padding-left: 10px;
}

.preview-frame .margin-right-4 {
  margin-right: 4px;
}

.preview-frame .margin-left-4 {
  display: inline-flex;
  margin-left: 4px;
}

.preview-frame .header-room {
  width: 640px;
  height: 60px;
  margin: 0;
  padding: 0 14px;
  overflow: hidden;
  color: var(--voyager-text-on-dark, #FFFFFF);
  background: var(--voyager-gradient-vault, linear-gradient(135deg, var(--voyager-color-vault, #22005C) 0%, var(--voyager-color-vault-mid, #3B1782) 100%));
  font-family: var(--voyager-font-ui);
}

.preview-frame .header-data-account {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
  height: 60px;
}

.preview-frame p {
  margin: 0;
}

.preview-frame .nick-user,
.preview-frame .offer-user {
  display: flex;
  align-items: center;
  min-width: 0;
  height: 24px;
  color: var(--voyager-text-on-dark, #FFFFFF);
  font-size: 14px;
  font-weight: 500;
  line-height: 20px;
  white-space: nowrap;
}

.preview-frame .nick-user .icon,
.preview-frame .offer-user .icon {
  color: var(--voyager-text-on-dark, #FFFFFF);
}

.preview-frame .nick-user strong,
.preview-frame .offer-user strong {
  margin-left: 4px;
  color: var(--voyager-color-live, #ED8936);
  font-family: var(--voyager-font-number);
  font-size: 15px;
  font-weight: 700;
  line-height: 20px;
  font-variant-numeric: tabular-nums;
}

.preview-frame .icon {
  position: relative;
  display: inline-block;
  flex: 0 0 auto;
  width: 14px;
  height: 14px;
  margin-right: 5px;
  color: currentColor;
}

.preview-frame .icon-n2::before,
.preview-frame .icon-n2::after {
  content: "";
  position: absolute;
  left: 50%;
  background: currentColor;
  transform: translateX(-50%);
}

.preview-frame .icon-n2::before {
  top: 1px;
  width: 6px;
  height: 6px;
  border-radius: 9999px;
}

.preview-frame .icon-n2::after {
  bottom: 0;
  width: 12px;
  height: 7px;
  border-radius: 7px 7px 3px 3px;
}

.preview-frame .icon-i10 {
  width: 14px;
  height: 14px;
  border: 1.5px solid currentColor;
  border-radius: 4px;
}

.preview-frame .icon-i10::before {
  content: "";
  position: absolute;
  left: 4px;
  top: 4px;
  width: 4px;
  height: 4px;
  border: 1.5px solid currentColor;
  border-radius: 9999px;
  opacity: .9;
}

.preview-frame .icon-i10::after {
  content: "";
  position: absolute;
  right: -3px;
  bottom: -2px;
  width: 7px;
  height: 7px;
  border: 1.5px solid currentColor;
  border-radius: 3px;
  background: var(--voyager-color-vault, #22005C);
}

.preview-frame .header-data-account svg {
  display: block;
  width: 16px;
  height: 16px;
  color: var(--voyager-text-on-dark, #FFFFFF);
}

.preview-frame .header-data-room {
  min-width: 0;
  height: 60px;
}

.preview-frame .available,
.preview-frame .number-offer,
.preview-frame .connectivity {
  justify-content: center;
  min-width: 84px;
  height: 60px;
  color: var(--voyager-text-on-dark, #FFFFFF);
  border-left: 1px solid var(--voyager-divider-on-dark, #FFFFFF24);
}

.preview-frame .available {
  min-width: 96px;
}

.preview-frame .number-offer {
  min-width: 86px;
}

.preview-frame .connectivity {
  min-width: 104px;
  align-items: flex-end;
  padding-right: 0;
}

.preview-frame .connectivity .data-room-title {
  width: 100%;
  text-align: right;
}

.preview-frame .connectivity > .d-flex {
  width: 100%;
  align-items: center;
  justify-content: flex-end;
}

.preview-frame .data-room-title {
  flex: 0 0 auto;
  color: var(--voyager-text-on-dark-muted, #FFFFFF99);
  font-size: 12px;
  font-weight: 600;
  line-height: 16px;
}

.preview-frame .available-content,
.preview-frame .number-offer-box {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  height: 24px;
  color: var(--voyager-text-on-dark, #FFFFFF);
}

.preview-frame .available-content strong,
.preview-frame .number-offer-box {
  font-family: var(--voyager-font-number);
  font-size: 14px;
  font-weight: 700;
  line-height: 20px;
  font-variant-numeric: tabular-nums;
}

.preview-frame .available-content strong {
  color: var(--voyager-text-on-dark, #FFFFFF);
}

.preview-frame .icon-i6 {
  width: 12px;
  height: 12px;
  margin-right: 5px;
  color: var(--voyager-color-live, #ED8936);
}

.preview-frame .icon-i6::before {
  content: "";
  position: absolute;
  inset: 1px;
  border: 1.5px solid currentColor;
  border-radius: 9999px;
}

.preview-frame .icon-i6::after {
  content: "";
  position: absolute;
  left: 5px;
  top: 3px;
  width: 1.5px;
  height: 6px;
  background: currentColor;
  border-radius: 9999px;
}

.preview-frame .number-offer-box {
  width: fit-content;
  min-width: 60px;
  padding: 0 8px;
  border: 1px solid color-mix(in srgb, var(--voyager-text-on-dark, #FFFFFF) 16%, transparent);
  border-radius: 6px;
  background: color-mix(in srgb, var(--voyager-surface-card, #FFFFFF) 10%, transparent);
}

.preview-frame .range-connectivity {
  width: 26px;
  height: 20px;
  margin-left: auto;
}

.preview-frame .range-connectivity-signal {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 26px;
  height: 20px;
  color: color-mix(in srgb, var(--voyager-color-live, #ED8936) 28%, transparent);
}

.preview-frame .range-connectivity-signal svg {
  display: block;
  width: 26px;
  height: 20px;
  fill: currentColor;
}

.preview-frame .range-connectivity-signal--animate {
  color: var(--voyager-color-live, #ED8936);
  clip-path: inset(0 0 0 0);
}

.v-offer .header-room {
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--voyager-color-live, #ED8936) 8%, transparent) 0%, transparent 58%),
    var(--voyager-gradient-vault-deep, linear-gradient(135deg, var(--voyager-color-vault-dark, #2E0F70) 0%, var(--voyager-color-vault, #22005C) 100%));
}

.v-offer .number-offer-box {
  color: var(--voyager-text-on-dark, #FFFFFF);
  background: var(--voyager-gradient-live, linear-gradient(135deg, var(--voyager-color-live, #ED8936) 0%, var(--voyager-color-live-mid, #F47A20) 100%));
  border-color: color-mix(in srgb, var(--voyager-text-on-dark, #FFFFFF) 24%, transparent);
}

.v-offer .number-offer .data-room-title {
  color: var(--voyager-text-on-dark, #FFFFFF);
}

.v-offer .offer-user strong {
  color: var(--voyager-color-live, #ED8936);
}

@media (max-width: 1360px) {
  .preview-grid {
    grid-template-columns: 640px;
  }
}
</style>
</head>
