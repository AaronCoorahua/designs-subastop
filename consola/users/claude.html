<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Consola Users - Voyager Upgrade Variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault: #22005C;
  --voyager-color-vault-mid: #3B1782;
  --voyager-color-vault-dark: #2E0F70;
  --voyager-color-vault-ink: #08003A;
  --voyager-color-live: #ED8936;
  --voyager-color-live-mid: #F47A20;
  --voyager-color-live-dark: #C65C14;
  --voyager-color-vault-soft: #7047D8;
  --voyager-surface-page: #F8FAF9;
  --voyager-surface-section: #F2F4F3;
  --voyager-surface-card: #FFFFFF;
  --voyager-text-primary: #191C1C;
  --voyager-text-secondary: #494550;
  --voyager-text-on-dark: #FFFFFF;
  --voyager-text-on-dark-muted: #FFFFFF99;
  --voyager-border-ghost: #22005C1A;
  --voyager-divider-section: #22005C0D;
  --voyager-vault-row-user: color-mix(in srgb, var(--voyager-color-vault-soft, #7047D8) 52%, var(--voyager-color-vault, #22005C));
  --voyager-vault-row-rest: color-mix(in srgb, var(--voyager-color-vault, #22005C) 82%, var(--voyager-color-vault-mid, #3B1782));
  --voyager-vault-row-alt: color-mix(in srgb, var(--voyager-color-vault-mid, #3B1782) 38%, var(--voyager-color-vault, #22005C));
  --voyager-live-row-user: color-mix(in srgb, var(--voyager-color-live, #ED8936) 18%, var(--voyager-color-vault-mid, #3B1782));
  --voyager-live-row-rest: color-mix(in srgb, var(--voyager-color-vault, #22005C) 88%, var(--voyager-color-vault-mid, #3B1782));
  --voyager-live-row-alt: color-mix(in srgb, var(--voyager-color-vault, #22005C) 78%, var(--voyager-color-vault-mid, #3B1782));
  --voyager-gradient-vault: linear-gradient(135deg, var(--voyager-color-vault, #22005C) 0%, var(--voyager-color-vault-mid, #3B1782) 100%);
  --voyager-gradient-vault-panel: linear-gradient(180deg, var(--voyager-color-vault-mid, #3B1782) 0%, var(--voyager-color-vault, #22005C) 100%);
  --voyager-gradient-live-header: linear-gradient(135deg, var(--voyager-color-live, #ED8936) 0%, var(--voyager-color-live-mid, #F47A20) 100%);
  --voyager-gradient-surface: linear-gradient(135deg, var(--voyager-surface-section, #F2F4F3) 0%, var(--voyager-surface-card, #FFFFFF) 100%);
  --voyager-font-ui: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --voyager-font-number: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0;
  background:
    radial-gradient(ellipse 70% 50% at top left, var(--voyager-border-ghost, #22005C1A) 0%, var(--voyager-surface-page, #F8FAF9) 60%),
    var(--voyager-surface-page, #F8FAF9);
  color: var(--voyager-text-primary, #191C1C);
  font-family: var(--voyager-font-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

.preview-stage {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  padding: 56px 24px;
}

.preview-grid {
  display: grid;
  grid-template-columns: auto;
  gap: 40px;
  align-items: start;
  justify-content: center;
}

.variant-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.variant-label {
  margin: 0;
  color: var(--voyager-text-secondary, #494550);
  font-family: var(--voyager-font-ui);
  font-size: 11px;
  font-weight: 700;
  line-height: 16px;
  letter-spacing: 0;
  text-align: center;
}

.preview-frame {
  width: 303px;
  height: 165px;
  overflow: hidden;
  background: var(--voyager-surface-card, #FFFFFF);
}

.preview-frame .room-user {
  width: 303px;
  height: 165px;
  margin: 0;
  padding: 14px 20px;
  overflow: hidden;
  color: var(--voyager-text-on-dark, #FFFFFF);
  background:
    radial-gradient(ellipse 85% 52% at 50% -18%, color-mix(in srgb, var(--voyager-color-vault-soft, #7047D8) 34%, transparent) 0%, transparent 70%),
    var(--voyager-gradient-vault-panel, linear-gradient(180deg, var(--voyager-color-vault-mid, #3B1782) 0%, var(--voyager-color-vault, #22005C) 100%));
  font-family: var(--voyager-font-ui);
}

.preview-frame .table-user {
  width: 100%;
  margin: 0;
  padding: 0;
}

.preview-frame .header-table {
  width: 100%;
  height: 30px;
  margin: 0;
  padding: 0;
}

.preview-frame .row-table {
  display: grid;
  grid-template-columns: 78px 1fr 58px;
  align-items: center;
  width: 100%;
  height: 26px;
  margin: 0;
  padding: 0;
  color: var(--voyager-text-on-dark, #FFFFFF);
}

.preview-frame .header-table .row-table {
  height: 28px;
  background: color-mix(in srgb, var(--voyager-color-vault-ink, #08003A) 88%, var(--voyager-color-vault-mid, #3B1782));
  border: 1px solid color-mix(in srgb, var(--voyager-text-on-dark, #FFFFFF) 10%, transparent);
  border-radius: 4px;
}

.preview-frame .cell-table {
  min-width: 0;
  margin: 0;
  padding: 0 8px;
  overflow: hidden;
  color: inherit;
  font-size: 12px;
  font-weight: 500;
  line-height: 18px;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.preview-frame .text-center {
  text-align: center;
}

.preview-frame .contain-scroll {
  width: 100%;
  height: 106px;
  margin: 2px 0 0;
  padding: 0;
  overflow: hidden;
}

.preview-frame .body-table {
  width: 100%;
  margin: 0;
  padding: 0;
}

.preview-frame .body-table .row-table {
  height: 28px;
  margin-top: 2px;
  border: 1px solid color-mix(in srgb, var(--voyager-text-on-dark, #FFFFFF) 7%, transparent);
  border-radius: 4px;
}

.preview-frame .body-table .row-table.user {
  background: var(--voyager-vault-row-user, #6B36D8);
  border-color: color-mix(in srgb, var(--voyager-color-live, #ED8936) 48%, transparent);
}

.preview-frame .body-table .row-table.user .cell-table:nth-child(2) strong,
.preview-frame .body-table .row-table.user .cell-table:nth-child(3) strong {
  color: var(--voyager-color-live, #ED8936);
}

.preview-frame .body-table .row-table:not(.user) {
  background: var(--voyager-vault-row-rest, #4B2397);
}

.preview-frame .body-table .row-table:nth-child(3) {
  background: var(--voyager-vault-row-alt, #22005C);
}

.preview-frame strong {
  color: inherit;
  font-family: var(--voyager-font-ui);
  font-weight: 700;
}

.preview-frame .cell-table:first-child,
.preview-frame .cell-table:last-child {
  font-family: var(--voyager-font-number);
  font-variant-numeric: tabular-nums;
}

.v-live .room-user {
  background:
    linear-gradient(180deg, color-mix(in srgb, var(--voyager-color-live, #ED8936) 10%, transparent) 0%, transparent 44%),
    var(--voyager-gradient-vault-panel, linear-gradient(180deg, var(--voyager-color-vault-mid, #3B1782) 0%, var(--voyager-color-vault, #22005C) 100%));
}

.v-live .header-table .row-table {
  background: var(--voyager-gradient-live-header, linear-gradient(135deg, var(--voyager-color-live, #ED8936) 0%, var(--voyager-color-live-mid, #F47A20) 100%));
}

.v-live .body-table .row-table.user {
  background: var(--voyager-live-row-user, #4D2180);
}

.v-live .body-table .row-table:not(.user) {
  background: var(--voyager-live-row-rest, #250361);
}

.v-live .body-table .row-table:nth-child(3) {
  background: var(--voyager-live-row-alt, #3B1782);
}

.v-live .body-table .row-table.user .cell-table:nth-child(2) strong,
.v-live .body-table .row-table.user .cell-table:nth-child(3) strong {
  color: var(--voyager-color-live, #ED8936);
}

.v-empty .room-user {
  color: var(--voyager-text-on-dark, #FFFFFF);
  background: var(--voyager-gradient-vault-panel, linear-gradient(180deg, var(--voyager-color-vault-mid, #3B1782) 0%, var(--voyager-color-vault, #22005C) 100%));
}

.v-empty .header-table .row-table {
  color: var(--voyager-text-on-dark, #FFFFFF);
  background: var(--voyager-gradient-vault, linear-gradient(135deg, var(--voyager-color-vault, #22005C) 0%, var(--voyager-color-vault-mid, #3B1782) 100%));
}

.v-empty .body-table .row-table {
  visibility: hidden;
}

.v-empty .contain-scroll {
  position: relative;
}

.v-empty .contain-scroll::after {
  content: "...";
  position: absolute;
  left: 0;
  right: 0;
  top: 30px;
  color: var(--voyager-text-on-dark-muted, #FFFFFF99);
  font-family: var(--voyager-font-number);
  font-size: 20px;
  font-weight: 700;
  line-height: 24px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

@media (max-width: 1040px) {
  .preview-grid {
    grid-template-columns: 303px;
  }
}
</style>
</head>
