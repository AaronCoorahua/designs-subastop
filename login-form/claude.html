<style>
/* ─────────────────────────────────────────────────────────────────────────
   Voyager DS — token surface  ·  DESIGN.md §2 Color · §6 Radius · §7 Shadow
   ──────────────────────────────────────────────────────────────────────── */
:root {
  --voyager-color-vault:           oklch(0.22 0.18 285);   /* #22005C */
  --voyager-color-vault-mid:       oklch(0.30 0.20 285);   /* #3B1782 */
  --voyager-color-vault-light:     oklch(0.44 0.18 285);
  --voyager-color-surface-card:    oklch(1 0 0);           /* #FFFFFF */
  --voyager-color-surface-page:    oklch(0.98 0.004 160);
  --voyager-color-input-bg:        oklch(0.91 0.004 160);  /* ~#E7E9E8 */
  --voyager-color-text-on-dark:    oklch(1 0 0);
  --voyager-color-text-on-surface: oklch(0.15 0.008 200);
  --voyager-color-text-muted:      color-mix(in oklch, oklch(0.22 0.18 285) 50%, white);

  /* Derived login tokens */
  --voyager-color-vault-ghost:    color-mix(in oklch, oklch(0.22 0.18 285) 32%, white);
  --voyager-color-vault-muted:    color-mix(in oklch, oklch(0.22 0.18 285) 42%, white);
  --voyager-color-vault-disabled: color-mix(in oklch, oklch(0.22 0.18 285) 40%, white);
  --voyager-color-border-input:   color-mix(in oklch, oklch(0.22 0.18 285) 12%, transparent);
  --voyager-color-divider:        color-mix(in oklch, oklch(0.22 0.18 285) 30%, white);

  /* Gradients */
  --voyager-gradient-vault:
    linear-gradient(135deg, oklch(0.22 0.18 285) 0%, oklch(0.30 0.20 285) 100%);
  --voyager-gradient-vault-vivid:
    linear-gradient(135deg, oklch(0.22 0.18 285) 0%, oklch(0.44 0.18 285) 100%);
  --voyager-gradient-live-vivid:
    linear-gradient(135deg, oklch(0.72 0.16 55) 0%, oklch(0.60 0.20 42) 100%);
  --voyager-color-live: oklch(0.72 0.16 55);

  /* Radius / shadow */
  --voyager-radius-sm:   4px;
  --voyager-radius-md:   8px;
  --voyager-radius-full: 9999px;
  --voyager-shadow-card: 0 8px 16px oklch(0.22 0.18 285 / 6%);
  --voyager-shadow-btn:  0 4px 12px oklch(0.22 0.18 285 / 20%);
  --voyager-shadow-btn-vivid: 0 6px 20px oklch(0.22 0.18 285 / 32%);

  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-ease-default: cubic-bezier(0.3, 0, 0, 1);
}

/* ─── Canvas ───────────────────────────────────────────────────────────── */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background:
    radial-gradient(ellipse 70% 50% at top left,    oklch(0.22 0.18 285 / 4%) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at bottom right, oklch(0.30 0.20 285 / 3%) 0%, transparent 55%),
    var(--voyager-color-surface-page);
  font-family: var(--voyager-font-display);
  -webkit-font-smoothing: antialiased;
}

.preview-stage {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  min-height: 100vh;
  padding: 56px 24px;
}
.variants-row {
  display: flex;
  flex-direction: column;
  gap: 40px;
  align-items: flex-start;
  flex-wrap: wrap;
  justify-content: center;
}
.variant-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.variant-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--voyager-color-text-muted);
  text-align: center;
}

/* Locked dimensions */
.preview-frame {
  width: 320px;
  min-height: 556.72px;
  background: var(--voyager-color-surface-card, #FFFFFF);
  border-radius: var(--voyager-radius-sm);
  box-shadow: var(--voyager-shadow-card);
  overflow: hidden;
}

/* ─── Frozen Tailwind class map ────────────────────────────────────────── */
.preview-frame h1,
.preview-frame p,
.preview-frame label { margin: 0; padding: 0; display: block; }

/* Layout */
.preview-frame .w-full         { width: 100%; }
.preview-frame .max-w-xs       { max-width: 320px; }
.preview-frame .m-auto         { margin: auto; }
.preview-frame .flex           { display: flex; }
.preview-frame .items-center   { align-items: center; }
.preview-frame .justify-center { justify-content: center; }
.preview-frame .relative       { position: relative; }
.preview-frame .absolute       { position: absolute; }
.preview-frame .top-0          { top: 0; }
.preview-frame .right-0        { right: 0; }
.preview-frame .z-0            { z-index: 0; }
.preview-frame .z-1            { z-index: 1; }
.preview-frame .cursor-pointer { cursor: pointer; }

/* Spacing */
.preview-frame .py-6  { padding-top: 24px;  padding-bottom: 24px; }
.preview-frame .px-6  { padding-left: 24px; padding-right: 24px; }
.preview-frame .px-5  { padding-left: 20px; padding-right: 20px; }
.preview-frame .pr-8  { padding-right: 32px; }
.preview-frame .py-3  { padding-top: 12px;  padding-bottom: 12px; }
.preview-frame .py-1  { padding-top: 4px;   padding-bottom: 4px; }
.preview-frame .ml-4  { margin-left: 16px; }
.preview-frame .mr-2  { margin-right: 8px; }
.preview-frame .mt-16 { margin-top: 64px; }
.preview-frame .mt-6  { margin-top: 24px; }
.preview-frame .mt-5  { margin-top: 20px; }
.preview-frame .mt-1  { margin-top: 4px; }
.preview-frame .-mt-px { margin-top: -1px; }

/* Transform */
.preview-frame .transform { }
.preview-frame .translate-y-1\/2 { transform: translateY(50%); }

/* Typography */
.preview-frame .font-display  { font-family: var(--voyager-font-display); }
.preview-frame .font-light    { font-weight: 300; }
.preview-frame .font-bold     { font-weight: 700; }
.preview-frame .font-normal   { font-weight: 400; }
.preview-frame .text-xl       { font-size: 20px; }
.preview-frame .text-base     { font-size: 16px; }
.preview-frame .text-sm       { font-size: 14px; }
.preview-frame .text-xs       { font-size: 12px; }
.preview-frame .leading-tight { line-height: 1.2; }
.preview-frame .leading-6     { line-height: 24px; }
.preview-frame .leading-none  { line-height: 1; }
.preview-frame .text-center   { text-align: center; }
.preview-frame .uppercase     { text-transform: uppercase; }

/* Shapes */
.preview-frame .rounded { border-radius: var(--voyager-radius-sm, 4px); }

/* Space-y */
.preview-frame .space-y-5 > * + * { margin-top: 20px; }

/* Divider border */
.preview-frame .border-t { border-top: 1px solid; }
.preview-frame .border   { border: 1px solid; }

/* SVG */
.preview-frame .fill-current { fill: currentColor; }
.preview-frame .h-6 { height: 24px; }
.preview-frame .w-6 { width: 24px; }

/* Focus outline */
.preview-frame .focus\:outline-none:focus { outline: none; }

/* Input base */
.preview-frame .input {
  display: block;
  width: 100%;
  border: 1px solid var(--voyager-color-border-input);
  border-radius: var(--voyager-radius-sm, 4px);
  font-family: var(--voyager-font-display);
  outline: none;
  appearance: none;
  -webkit-appearance: none;
  transition: border-color 150ms var(--voyager-ease-default),
              box-shadow  150ms var(--voyager-ease-default);
}

/* Button base */
.preview-frame .button {
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  font-family: var(--voyager-font-display);
  border-radius: var(--voyager-radius-sm, 4px);
  transition: background 200ms var(--voyager-ease-default),
              transform 100ms var(--voyager-ease-default);
  position: relative;
  overflow: hidden;
}

/* ─── Shared color mapping ─────────────────────────────────────────────── */
.preview-frame .text-purple-500 { color: var(--voyager-color-vault,         #22005C); }
.preview-frame .text-purple-900 { color: var(--voyager-color-vault,         #22005C); }
.preview-frame .text-purple-200 { color: var(--voyager-color-vault-ghost); }
.preview-frame .text-purple-300 { color: var(--voyager-color-vault-muted); }
.preview-frame .text-white      { color: var(--voyager-color-text-on-dark,  #FFFFFF); }

.preview-frame .bg-gray-100     { background-color: var(--voyager-color-input-bg,    #E7E9E8); }
.preview-frame .bg-coral-100    { background-color: var(--voyager-color-surface-card, #FFFFFF); }
.preview-frame .bg-purple-500   { background-color: var(--voyager-color-vault,        #22005C); }

.preview-frame .border-purple-100 { border-color: color-mix(in oklch, var(--voyager-color-vault, #22005C) 12%, transparent); }
.preview-frame .border-purple-300 { border-color: var(--voyager-color-divider); }
.preview-frame .border-purple-500 { border-color: var(--voyager-color-vault, #22005C); }

.preview-frame .shadow-md { box-shadow: var(--voyager-shadow-btn); }
.preview-frame .shadow    { box-shadow: 0 2px 6px oklch(0.22 0.18 285 / 12%); }

/* ═══════════════════════════════════════════════════════════════════════

.v1 .button[disabled] {
  cursor: not-allowed;
  opacity: 0.85;
}

/* ═══════════════════════════════════════════════════════════════════════
   VARIANT 3 — Gradient · Modern
   Vault gradient button + vivid shadow + refined inputs
   ═══════════════════════════════════════════════════════════════════════ */
.v3 .bg-purple-500 {
  background: var(--voyager-gradient-vault-vivid);
}
/* Shine overlay on gradient button — matches auction-conditions v3 */
.v3 .button::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 40%;
  background: linear-gradient(180deg, oklch(1 0 0 / 12%) 0%, transparent 100%);
  pointer-events: none;
  border-radius: inherit;
}
.v3 .button[disabled] {
  cursor: pointer;
  opacity: 1;
}
/* Refined inputs: subtle vault-tinted background */
.v3 .bg-gray-100 {
  background-color: oklch(0.94 0.006 285);
  border-color: color-mix(in oklch, var(--voyager-color-vault, #22005C) 16%, transparent);
}
.v3 .input {
  border-color: color-mix(in oklch, var(--voyager-color-vault, #22005C) 16%, transparent);
}
/* Shadow matches auction-conditions Modern · Vivid */
.v3 .shadow-md {
  box-shadow: 0 4px 16px oklch(0.22 0.18 285 / 35%), inset 0 1px 0 oklch(1 0 0 / 15%);
}
/* Register button: gradient ghost */
.v3 a.border-purple-500 {
  background: color-mix(in oklch, var(--voyager-color-vault, #22005C) 4%, white);
  border-color: color-mix(in oklch, var(--voyager-color-vault, #22005C) 55%, white);
}
/* Divider "ó" pill on v3 */
.v3 .text-purple-300 {
  color: color-mix(in oklch, var(--voyager-color-vault, #22005C) 55%, white);
}

/* ═══════════════════════════════════════════════════════════════════════

  pointer-events: none;
  border-radius: inherit;
}
.v4 .button[disabled] {
  cursor: pointer;
  opacity: 1;
}
.v4 .bg-gray-100 {
  background-color: oklch(0.96 0.008 55);
  border-color: color-mix(in oklch, var(--voyager-color-live) 16%, transparent);
}
.v4 .input {
  border-color: color-mix(in oklch, var(--voyager-color-live) 16%, transparent);
}
.v4 .shadow-md {
  box-shadow: 0 4px 16px oklch(0.72 0.16 55 / 35%), inset 0 1px 0 oklch(1 0 0 / 15%);
}
/* Regístrate: naranja ghost */
.v4 a.border-purple-500 {
  background: color-mix(in oklch, var(--voyager-color-live) 4%, white);
  border-color: color-mix(in oklch, var(--voyager-color-live) 55%, white);
  color: var(--voyager-color-live);
}
/* ¿Olvidaste? link + divider "ó" pill */
.v4 .text-purple-500 { color: var(--voyager-color-live); }
.v4 .text-purple-300 {
  color: color-mix(in oklch, var(--voyager-color-live) 55%, white);
}
.v4 .border-purple-300 {
  border-color: color-mix(in oklch, var(--voyager-color-live) 30%, white);
}
</style>
