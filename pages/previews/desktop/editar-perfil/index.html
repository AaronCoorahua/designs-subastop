<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Previews · Editar Perfil — Voyager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault: oklch(0.22 0.18 285);
  --voyager-color-vault-mid: oklch(0.30 0.20 285);
  --voyager-color-live: oklch(0.72 0.16 55);
  --voyager-surface-page: #F8FAF9;
  --voyager-surface-card: #FFFFFF;
  --voyager-text-primary: #191C1C;
  --voyager-text-secondary: #494550;
  --voyager-text-on-dark: #FFFFFF;
  --voyager-border-ghost: #22005C1A;
  --voyager-divider-section: #22005C0D;
  --voyager-font-ui: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --voyager-font-number: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background:
    radial-gradient(ellipse 70% 50% at top left, var(--voyager-border-ghost) 0%, transparent 60%),
    var(--voyager-surface-page);
  color: var(--voyager-text-primary);
  font-family: var(--voyager-font-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: 40px 24px 72px;
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 16px;
  color: var(--voyager-text-secondary);
  font-size: 12px;
  font-weight: 600;
}
.breadcrumb a { color: var(--voyager-color-vault); text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb-sep { color: color-mix(in srgb, var(--voyager-color-vault) 32%, transparent); }

.page-title {
  margin: 0 0 4px;
  color: var(--voyager-color-vault);
  font-size: 32px;
  font-weight: 800;
  line-height: 40px;
  letter-spacing: -0.5px;
}

.page-meta {
  margin: 0 0 32px;
  color: var(--voyager-text-secondary);
  font-family: var(--voyager-font-number);
  font-size: 12px;
  font-weight: 500;
}

/* ── Catalog stack — 1 columna, variantes apiladas ──────────────────────── */
.viewer {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 48px;
}

.variant {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.variant-label {
  margin: 0;
  color: var(--voyager-color-vault);
  font-size: 11px;
  font-weight: 800;
  line-height: 16px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* ===== Canvas — composición de 3 componentes ===== */
.canvas {
  position: relative;
  width: 830px;
  height: 588px;
  overflow: hidden;
  background: transparent;
}
.canvas[hidden] { display: none; }

.zone {
  position: absolute;
  overflow: hidden;
}

.zone iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: transparent;
}

/* Card natural width = 766px → centrar horizontalmente en canvas 830px (offset 32px).
   logout-button es solo el botón (~227w × ~50h) → centrado por embed-mode + padding del propio componente. */
.zone-profile { top: 0;   left: 32px; width: 766px; height: 290px; }
.zone-contact { top: 306px; left: 32px; width: 766px; height: 160px; }
.zone-logout  { top: 482px; left: 0;    width: 830px; height: 100px; }
</style>
</head>
<body>
  <main class="page">
    <p class="breadcrumb">
      <a href="../../index.html">Previews</a>
      <span class="breadcrumb-sep">›</span>
      <span>Editar Perfil</span>
    </p>
    <h1 class="page-title">Editar Perfil</h1>
    <p class="page-meta">2 variantes</p>

    <div class="viewer">

      <!-- ====================== VARIANTE 1 — VAULT ====================== -->
      <div class="variant">
      <p class="variant-label">Vault</p>
      <div class="canvas" id="canvas-1">
        <div class="zone zone-profile">
          <iframe src="../../../../components/desktop/your-profile-info/claude.html?embed=1&variant=Vault" scrolling="no" loading="lazy" title="Your Profile Info"></iframe>
        </div>
        <div class="zone zone-contact">
          <iframe src="../../../../components/desktop/your-contact-info/claude.html?embed=1&variant=Default" scrolling="no" loading="lazy" title="Your Contact Info"></iframe>
        </div>
        <div class="zone zone-logout">
          <iframe src="../../../../components/desktop/logout-button/claude.html?embed=1&variant=Vault" scrolling="no" loading="lazy" title="Logout Button"></iframe>
        </div>
      </div>

      </div>

      <!-- ====================== VARIANTE 2 — LIVE ======================= -->
      <div class="variant">
      <p class="variant-label">Live</p>
      <div class="canvas" id="canvas-2">
        <div class="zone zone-profile">
          <iframe src="../../../../components/desktop/your-profile-info/claude.html?embed=1&variant=Live" scrolling="no" loading="lazy" title="Your Profile Info"></iframe>
        </div>
        <div class="zone zone-contact">
          <iframe src="../../../../components/desktop/your-contact-info/claude.html?embed=1&variant=Default" scrolling="no" loading="lazy" title="Your Contact Info"></iframe>
        </div>
        <div class="zone zone-logout">
          <iframe src="../../../../components/desktop/logout-button/claude.html?embed=1&variant=Live" scrolling="no" loading="lazy" title="Logout Button"></iframe>
        </div>
      </div>
      </div>

    </div>
  </main>
</body>
</html>
