<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Previews · Editar Perfil — Voyager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault: oklch(0.22 0.18 285);
  --voyager-color-vault-mid: oklch(0.30 0.20 285);
  --voyager-color-live: oklch(0.72 0.16 55);
  --voyager-surface-page: #F8FAF9;
  --voyager-surface-card: #FFFFFF;
  --voyager-text-primary: #191C1C;
  --voyager-text-secondary: #494550;
  --voyager-text-on-dark: #FFFFFF;
  --voyager-border-ghost: #22005C1A;
  --voyager-divider-section: #22005C0D;
  --voyager-font-ui: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --voyager-font-number: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background:
    radial-gradient(ellipse 70% 50% at top left, var(--voyager-border-ghost) 0%, transparent 60%),
    var(--voyager-surface-page);
  color: var(--voyager-text-primary);
  font-family: var(--voyager-font-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: 40px 24px 72px;
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 16px;
  color: var(--voyager-text-secondary);
  font-size: 12px;
  font-weight: 600;
}
.breadcrumb a { color: var(--voyager-color-vault); text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb-sep { color: color-mix(in srgb, var(--voyager-color-vault) 32%, transparent); }

.page-title {
  margin: 0 0 4px;
  color: var(--voyager-color-vault);
  font-size: 32px;
  font-weight: 800;
  line-height: 40px;
  letter-spacing: -0.5px;
}

.page-meta {
  margin: 0 0 32px;
  color: var(--voyager-text-secondary);
  font-family: var(--voyager-font-number);
  font-size: 12px;
  font-weight: 500;
}

.tabbar {
  display: flex;
  gap: 4px;
  padding: 4px;
  margin: 0 0 32px;
  border-radius: 4px;
  background: oklch(0.96 0.004 160);
  border: 1px solid var(--voyager-divider-section);
  width: fit-content;
}

.tab {
  appearance: none;
  border: 0;
  background: transparent;
  padding: 10px 20px;
  border-radius: 4px;
  color: var(--voyager-text-secondary);
  font-family: var(--voyager-font-ui);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 150ms cubic-bezier(0.3,0,0,1), color 150ms cubic-bezier(0.3,0,0,1);
}
.tab:hover {
  background: color-mix(in srgb, var(--voyager-color-vault) 6%, transparent);
  color: var(--voyager-color-vault);
}
.tab:focus-visible { outline: 2px solid var(--voyager-color-live); outline-offset: 2px; }
.tab[aria-selected="true"] {
  color: #ffffff;
  background: var(--voyager-color-vault);
  box-shadow: 0 4px 8px color-mix(in srgb, var(--voyager-color-vault) 24%, transparent);
}

.viewer { display: flex; justify-content: center; }

/* ===== Canvas — composición de 3 componentes ===== */
.canvas {
  position: relative;
  width: 830px;
  height: 588px;
  overflow: hidden;
  background: transparent;
}
.canvas[hidden] { display: none; }

.zone {
  position: absolute;
  overflow: hidden;
}

.zone iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: transparent;
}

/* Card natural width = 766px → centrar horizontalmente en canvas 830px (offset 32px).
   logout-button es solo el botón (~227w × ~50h) → centrado por embed-mode + padding del propio componente. */
.zone-profile { top: 0;   left: 32px; width: 766px; height: 290px; }
.zone-contact { top: 306px; left: 32px; width: 766px; height: 160px; }
.zone-logout  { top: 482px; left: 0;    width: 830px; height: 100px; }
</style>
</head>
<body>
  <main class="page">
    <p class="breadcrumb">
      <a href="../index.html">Previews</a>
      <span class="breadcrumb-sep">›</span>
      <span>Editar Perfil</span>
    </p>
    <h1 class="page-title">Editar Perfil</h1>
    <p class="page-meta">2 variantes</p>

    <div class="tabbar" role="tablist" aria-label="Variantes de Editar Perfil">
      <button type="button" class="tab" role="tab" id="tab-1" aria-selected="true"  data-target="canvas-1">Vault</button>
      <button type="button" class="tab" role="tab" id="tab-2" aria-selected="false" data-target="canvas-2">Live</button>
    </div>

    <div class="viewer">

      <!-- ====================== VARIANTE 1 — VAULT ====================== -->
      <div class="canvas" id="canvas-1" role="tabpanel" aria-labelledby="tab-1">
        <div class="zone zone-profile">
          <iframe src="../../../components/your-profile-info/claude.html?embed=1&variant=Vault" scrolling="no" loading="lazy" title="Your Profile Info"></iframe>
        </div>
        <div class="zone zone-contact">
          <iframe src="../../../components/your-contact-info/claude.html?embed=1&variant=Default" scrolling="no" loading="lazy" title="Your Contact Info"></iframe>
        </div>
        <div class="zone zone-logout">
          <iframe src="../../../components/logout-button/claude.html?embed=1&variant=Vault" scrolling="no" loading="lazy" title="Logout Button"></iframe>
        </div>
      </div>

      <!-- ====================== VARIANTE 2 — LIVE ======================= -->
      <div class="canvas" id="canvas-2" role="tabpanel" aria-labelledby="tab-2" hidden>
        <div class="zone zone-profile">
          <iframe src="../../../components/your-profile-info/claude.html?embed=1&variant=Live" scrolling="no" loading="lazy" title="Your Profile Info"></iframe>
        </div>
        <div class="zone zone-contact">
          <iframe src="../../../components/your-contact-info/claude.html?embed=1&variant=Default" scrolling="no" loading="lazy" title="Your Contact Info"></iframe>
        </div>
        <div class="zone zone-logout">
          <iframe src="../../../components/logout-button/claude.html?embed=1&variant=Live" scrolling="no" loading="lazy" title="Logout Button"></iframe>
        </div>
      </div>

    </div>
  </main>

<script>
function handleTabClick(event) {
  var clicked = event.currentTarget;
  var tabs = document.querySelectorAll('.tab');
  var canvases = document.querySelectorAll('.canvas');
  var targetId = clicked.getAttribute('data-target');
  var i = 0;
  for (i = 0; i < tabs.length; i++) {
    tabs[i].setAttribute('aria-selected', tabs[i] === clicked ? 'true' : 'false');
  }
  for (i = 0; i < canvases.length; i++) {
    if (canvases[i].id === targetId) {
      canvases[i].removeAttribute('hidden');
    } else {
      canvases[i].setAttribute('hidden', '');
    }
  }
}

(function bindTabs() {
  var tabs = document.querySelectorAll('.tab');
  var i = 0;
  for (i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', handleTabClick);
  }
})();
</script>
</body>
</html>
