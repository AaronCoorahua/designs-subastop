<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Preview Mobile — Detalle · En Vivo · Voyager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault:        oklch(0.22 0.18 285);
  --voyager-color-vault-mid:    oklch(0.30 0.20 285);
  --voyager-color-live:         oklch(0.72 0.16 55);
  --voyager-color-negotiable:   oklch(0.78 0.14 195);
  --voyager-surface-page:       oklch(0.98 0.004 160);
  --voyager-surface-section:    oklch(0.96 0.006 160);
  --voyager-surface-card:       oklch(1 0 0);
  --voyager-text-on-surface:    oklch(0.15 0.008 200);
  --voyager-text-secondary:     color-mix(in oklch, oklch(0.38 0.04 280) 70%, transparent);
  --voyager-text-tertiary:      color-mix(in oklch, oklch(0.38 0.04 280) 50%, transparent);
  --voyager-text-on-dark:       oklch(1 0 0);
  --voyager-divider-section:    color-mix(in oklch, oklch(0.22 0.18 285) 8%, transparent);
  --voyager-font-display:       "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-font-number:        "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background:
    radial-gradient(ellipse 70% 50% at top left, oklch(0.22 0.18 285 / 5%) 0%, transparent 60%),
    var(--voyager-surface-page);
  color: var(--voyager-text-on-surface);
  font-family: var(--voyager-font-display);
  -webkit-font-smoothing: antialiased;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: 40px 24px 72px;
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 16px;
  color: var(--voyager-text-secondary);
  font-size: 12px;
  font-weight: 600;
}
.breadcrumb a { color: var(--voyager-color-vault); text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb-sep { color: color-mix(in oklch, var(--voyager-color-vault) 32%, transparent); }

.page-title {
  margin: 0 0 4px;
  color: var(--voyager-color-vault);
  font-size: 32px;
  font-weight: 800;
  line-height: 40px;
  letter-spacing: -0.5px;
}

.page-meta {
  margin: 0 0 32px;
  color: var(--voyager-text-secondary);
  font-family: var(--voyager-font-number);
  font-size: 12px;
  font-weight: 500;
}

/* ─────────────────────────────────────────────────────────────────────────
   MOBILE FRAME — 420 wide (ancho real de dispositivo).
   Header y footer full-bleed; contenido en grid 2 cols.
   ───────────────────────────────────────────────────────────────────────── */
.preview-panel {
  display: flex;
  justify-content: center;
}

.mobile-frame {
  width: 420px;
  background: var(--voyager-surface-page);
  border-radius: 24px;
  box-shadow: 0 12px 40px oklch(0.22 0.18 285 / 12%);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.mobile-frame > iframe.full {
  display: block;
  width: 100%;
  border: 0;
  background: transparent;
}

/* Grid 2 cols dentro del frame ───────────────────────────────────────── */
.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 12px;
  background: var(--voyager-surface-section);
}

.col {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}

/* ─────────────────────────────────────────────────────────────────────────
   SLOT — wrapper que muestra un iframe escalado con clipping.

     Componente mobile: .preview-frame width = 372px
                        dentro de .preview-stage con padding 56px 24px
     Offset top:    -82px (preview-stage padding 56 + label 14 + gap 12)
     Offset left:   -24px (preview-stage padding-x 24)
     Inner scale:   width 372 × transform scale(0.516) top-left
     Wrapper:       192px ancho (= 372 × 0.516)
                    .slot height = natural × 0.516
                    .slot-scale height = natural

   Escala: columna disponible = (420 - 24pad - 12gap) / 2 = 192px
           192 / 372 = 0.516
   ───────────────────────────────────────────────────────────────────────── */
.slot {
  position: relative;
  width: 192px;            /* 372 * 0.516 */
  overflow: hidden;
  background: transparent;
  /* height inline per slot */
}

.slot-scale {
  position: relative;
  width: 372px;
  height: 100%;
  transform: scale(0.516);
  transform-origin: top left;
  overflow: hidden;
}

.slot-scale > iframe {
  display: block;
  width: 420px;            /* iframe natural; mostramos sólo 372 centrales */
  height: 1000px;          /* sobrado; lo de abajo se clip-ea */
  border: 0;
  margin-top: -82px;       /* esconde preview-stage padding + variant-label */
  margin-left: -24px;      /* esconde preview-stage padding-left (24px) */
  background: transparent;
}

/* FULL-BLEED — para componentes con .preview-frame width: 420px
   (image-header). Sin margin-left negativo. Scale 192/420 = 0.457. */
.slot.full-bleed .slot-scale {
  width: 420px;
  transform: scale(0.457);
}
.slot.full-bleed .slot-scale > iframe {
  margin-left: 0;
}

/* Heights específicos del componente natural × 0.516 (o × 0.457 si full-bleed).
   .slot height = natural × scale    |   .slot-scale height = natural        */
.slot.h-image-header { height: 28px;  } .slot.h-image-header .slot-scale { height: 60px;  }
.slot.h-thumbnail    { height: 47px;  } .slot.h-thumbnail    .slot-scale { height: 90px;  }
.slot.h-detail-card  { height: 218px; } .slot.h-detail-card  .slot-scale { height: 422px; }
.slot.h-auction-cond { height: 114px; } .slot.h-auction-cond .slot-scale { height: 220px; }
.slot.h-cond-ofrec   { height: 268px; } .slot.h-cond-ofrec   .slot-scale { height: 520px; }
.slot.h-ofertas-rel  { height: 268px; } .slot.h-ofertas-rel  .slot-scale { height: 520px; }

/* ─────────────────────────────────────────────────────────────────────────
   SKELETON IMAGEN — placeholder de la foto del vehículo (A)
   ───────────────────────────────────────────────────────────────────────── */
.skeleton-image {
  width: 192px;
  height: 128px;
  background: linear-gradient(
    145deg,
    oklch(0.91 0.022 285) 0%,
    oklch(0.94 0.010 220) 60%,
    oklch(0.96 0.005 160) 100%
  );
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.skeleton-image p {
  margin: 0;
  font-family: var(--voyager-font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--voyager-text-tertiary);
}

/* ─────────────────────────────────────────────────────────────────────────
   SKELETON PLACEHOLDER (E) — reemplaza Subascoins hasta que exista componente
   ───────────────────────────────────────────────────────────────────────── */
.skeleton-ph {
  width: 100%;
  height: 56px;
  flex-shrink: 0;
  background: linear-gradient(
    135deg,
    oklch(0.91 0.022 285) 0%,
    oklch(0.94 0.010 220) 60%,
    oklch(0.96 0.005 160) 100%
  );
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.skeleton-ph p {
  margin: 0;
  font-family: var(--voyager-font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--voyager-text-tertiary);
}
</style>
</head>
<body>
  <main class="page">
    <p class="breadcrumb">
      <a href="../../index.html">Previews</a>
      <span class="breadcrumb-sep">›</span>
      <span>Mobile · Detalle · En Vivo</span>
    </p>
    <h1 class="page-title">Detalle</h1>
    <p class="page-meta">420 wide · 2 cols · En Vivo</p>

    <div class="preview-panel">
      <div class="mobile-frame" aria-label="Mobile preview — Detalle En Vivo">

        <!-- Header (full-bleed) -->
        <iframe
          class="full"
          src="../../../../components/mobile/header/claude.html"
          title="Header"
          scrolling="no"
          loading="lazy"
          style="height:56px"></iframe>

        <div class="two-col">

          <!-- ─── COL IZQUIERDA: A (image+skel+thumb) + B (info general) ─── -->
          <div class="col">
            <!-- A.1 — image-header (barra con título del vehículo) -->
            <div class="slot h-image-header full-bleed" aria-label="A · Image Header">
              <div class="slot-scale">
                <iframe
                  src="../../../../components/mobile/image-header/claude.html"
                  scrolling="no" loading="lazy" title="Image Header"></iframe>
              </div>
            </div>

            <!-- A.2 — placeholder foto principal -->
            <div class="skeleton-image" role="img" aria-label="Foto principal">
              <p>Imagen</p>
            </div>

            <!-- A.3 — thumbnail strip -->
            <div class="slot h-thumbnail" aria-label="A · Thumbnails">
              <div class="slot-scale">
                <iframe
                  src="../../../../components/mobile/thumbnail/claude.html"
                  scrolling="no" loading="lazy" title="Thumbnails"></iframe>
              </div>
            </div>

            <!-- B — Información general (condiciones de ofrecimiento) -->
            <div class="slot h-cond-ofrec" aria-label="B · Información general">
              <div class="slot-scale">
                <iframe
                  src="../../../../components/mobile/condiciones-ofrecimiento/claude.html"
                  scrolling="no" loading="lazy" title="Condiciones de Ofrecimiento"></iframe>
              </div>
            </div>
          </div>

          <!-- ─── COL DERECHA: C, D, E, F ─── -->
          <div class="col">
            <!-- C — Detail Card · En Vivo -->
            <div class="slot h-detail-card" aria-label="C · Detail Card En Vivo">
              <div class="slot-scale">
                <iframe
                  src="../../../../components/mobile/detail-card/en-vivo/claude.html"
                  scrolling="no" loading="lazy" title="Detail Card En Vivo"></iframe>
              </div>
            </div>

            <!-- D — Auction conditions · pills -->
            <div class="slot h-auction-cond" aria-label="D · Condiciones En Vivo">
              <div class="slot-scale">
                <iframe
                  src="../../../../components/mobile/auction-conditions/vivo/claude.html"
                  scrolling="no" loading="lazy" title="Auction Conditions Vivo"></iframe>
              </div>
            </div>

            <!-- E — Subascoins placeholder (componente pendiente) -->
            <div class="skeleton-ph" aria-label="E · Subascoins placeholder">
              <p>Subascoins</p>
            </div>

            <!-- F — Ofertas relacionadas -->
            <div class="slot h-ofertas-rel" aria-label="F · Ofertas Relacionadas">
              <div class="slot-scale">
                <iframe
                  src="../../../../components/mobile/ofertas-relacionadas/claude.html"
                  scrolling="no" loading="lazy" title="Ofertas Relacionadas"></iframe>
              </div>
            </div>
          </div>

        </div>

        <!-- Footer (full-bleed) -->
        <iframe
          class="full"
          src="../../../../components/mobile/footer/claude.html"
          title="Footer"
          scrolling="no"
          loading="lazy"
          style="height:870px"></iframe>

      </div>
    </div>
  </main>
</body>
</html>
