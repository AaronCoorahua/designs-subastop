<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Preview Mobile — Editar Perfil · Voyager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault:       oklch(0.22 0.18 285);
  --voyager-color-live:        oklch(0.72 0.16 55);
  --voyager-surface-page:      oklch(0.98 0.004 160);
  --voyager-surface-section:   oklch(0.96 0.006 160);
  --voyager-text-on-surface:   oklch(0.15 0.008 200);
  --voyager-text-secondary:    color-mix(in oklch, oklch(0.38 0.04 280) 70%, transparent);
  --voyager-text-on-dark:      oklch(1 0 0);
  --voyager-divider-section:   color-mix(in oklch, oklch(0.22 0.18 285) 8%, transparent);
  --voyager-font-display:      "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background:
    radial-gradient(ellipse 70% 50% at top left, oklch(0.22 0.18 285 / 5%) 0%, transparent 60%),
    var(--voyager-surface-page);
  color: var(--voyager-text-on-surface);
  font-family: var(--voyager-font-display);
  -webkit-font-smoothing: antialiased;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: 40px 24px 72px;
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 16px;
  color: var(--voyager-text-secondary);
  font-size: 12px;
  font-weight: 600;
}
.breadcrumb a { color: var(--voyager-color-vault); text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb-sep { color: color-mix(in oklch, var(--voyager-color-vault) 32%, transparent); }

.page-title {
  margin: 0 0 4px;
  color: var(--voyager-color-vault);
  font-size: 32px;
  font-weight: 800;
  line-height: 40px;
  letter-spacing: -0.5px;
}

.page-meta {
  margin: 0 0 32px;
  color: var(--voyager-text-secondary);
  font-size: 12px;
  font-weight: 500;
}

/* ── Catalog stack — 1 columna, variantes apiladas ──────────────────────── */
.viewer {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 48px;
}

.variant {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.variant-label {
  margin: 0;
  color: var(--voyager-color-vault);
  font-size: 11px;
  font-weight: 800;
  line-height: 16px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* ── Mobile frame — 430 wide, centered ───────────────────────────────── */
.mobile-frame {
  width: 430px;
  background: var(--voyager-surface-section);
  display: flex;
  flex-direction: column;
}

.mobile-frame > iframe {
  display: block;
  width: 100%;
  border: 0;
  background: transparent;
}

/* Stack interno · 16px top/bottom · gap 16 entre cards · todo centrado */
.mobile-frame .body-stage {
  padding: 20px 0 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.mobile-frame .body-stage iframe {
  display: block;
  border: 0;
  background: transparent;
}

</style>
</head>
<body>
  <main class="page">
    <p class="breadcrumb">
      <a href="../../index.html">Previews</a>
      <span class="breadcrumb-sep">›</span>
      <span>Editar Perfil · Mobile</span>
    </p>
    <h1 class="page-title">Editar Perfil</h1>
    <p class="page-meta">430 wide · Header · Your Profile Info (390×468) · Your Contact Info (390×220.5) · Logout (200×52) · Footer · 3 variantes (Vault Normal · New Style · Vault New Style)</p>

    <div class="viewer">

    <!-- ── Variante 1: Vault Normal ───────────────────────────────────── -->
    <section class="variant">
      <p class="variant-label">Vault Normal</p>
      <div class="mobile-frame" aria-label="Editar Perfil · Vault Normal">

        <iframe
          src="../../../../components/mobile/header/logged-live/claude.html"
          title="Header · Logged Live Gradient" scrolling="no" loading="lazy"
          style="height:56px"></iframe>

        <div class="body-stage">
          <iframe
            src="../../../../components/mobile/your-profile-info/claude.html?variant=Vault%20Normal&embed=1"
            title="Your Profile Info — Vault Normal" scrolling="no" loading="lazy"
            style="width:390px;height:468px"></iframe>

          <iframe
            src="../../../../components/mobile/your-contact-info/claude.html?embed=1"
            title="Your Contact Info" scrolling="no" loading="lazy"
            style="width:390px;height:220.5px"></iframe>

          <iframe
            src="../../../../components/mobile/logout-button/claude.html?variant=Vault&embed=1"
            title="Logout · Vault" scrolling="no" loading="lazy"
            style="width:200px;height:52px"></iframe>
        </div>

        <iframe
          src="../../../../components/mobile/footer/claude.html"
          title="Footer" scrolling="no" loading="lazy"
          style="height:870.63px"></iframe>

      </div>
    </section>

    <!-- ── Variante 2: New Style ──────────────────────────────────────── -->
    <section class="variant">
      <p class="variant-label">New Style</p>
      <div class="mobile-frame" aria-label="Editar Perfil · New Style">

        <iframe
          src="../../../../components/mobile/header/logged-iridescent/claude.html"
          title="Header · Logged Iridescent" scrolling="no" loading="lazy"
          style="height:56px"></iframe>

        <div class="body-stage">
          <iframe
            src="../../../../components/mobile/your-profile-info/claude.html?variant=New%20Style&embed=1"
            title="Your Profile Info — New Style" scrolling="no" loading="lazy"
            style="width:390px;height:468px"></iframe>

          <iframe
            src="../../../../components/mobile/your-contact-info/claude.html?embed=1"
            title="Your Contact Info" scrolling="no" loading="lazy"
            style="width:390px;height:220.5px"></iframe>

          <iframe
            src="../../../../components/mobile/logout-button/claude.html?variant=New%20Style&embed=1"
            title="Logout · New Style" scrolling="no" loading="lazy"
            style="width:200px;height:52px"></iframe>
        </div>

        <iframe
          src="../../../../components/mobile/footer/claude.html"
          title="Footer" scrolling="no" loading="lazy"
          style="height:870.63px"></iframe>

      </div>
    </section>

    <!-- ── Variante 3: Vault New Style (psec cinematic vault) ─────────── -->
    <section class="variant">
      <p class="variant-label">Vault New Style</p>
      <div class="mobile-frame" aria-label="Editar Perfil · Vault New Style">

        <iframe
          src="../../../../components/mobile/header/logged-iridescent/claude.html"
          title="Header · Logged Iridescent" scrolling="no" loading="lazy"
          style="height:56px"></iframe>

        <div class="body-stage">
          <iframe
            src="../../../../components/mobile/your-profile-info/claude.html?variant=Vault&embed=1"
            title="Your Profile Info — Vault (psec)" scrolling="no" loading="lazy"
            style="width:390px;height:468px"></iframe>

          <iframe
            src="../../../../components/mobile/your-contact-info/claude.html?embed=1"
            title="Your Contact Info" scrolling="no" loading="lazy"
            style="width:390px;height:220.5px"></iframe>

          <iframe
            src="../../../../components/mobile/logout-button/claude.html?variant=New%20Style&embed=1"
            title="Logout · New Style (psec)" scrolling="no" loading="lazy"
            style="width:200px;height:52px"></iframe>
        </div>

        <iframe
          src="../../../../components/mobile/footer/claude.html"
          title="Footer" scrolling="no" loading="lazy"
          style="height:870.63px"></iframe>

      </div>
    </section>

    </div>
  </main>
</body>
</html>
