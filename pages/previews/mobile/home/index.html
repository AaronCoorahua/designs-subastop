<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Preview Mobile — Home · Voyager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault:           oklch(0.22 0.18 285);
  --voyager-color-live:            oklch(0.72 0.16 55);
  --voyager-surface-page:          oklch(0.98 0.004 160);
  --voyager-surface-section:       oklch(0.96 0.006 160);
  --voyager-surface-secondary:     oklch(0.96 0.006 160);
  --voyager-text-primary:          oklch(0.15 0.008 200);
  --voyager-text-on-surface:       oklch(0.15 0.008 200);
  --voyager-text-secondary:        color-mix(in oklch, oklch(0.38 0.04 280) 70%, transparent);
  --voyager-text-tertiary:         color-mix(in oklch, oklch(0.38 0.04 280) 50%, transparent);
  --voyager-text-on-dark:          oklch(1 0 0);
  --voyager-divider-section:       color-mix(in oklch, oklch(0.22 0.18 285) 8%, transparent);
  --voyager-font-display:          "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-font-number:           "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background:
    radial-gradient(ellipse 70% 50% at top left, oklch(0.22 0.18 285 / 5%) 0%, transparent 60%),
    var(--voyager-surface-page);
  color: var(--voyager-text-on-surface);
  font-family: var(--voyager-font-display);
  -webkit-font-smoothing: antialiased;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: 40px 24px 72px;
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 16px;
  color: var(--voyager-text-secondary);
  font-size: 12px;
  font-weight: 600;
}

.breadcrumb a { color: var(--voyager-color-vault); text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb-sep { color: color-mix(in oklch, var(--voyager-color-vault) 32%, transparent); }

.page-title {
  margin: 0 0 4px;
  color: var(--voyager-color-vault);
  font-size: 32px;
  font-weight: 800;
  line-height: 40px;
  letter-spacing: -0.5px;
}

.page-meta {
  margin: 0 0 32px;
  color: var(--voyager-text-secondary);
  font-family: var(--voyager-font-number);
  font-size: 12px;
  font-weight: 500;
}

/* ── Variant tabs (estilo desktop tabbar) ─────────────────────────────── */
.variant-tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  margin: 0 0 32px;
  border-radius: 4px;
  background: var(--voyager-surface-section);
  border: 1px solid var(--voyager-divider-section);
  width: fit-content;
}

.variant-tab {
  appearance: none;
  border: 0;
  background: transparent;
  padding: 10px 20px;
  border-radius: 4px;
  color: var(--voyager-text-secondary);
  font-family: var(--voyager-font-display);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 150ms cubic-bezier(0.3,0,0,1), color 150ms cubic-bezier(0.3,0,0,1);
}

.variant-tab:hover:not(.is-active) {
  background: color-mix(in oklch, var(--voyager-color-vault) 6%, transparent);
  color: var(--voyager-color-vault);
}

.variant-tab:focus-visible { outline: 2px solid var(--voyager-color-live); outline-offset: 2px; }

.variant-tab.is-active {
  color: var(--voyager-text-on-dark);
  background: var(--voyager-color-vault);
  box-shadow: 0 4px 8px color-mix(in oklch, var(--voyager-color-vault) 24%, transparent);
}

/* ── Variant panels — viewer centra el mobile-frame ───────────────────── */
.variant-panel { display: none; }
.variant-panel.is-active { display: flex; justify-content: center; }

/* ── Mobile frame — 420 wide · auto height (ajusta al contenido) ─────────── */
.mobile-frame {
  width: 420px;
  background: var(--voyager-surface-page);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.mobile-frame iframe {
  display: block;
  width: 100%;
  border: 0;
  background: transparent;
}

.mobile-frame .padded {
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.mobile-frame .ph-banner {
  width: 100%;
  border-radius: 8px;
  flex-shrink: 0;
  background: var(--voyager-surface-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
}

.mobile-frame .ph-banner p {
  margin: 0;
  font-family: var(--voyager-font-display);
  font-size: 14px;
  font-weight: 700;
  color: var(--voyager-text-tertiary);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.mobile-frame .ph-banner.hero { height: 598px; }
.mobile-frame .ph-banner.secondary { height: 117px; }
.mobile-frame .ph-banner.help { height: 230px; }

.mobile-frame .qf-wrapper {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.mobile-frame .qf-wrapper iframe {
  display: block;
  width: 100%;
  border: 0;
  background: transparent;
}

/* ── Card wrapper (variante "Cards") ───────────────────────────────────── */
.mobile-frame .card-wrap {
  width: 100%;
  background: var(--voyager-surface-secondary);
  border-radius: 8px;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.mobile-frame .card-wrap iframe {
  display: block;
  width: 100%;
  border: 0;
  background: transparent;
}

/* ── Empty variant placeholder ─────────────────────────────────────────── */
.variant-empty {
  width: 420px;
  min-height: 600px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px dashed color-mix(in oklch, var(--voyager-color-vault) 20%, transparent);
  border-radius: 24px;
  background: color-mix(in oklch, var(--voyager-surface-page) 80%, transparent);
  color: color-mix(in oklch, var(--voyager-text-on-surface) 50%, transparent);
}

.variant-empty p {
  margin: 0;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ─────────────────────────────────────────────────────────────────────────
   ALL-VARIANTS GRID OVERRIDE
   Muestra todas las variantes simultáneamente en columnas/filas (wrap).
   ───────────────────────────────────────────────────────────────────────── */
.page {
  max-width: min(1600px, 100% - 48px);
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
  column-gap: 32px;
  row-gap: 48px;
  align-items: start;
  justify-items: center;
}
.breadcrumb,
.page-title,
.page-meta,
.variant-tabs {
  grid-column: 1 / -1;
  justify-self: start;
  width: 100%;
}
.variant-tabs { display: none; }
.variant-panel,
.variant-panel.is-active {
  display: flex !important;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 100%;
}
.variant-panel::before {
  content: attr(data-variant);
  font-family: var(--voyager-font-display);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--voyager-text-secondary);
}
</style>
</head>

<script>
function fitIframeToContent(iframe) {
  try {
    const doc = iframe.contentDocument;
    if (!doc) return;
    const html = doc.documentElement;
    const body = doc.body;
    if (!body) return;
    const h = Math.max(
      body.scrollHeight, html.scrollHeight,
      body.offsetHeight, html.offsetHeight
    );
    if (h > 0) iframe.style.height = h + "px";
  } catch (error) {}
}

const autoIframes = Array.from(document.querySelectorAll("iframe[data-autoheight]"));

autoIframes.forEach(function (iframe) {
  iframe.addEventListener("load", function () {
    fitIframeToContent(iframe);
    setTimeout(function () { fitIframeToContent(iframe); }, 50);
    setTimeout(function () { fitIframeToContent(iframe); }, 300);
  });
  if (iframe.contentDocument && iframe.contentDocument.readyState === "complete") {
    fitIframeToContent(iframe);
  }
});

window.addEventListener("load", function () {
  autoIframes.forEach(fitIframeToContent);
});

window.addEventListener("resize", function () {
  autoIframes.forEach(fitIframeToContent);
});

const variantTabs = Array.from(document.querySelectorAll(".variant-tab"));
const variantPanels = Array.from(document.querySelectorAll(".variant-panel"));

function activateVariant(name) {
  variantTabs.forEach(function (tab) {
    const isActive = tab.dataset.variant === name;
    tab.classList.toggle("is-active", isActive);
    tab.setAttribute("aria-selected", String(isActive));
  });
  variantPanels.forEach(function (panel) {
    panel.classList.toggle("is-active", panel.dataset.variant === name);
  });
  try {
    const url = new URL(window.location.href);
    url.searchParams.set("variant", name);
    window.history.replaceState(null, "", url.toString());
  } catch (error) {}
}

variantTabs.forEach(function (tab) {
  tab.addEventListener("click", function () {
    activateVariant(tab.dataset.variant);
  });
});

try {
  const url = new URL(window.location.href);
  const initial = url.searchParams.get("variant") === "cards" ? "cards" : "ancho";
  activateVariant(initial);
} catch (error) {
  activateVariant("ancho");
}
</script>
