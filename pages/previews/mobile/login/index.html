<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Preview Mobile — Login · Voyager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault:           oklch(0.22 0.18 285);
  --voyager-color-live:            oklch(0.72 0.16 55);
  --voyager-surface-page:          oklch(0.98 0.004 160);
  --voyager-surface-section:       oklch(0.96 0.006 160);
  --voyager-text-on-surface:       oklch(0.15 0.008 200);
  --voyager-text-secondary:        color-mix(in oklch, oklch(0.38 0.04 280) 70%, transparent);
  --voyager-text-tertiary:         color-mix(in oklch, oklch(0.38 0.04 280) 50%, transparent);
  --voyager-text-on-dark:          oklch(1 0 0);
  --voyager-divider-section:       color-mix(in oklch, oklch(0.22 0.18 285) 8%, transparent);
  --voyager-font-display:          "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background:
    radial-gradient(ellipse 70% 50% at top left, oklch(0.22 0.18 285 / 5%) 0%, transparent 60%),
    var(--voyager-surface-page);
  color: var(--voyager-text-on-surface);
  font-family: var(--voyager-font-display);
  -webkit-font-smoothing: antialiased;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: 40px 24px 72px;
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 16px;
  color: var(--voyager-text-secondary);
  font-size: 12px;
  font-weight: 600;
}

.breadcrumb a { color: var(--voyager-color-vault); text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb-sep { color: color-mix(in oklch, var(--voyager-color-vault) 32%, transparent); }

.page-title {
  margin: 0 0 4px;
  color: var(--voyager-color-vault);
  font-size: 32px;
  font-weight: 800;
  line-height: 40px;
  letter-spacing: -0.5px;
}

.page-meta {
  margin: 0 0 32px;
  color: var(--voyager-text-secondary);
  font-size: 12px;
  font-weight: 500;
}

/* ── Catalog stack — 1 columna, variantes apiladas ──────────────────────── */
.viewer {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 48px;
}

.variant {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.variant-label {
  margin: 0;
  color: var(--voyager-color-vault);
  font-size: 11px;
  font-weight: 800;
  line-height: 16px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.mobile-frame {
  width: 390px;
  background: var(--voyager-surface-page);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.mobile-frame > iframe {
  display: block;
  width: 100%;
  border: 0;
  background: transparent;
}

/* ── Carded · 430 wide, vault bg, white card around login form ─────── */
.mobile-frame.is-carded {
  width: 430px;
  background: var(--voyager-color-vault);
}
.mobile-frame.is-carded .login-stage {
  padding: 24px 20px;
  display: flex;
  justify-content: center;
}
.mobile-frame.is-carded .login-stage .card-wrap {
  width: 100%;
  background: oklch(1 0 0);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 12px 28px oklch(0 0 0 / 18%);
}
.mobile-frame.is-carded .login-stage .card-wrap iframe {
  display: block;
  width: 100%;
  height: 572.2px;
  border: 0;
  background: transparent;
}

</style>
</head>
<body>
  <main class="page">
    <p class="breadcrumb">
      <a href="../../index.html">Previews</a>
      <span class="breadcrumb-sep">›</span>
      <span>Login · Mobile</span>
    </p>
    <h1 class="page-title">Login</h1>
    <p class="page-meta">Header + Login Form + Footer · 2 variantes (Default 390 · Card sobre Vault 430)</p>

    <div class="viewer">

    <!-- ── Variante: Default ─────────────────────────────────────────────── -->
    <section class="variant">
      <p class="variant-label">Default</p>
      <div class="mobile-frame" aria-label="Mobile login — Default">

        <iframe
          src="../../../../components/mobile/header/claude.html"
          title="Header"
          scrolling="no"
          loading="lazy"
          style="height:56px"></iframe>

        <iframe
          src="../../../../components/mobile/login-form/claude.html?variant=Base%20%C2%B7%20Desactivado&embed=1"
          title="Login Form · Base Desactivado"
          scrolling="no"
          loading="lazy"
          style="height:572.2px"></iframe>

        <iframe
          src="../../../../components/mobile/footer/claude.html"
          title="Footer"
          scrolling="no"
          loading="lazy"
          style="height:870.63px"></iframe>

      </div>
    </section>

    <!-- ── Variante: Card sobre Vault ────────────────────────────────────── -->
    <section class="variant">
      <p class="variant-label">Card sobre Vault</p>
      <div class="mobile-frame is-carded" aria-label="Mobile login — Card sobre Vault">

        <iframe
          src="../../../../components/mobile/header/claude.html"
          title="Header"
          scrolling="no"
          loading="lazy"
          style="height:56px"></iframe>

        <div class="login-stage">
          <div class="card-wrap">
            <iframe
              src="../../../../components/mobile/login-form/claude.html?variant=Base%20%C2%B7%20Desactivado&embed=1"
              title="Login Form · Base Desactivado"
              scrolling="no"
              loading="lazy"></iframe>
          </div>
        </div>

        <iframe
          src="../../../../components/mobile/footer/claude.html"
          title="Footer"
          scrolling="no"
          loading="lazy"
          style="height:870.63px"></iframe>

      </div>
    </section>

    <!-- ── Variante: New Style (new-style header) ──────────────────────── -->
    <section class="variant">
      <p class="variant-label">New Style</p>
      <div class="mobile-frame" aria-label="Mobile login — New Style">

        <iframe
          src="../../../../components/mobile/header/new-style/claude.html"
          title="Header · New Style"
          scrolling="no"
          loading="lazy"
          style="height:56px"></iframe>

        <iframe
          src="../../../../components/mobile/login-form/claude.html?variant=Vault%20Cinematic&embed=1"
          title="Login Form · Vault Cinematic"
          scrolling="no"
          loading="lazy"
          style="height:572.2px"></iframe>

        <iframe
          src="../../../../components/mobile/footer/claude.html"
          title="Footer"
          scrolling="no"
          loading="lazy"
          style="height:870.63px"></iframe>

      </div>
    </section>

    </div>
  </main>
</body>
</html>
