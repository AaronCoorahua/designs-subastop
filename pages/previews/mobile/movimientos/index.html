<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Preview Mobile — Movimientos · Voyager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault:       oklch(0.22 0.18 285);
  --voyager-color-live:        oklch(0.72 0.16 55);
  --voyager-surface-page:      oklch(0.98 0.004 160);
  --voyager-surface-section:   oklch(0.96 0.006 160);
  --voyager-text-on-surface:   oklch(0.15 0.008 200);
  --voyager-text-secondary:    color-mix(in oklch, oklch(0.38 0.04 280) 70%, transparent);
  --voyager-text-on-dark:      oklch(1 0 0);
  --voyager-divider-section:   color-mix(in oklch, oklch(0.22 0.18 285) 8%, transparent);
  --voyager-font-display:      "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background:
    radial-gradient(ellipse 70% 50% at top left, oklch(0.22 0.18 285 / 5%) 0%, transparent 60%),
    var(--voyager-surface-page);
  color: var(--voyager-text-on-surface);
  font-family: var(--voyager-font-display);
  -webkit-font-smoothing: antialiased;
}

.page {
  max-width: 1280px;
  margin: 0 auto;
  padding: 40px 24px 72px;
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 16px;
  color: var(--voyager-text-secondary);
  font-size: 12px;
  font-weight: 600;
}
.breadcrumb a { color: var(--voyager-color-vault); text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb-sep { color: color-mix(in oklch, var(--voyager-color-vault) 32%, transparent); }

.page-title {
  margin: 0 0 4px;
  color: var(--voyager-color-vault);
  font-size: 32px;
  font-weight: 800;
  line-height: 40px;
  letter-spacing: -0.5px;
}

.page-meta {
  margin: 0 0 32px;
  color: var(--voyager-text-secondary);
  font-size: 12px;
  font-weight: 500;
}

/* ── Variant tabs ─────────────────────────────────────────────────────── */
.variant-tabs {
  display: flex;
  gap: 4px;
  padding: 4px;
  margin: 0 0 32px;
  border-radius: 4px;
  background: var(--voyager-surface-section);
  border: 1px solid var(--voyager-divider-section);
  width: fit-content;
}
.variant-tab {
  appearance: none;
  border: 0;
  background: transparent;
  padding: 10px 20px;
  border-radius: 4px;
  color: var(--voyager-text-secondary);
  font-family: var(--voyager-font-display);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition:
    background 150ms cubic-bezier(0.3,0,0,1),
    color      150ms cubic-bezier(0.3,0,0,1);
}
.variant-tab:hover:not(.is-active) {
  background: color-mix(in oklch, var(--voyager-color-vault) 6%, transparent);
  color: var(--voyager-color-vault);
}
.variant-tab:focus-visible { outline: 2px solid var(--voyager-color-live); outline-offset: 2px; }
.variant-tab.is-active {
  color: var(--voyager-text-on-dark);
  background: var(--voyager-color-vault);
  box-shadow: 0 4px 8px color-mix(in oklch, var(--voyager-color-vault) 24%, transparent);
}

.variant-panel { display: none; }
.variant-panel.is-active {
  display: flex;
  justify-content: center;
  gap: 32px;
  flex-wrap: wrap;
}

/* ── Mobile column wrapper ────────────────────────────────────────────── */
.mobile-column {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.mobile-column-label {
  font-family: var(--voyager-font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--voyager-color-vault);
  padding: 6px 14px;
  border: 1px solid var(--voyager-divider-section);
  border-radius: 9999px;
  background: var(--voyager-surface-section);
}

.mobile-frame {
  width: 430px;
  background: var(--voyager-surface-section);
  display: flex;
  flex-direction: column;
}

.mobile-frame > iframe {
  display: block;
  width: 100%;
  border: 0;
  background: transparent;
}

/* Stack interno · 16px top/bottom · gap 16 entre cards · todo centrado */
.mobile-frame .body-stage {
  padding: 20px 0 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.mobile-frame .body-stage iframe {
  display: block;
  border: 0;
  background: transparent;
}
</style>
</head>
<body>
  <main class="page">
    <p class="breadcrumb">
      <a href="../../index.html">Previews</a>
      <span class="breadcrumb-sep">›</span>
      <span>Movimientos · Mobile</span>
    </p>
    <h1 class="page-title">Movimientos</h1>
    <p class="page-meta">430 wide · Header Logged · Movimientos Header (390×168) · Banner Movimientos (390×253.25) · Historial Transacciones (390×236) · Footer · 2 tabs (Gradients · New Styles)</p>

    <nav class="variant-tabs" role="tablist" aria-label="Variantes">
      <button class="variant-tab is-active" role="tab" aria-selected="true" data-variant="gradients" type="button">Gradients</button>
      <button class="variant-tab" role="tab" aria-selected="false" data-variant="new-styles" type="button">New Styles</button>
    </nav>

    <!-- ══════════════════════════════════════════════════════════════════════
         TAB 1 — GRADIENTS · Vault Gradient + Live Gradient
         ══════════════════════════════════════════════════════════════════ -->
    <section class="variant-panel is-active" data-variant="gradients">

      <!-- ── Columna A · Vault Gradient ───────────────────────────────── -->
      <div class="mobile-column">
        <span class="mobile-column-label">Vault Gradient</span>
        <div class="mobile-frame" aria-label="Movimientos · Vault Gradient">

          <iframe
            src="../../../../components/mobile/header/logged-live/claude.html"
            title="Header · Logged Live Gradient" scrolling="no" loading="lazy"
            style="height:56px"></iframe>

          <div class="body-stage">
            <iframe
              src="../../../../components/mobile/movimientos-header/claude.html?variant=Vault&embed=1"
              title="Movimientos Header · Vault Gradient" scrolling="no" loading="lazy"
              style="width:390px;height:168px"></iframe>

            <iframe
              src="../../../../components/mobile/banner-movimientos/claude.html?variant=Vault%20Gradient&embed=1"
              title="Banner Movimientos · Vault Gradient" scrolling="no" loading="lazy"
              style="width:390px;height:253.25px"></iframe>

            <iframe
              src="../../../../components/mobile/historial-transacciones/claude.html?variant=Vault%20Gradient&embed=1"
              title="Historial Transacciones · Vault Gradient" scrolling="no" loading="lazy"
              style="width:390px;height:236px"></iframe>
          </div>

          <iframe
            src="../../../../components/mobile/footer/claude.html"
            title="Footer" scrolling="no" loading="lazy"
            style="height:870.63px"></iframe>

        </div>
      </div>

      <!-- ── Columna B · Live Gradient ────────────────────────────────── -->
      <div class="mobile-column">
        <span class="mobile-column-label">Live Gradient</span>
        <div class="mobile-frame" aria-label="Movimientos · Live Gradient">

          <iframe
            src="../../../../components/mobile/header/logged-live/claude.html"
            title="Header · Logged Live Gradient" scrolling="no" loading="lazy"
            style="height:56px"></iframe>

          <div class="body-stage">
            <iframe
              src="../../../../components/mobile/movimientos-header/claude.html?variant=Clean&embed=1"
              title="Movimientos Header · Clean" scrolling="no" loading="lazy"
              style="width:390px;height:168px"></iframe>

            <iframe
              src="../../../../components/mobile/banner-movimientos/claude.html?variant=Live%20Gradient&embed=1"
              title="Banner Movimientos · Live Gradient" scrolling="no" loading="lazy"
              style="width:390px;height:253.25px"></iframe>

            <iframe
              src="../../../../components/mobile/historial-transacciones/claude.html?variant=Live%20Gradient&embed=1"
              title="Historial Transacciones · Live Gradient" scrolling="no" loading="lazy"
              style="width:390px;height:236px"></iframe>
          </div>

          <iframe
            src="../../../../components/mobile/footer/claude.html"
            title="Footer" scrolling="no" loading="lazy"
            style="height:870.63px"></iframe>

        </div>
      </div>

    </section>

    <!-- ══════════════════════════════════════════════════════════════════════
         TAB 2 — NEW STYLES · Iridescent + Cinematic Vault
         ══════════════════════════════════════════════════════════════════ -->
    <section class="variant-panel" data-variant="new-styles">

      <!-- ── Columna A · Iridescent (.pvbtn) ─────────────────────────── -->
      <div class="mobile-column">
        <span class="mobile-column-label">Iridescent</span>
        <div class="mobile-frame" aria-label="Movimientos · Iridescent">

          <iframe
            src="../../../../components/mobile/header/logged-iridescent/claude.html"
            title="Header · Logged Iridescent" scrolling="no" loading="lazy"
            style="height:56px"></iframe>

          <div class="body-stage">
            <iframe
              src="../../../../components/mobile/movimientos-header/claude.html?variant=Clean&embed=1"
              title="Movimientos Header · Clean" scrolling="no" loading="lazy"
              style="width:390px;height:168px"></iframe>

            <iframe
              src="../../../../components/mobile/banner-movimientos/claude.html?variant=Iridescent&embed=1"
              title="Banner Movimientos · Iridescent" scrolling="no" loading="lazy"
              style="width:390px;height:253.25px"></iframe>

            <iframe
              src="../../../../components/mobile/historial-transacciones/claude.html?variant=Live%20Gradient&embed=1"
              title="Historial Transacciones · Live Gradient" scrolling="no" loading="lazy"
              style="width:390px;height:236px"></iframe>
          </div>

          <iframe
            src="../../../../components/mobile/footer/claude.html"
            title="Footer" scrolling="no" loading="lazy"
            style="height:870.63px"></iframe>

        </div>
      </div>

      <!-- ── Columna B · Cinematic Vault (.psec) ────────────────────── -->
      <div class="mobile-column">
        <span class="mobile-column-label">Cinematic Vault</span>
        <div class="mobile-frame" aria-label="Movimientos · Cinematic Vault">

          <iframe
            src="../../../../components/mobile/header/logged-iridescent/claude.html"
            title="Header · Logged Iridescent" scrolling="no" loading="lazy"
            style="height:56px"></iframe>

          <div class="body-stage">
            <iframe
              src="../../../../components/mobile/movimientos-header/claude.html?variant=Clean&embed=1"
              title="Movimientos Header · Clean" scrolling="no" loading="lazy"
              style="width:390px;height:168px"></iframe>

            <iframe
              src="../../../../components/mobile/banner-movimientos/claude.html?variant=Cinematic%20Vault&embed=1"
              title="Banner Movimientos · Cinematic Vault" scrolling="no" loading="lazy"
              style="width:390px;height:253.25px"></iframe>

            <iframe
              src="../../../../components/mobile/historial-transacciones/claude.html?variant=Vault%20Gradient&embed=1"
              title="Historial Transacciones · Vault Gradient" scrolling="no" loading="lazy"
              style="width:390px;height:236px"></iframe>
          </div>

          <iframe
            src="../../../../components/mobile/footer/claude.html"
            title="Footer" scrolling="no" loading="lazy"
            style="height:870.63px"></iframe>

        </div>
      </div>

    </section>
  </main>

  <script>
    const tabs = Array.from(document.querySelectorAll(".variant-tab"));
    const panels = Array.from(document.querySelectorAll(".variant-panel"));

    function activate(variant) {
      tabs.forEach(function (tab) {
        const isActive = tab.dataset.variant === variant;
        tab.classList.toggle("is-active", isActive);
        tab.setAttribute("aria-selected", String(isActive));
      });
      panels.forEach(function (panel) {
        panel.classList.toggle("is-active", panel.dataset.variant === variant);
      });
    }

    tabs.forEach(function (tab) {
      tab.addEventListener("click", function () { activate(tab.dataset.variant); });
    });
  </script>
</body>
</html>
