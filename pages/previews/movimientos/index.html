<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Previews · Movimientos — Voyager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault:      oklch(0.22 0.18 285);
  --voyager-color-vault-mid:  oklch(0.30 0.20 285);
  --voyager-color-live:       oklch(0.72 0.16 55);
  --voyager-surface-page:     #F8FAF9;
  --voyager-surface-card:     #FFFFFF;
  --voyager-surface-section:  #F2F4F3;
  --voyager-text-primary:     #191C1C;
  --voyager-text-secondary:   #494550;
  --voyager-text-on-dark:     #FFFFFF;
  --voyager-border-ghost:     #22005C1A;
  --voyager-divider-section:  #22005C0D;
  --voyager-font-ui:          "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --voyager-font-number:      "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background:
    radial-gradient(ellipse 70% 50% at top left, var(--voyager-border-ghost) 0%, transparent 60%),
    var(--voyager-surface-page);
  color: var(--voyager-text-primary);
  font-family: var(--voyager-font-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: 40px 24px 72px;
}

/* ── Breadcrumb ──────────────────────────────────────────────────────────── */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 16px;
  color: var(--voyager-text-secondary);
  font-size: 12px;
  font-weight: 600;
}
.breadcrumb a { color: var(--voyager-color-vault); text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb-sep { color: color-mix(in srgb, var(--voyager-color-vault) 32%, transparent); }

.page-title {
  margin: 0 0 4px;
  color: var(--voyager-color-vault);
  font-size: 32px;
  font-weight: 800;
  line-height: 40px;
  letter-spacing: -0.5px;
}

.page-meta {
  margin: 0 0 32px;
  color: var(--voyager-text-secondary);
  font-family: var(--voyager-font-number);
  font-size: 12px;
  font-weight: 500;
}

/* ── Tab bar ─────────────────────────────────────────────────────────────── */
.tabbar {
  display: flex;
  gap: 4px;
  padding: 4px;
  margin: 0 0 32px;
  border-radius: 4px;
  background: var(--voyager-surface-section);
  border: 1px solid var(--voyager-divider-section);
  width: fit-content;
}

.tab {
  appearance: none;
  border: 0;
  background: transparent;
  padding: 10px 20px;
  border-radius: 4px;
  color: var(--voyager-text-secondary);
  font-family: var(--voyager-font-ui);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 150ms cubic-bezier(0.3,0,0,1), color 150ms cubic-bezier(0.3,0,0,1);
}
.tab:hover {
  background: color-mix(in srgb, var(--voyager-color-vault) 6%, transparent);
  color: var(--voyager-color-vault);
}
.tab:focus-visible { outline: 2px solid var(--voyager-color-live); outline-offset: 2px; }
.tab[aria-selected="true"] {
  color: var(--voyager-text-on-dark);
  background: var(--voyager-color-vault);
  box-shadow: 0 4px 8px color-mix(in srgb, var(--voyager-color-vault) 24%, transparent);
}

.viewer { display: flex; justify-content: center; }

/* ── Canvas 790 × 557.87 ─────────────────────────────────────────────────── */
.canvas {
  position: relative;
  width: 790px;
  height: 557.87px;
  overflow: hidden;
  border-radius: 4px;
  background: var(--voyager-surface-section);
  box-shadow: 0 12px 32px color-mix(in srgb, var(--voyager-color-vault) 18%, transparent);
}
.canvas[hidden] { display: none; }

/* ── Zones ───────────────────────────────────────────────────────────────── */
.zone {
  position: absolute;
  overflow: hidden;
}
.zone iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: transparent;
}

/* Layout per spec — componentes 766.01 wide centrados (left=12, gap horiz=12).
   Vertical: top 12 + header 63.96 + gap 20 + banner 161.96 + gap 20
           + historial 267.95 + bottom 12 = 557.87. */
.zone-header     { top:  12px;     left: 12px; width: 766.01px; height:  63.96px; }
.zone-banner     { top:  95.96px;  left: 12px; width: 766.01px; height: 161.96px; }
.zone-historial  { top: 277.92px;  left: 12px; width: 766.01px; height: 267.95px; }
</style>
</head>
<body>
<main class="page">

  <p class="breadcrumb">
    <a href="../index.html">Previews</a>
    <span class="breadcrumb-sep">›</span>
    <span>Movimientos</span>
  </p>
  <h1 class="page-title">Movimientos</h1>
  <p class="page-meta">790 × 557.87 · 3 variantes</p>

  <div class="tabbar" role="tablist" aria-label="Variantes de Movimientos">
    <button type="button" class="tab" role="tab" id="tab-1" aria-selected="true"  data-target="canvas-1">Modern</button>
    <button type="button" class="tab" role="tab" id="tab-2" aria-selected="false" data-target="canvas-2">Vault</button>
    <button type="button" class="tab" role="tab" id="tab-3" aria-selected="false" data-target="canvas-3">Live</button>
  </div>

  <div class="viewer">

    <!-- ====================== VARIANTE 1 — MODERN ====================== -->
    <div class="canvas" id="canvas-1" role="tabpanel" aria-labelledby="tab-1">
      <div class="zone zone-header">
        <iframe src="../../../components/movimientos-header/claude.html?embed=1&variant=Modern%20%C2%B7%20Clean"
                scrolling="no" loading="lazy" title="Movimientos Header — Modern Clean"></iframe>
      </div>
      <div class="zone zone-banner">
        <iframe src="../../../components/banner-movimientos/claude.html?embed=1&variant=Vault%20%C2%B7%20Button"
                scrolling="no" loading="lazy" title="Banner Movimientos — Vault Button"></iframe>
      </div>
      <div class="zone zone-historial">
        <iframe src="../../../components/historial-transacciones/claude.html?embed=1&variant=Vault%20%C2%B7%20Solid%20(sin%20gradiente)"
                scrolling="no" loading="lazy" title="Historial — Vault Solid"></iframe>
      </div>
    </div>

    <!-- ====================== VARIANTE 2 — VAULT ======================= -->
    <div class="canvas" id="canvas-2" role="tabpanel" aria-labelledby="tab-2" hidden>
      <div class="zone zone-header">
        <iframe src="../../../components/movimientos-header/claude.html?embed=1&variant=Vault%20%C2%B7%20Gradient"
                scrolling="no" loading="lazy" title="Movimientos Header — Vault Gradient"></iframe>
      </div>
      <div class="zone zone-banner">
        <iframe src="../../../components/banner-movimientos/claude.html?embed=1&variant=Vault%20%C2%B7%20Button"
                scrolling="no" loading="lazy" title="Banner Movimientos — Vault Button"></iframe>
      </div>
      <div class="zone zone-historial">
        <iframe src="../../../components/historial-transacciones/claude.html?embed=1&variant=Vault%20%C2%B7%20Gradient%20horizontal"
                scrolling="no" loading="lazy" title="Historial — Vault Gradient"></iframe>
      </div>
    </div>

    <!-- ====================== VARIANTE 3 — LIVE ======================== -->
    <div class="canvas" id="canvas-3" role="tabpanel" aria-labelledby="tab-3" hidden>
      <div class="zone zone-header">
        <iframe src="../../../components/movimientos-header/claude.html?embed=1&variant=Modern%20%C2%B7%20Clean"
                scrolling="no" loading="lazy" title="Movimientos Header — Modern Clean"></iframe>
      </div>
      <div class="zone zone-banner">
        <iframe src="../../../components/banner-movimientos/claude.html?embed=1&variant=Live%20%C2%B7%20Button"
                scrolling="no" loading="lazy" title="Banner Movimientos — Live Button"></iframe>
      </div>
      <div class="zone zone-historial">
        <iframe src="../../../components/historial-transacciones/claude.html?embed=1&variant=Live%20%C2%B7%20Gradient%20horizontal"
                scrolling="no" loading="lazy" title="Historial — Live Gradient"></iframe>
      </div>
    </div>

  </div>
</main>

<script>
function handleTabClick(event) {
  var clicked = event.currentTarget;
  var tabs = document.querySelectorAll('.tab');
  var canvases = document.querySelectorAll('.canvas');
  var targetId = clicked.getAttribute('data-target');
  var i = 0;
  for (i = 0; i < tabs.length; i++) {
    tabs[i].setAttribute('aria-selected', tabs[i] === clicked ? 'true' : 'false');
  }
  for (i = 0; i < canvases.length; i++) {
    if (canvases[i].id === targetId) {
      canvases[i].removeAttribute('hidden');
    } else {
      canvases[i].setAttribute('hidden', '');
    }
  }
}

(function bindTabs() {
  var tabs = document.querySelectorAll('.tab');
  var i = 0;
  for (i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', handleTabClick);
  }
})();
</script>
</body>
</html>
