<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Previews · Selecciona Monto — Voyager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault:      oklch(0.22 0.18 285);
  --voyager-color-vault-mid:  oklch(0.30 0.20 285);
  --voyager-color-vault-dark: oklch(0.26 0.19 285);
  --voyager-color-live:       oklch(0.72 0.16 55);
  --voyager-surface-page:     #F8FAF9;
  --voyager-surface-card:     #FFFFFF;
  --voyager-surface-section:  #F2F4F3;
  --voyager-text-primary:     #191C1C;
  --voyager-text-secondary:   #494550;
  --voyager-text-on-dark:     #FFFFFF;
  --voyager-border-ghost:     #22005C1A;
  --voyager-divider-section:  #22005C0D;
  --voyager-gradient-vault:   linear-gradient(135deg, #22005C 0%, #3B1782 100%);
  --voyager-gradient-live:    linear-gradient(135deg, #F4AC59 0%, #ED8936 60%, #D07128 100%);
  --voyager-font-ui:          "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --voyager-font-number:      "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background:
    radial-gradient(ellipse 70% 50% at top left, var(--voyager-border-ghost) 0%, transparent 60%),
    var(--voyager-surface-page);
  color: var(--voyager-text-primary);
  font-family: var(--voyager-font-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: 40px 24px 72px;
}

/* ── Breadcrumb ──────────────────────────────────────────────────────────── */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 16px;
  color: var(--voyager-text-secondary);
  font-size: 12px;
  font-weight: 600;
}
.breadcrumb a { color: var(--voyager-color-vault); text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb-sep { color: color-mix(in srgb, var(--voyager-color-vault) 32%, transparent); }

.page-title {
  margin: 0 0 4px;
  color: var(--voyager-color-vault);
  font-size: 32px;
  font-weight: 800;
  line-height: 40px;
  letter-spacing: -0.5px;
}

.page-meta {
  margin: 0 0 32px;
  color: var(--voyager-text-secondary);
  font-family: var(--voyager-font-number);
  font-size: 12px;
  font-weight: 500;
}

/* ── Tab bar ─────────────────────────────────────────────────────────────── */
.tabbar {
  display: flex;
  gap: 4px;
  padding: 4px;
  margin: 0 0 32px;
  border-radius: 4px;
  background: var(--voyager-surface-section);
  border: 1px solid var(--voyager-divider-section);
  width: fit-content;
}

.tab {
  appearance: none;
  border: 0;
  background: transparent;
  padding: 10px 20px;
  border-radius: 4px;
  color: var(--voyager-text-secondary);
  font-family: var(--voyager-font-ui);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 150ms cubic-bezier(0.3,0,0,1), color 150ms cubic-bezier(0.3,0,0,1);
}
.tab:hover {
  background: color-mix(in srgb, var(--voyager-color-vault) 6%, transparent);
  color: var(--voyager-color-vault);
}
.tab:focus-visible { outline: 2px solid var(--voyager-color-live); outline-offset: 2px; }
.tab[aria-selected="true"] {
  color: var(--voyager-text-on-dark);
  background: var(--voyager-color-vault);
  box-shadow: 0 4px 8px color-mix(in srgb, var(--voyager-color-vault) 24%, transparent);
}

.viewer {
  display: flex;
  justify-content: center;
}

/* ── Canvas 790 × 683.44 — fondo gris claro ─────────────────────────────── */
.canvas {
  position: relative;
  width: 790px;
  height: 683.44px;
  overflow: hidden;
  border-radius: 4px;
  background: var(--voyager-surface-section);
  box-shadow: 0 12px 32px color-mix(in srgb, var(--voyager-color-vault) 18%, transparent);
}
.canvas[hidden] { display: none; }

/* ── Banner (HTML directo) — 710 × 55.38, centrado horizontalmente ──────── */
.zone-banner {
  position: absolute;
  top: 32px;
  left: 40px;
  width: 710px;
  height: 55.38px;
  display: flex;
  align-items: center;
  padding: 0 24px;
  border-radius: 4px;
}
.zone-banner--vault { background: var(--voyager-gradient-vault); }
.zone-banner--live  { background: var(--voyager-gradient-live); }

.banner-text {
  margin: 0;
  color: var(--voyager-text-on-dark);
  font-size: 17px;
  font-weight: 300;
  line-height: 1.45;
}
.zone-banner--live .banner-text {
  color: oklch(0.18 0.16 285);
}

/* ── Zones for iframes ───────────────────────────────────────────────────── */
.zone {
  position: absolute;
  overflow: hidden;
}

.zone iframe {
  position: absolute;
  border: 0;
  background: transparent;
}

/* Layout per spec:
   info   zone: 392.4  × 476.06 — left 40
   select zone: 253.59 × 476.06 — left 496.41 (40 + 392.4 + 64 gap)
   top: 119.38 = 32 (top pad) + 55.38 (banner) + 32 (gap) */
.zone-info   { top: 119.38px; left:  40px;    width: 392.4px;  height: 476.06px; }
.zone-select { top: 119.38px; left: 496.41px; width: 253.59px; height: 476.06px; }

/* embed=1 garantiza componente sin stage padding / label / fondo.
   Iframes se anclan a (0,0) y rellenan la zona — zone clip vía overflow:hidden. */
.zone-info   iframe { top: 0; left: 0; width: 100%; height: 100%; }
.zone-select iframe { top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<main class="page">

  <p class="breadcrumb">
    <a href="../index.html">Previews</a>
    <span class="breadcrumb-sep">›</span>
    <span>Selecciona Monto</span>
  </p>
  <h1 class="page-title">Selecciona Monto</h1>
  <p class="page-meta">790 × 683.44 · 3 variantes</p>

  <div class="tabbar" role="tablist" aria-label="Variantes de selección de monto">
    <button type="button" class="tab" role="tab" id="tab-1" aria-selected="true"  data-target="canvas-1">Vault</button>
    <button type="button" class="tab" role="tab" id="tab-2" aria-selected="false" data-target="canvas-2">Live</button>
    <button type="button" class="tab" role="tab" id="tab-3" aria-selected="false" data-target="canvas-3">Modern</button>
  </div>

  <div class="viewer">

    <!-- ==================== VARIANTE 1 — Vault ==================== -->
    <div class="canvas" id="canvas-1" role="tabpanel" aria-labelledby="tab-1">

      <div class="zone-banner zone-banner--vault" aria-label="SubasCoins promo">
<p class="banner-text">¡Adquiere SubasCoins y disfruta de sus beneficios!</p>
      </div>

<div class="zone zone-info">
        <iframe src="../../../components/subascoins-info/claude.html?embed=1&variant=Con%20imagen"
                scrolling="no" loading="lazy" title="SubasCoins Info — Con imagen"></iframe>
      </div>

      <div class="zone zone-select">
        <iframe src="../../../components/select-subascoins/claude.html?embed=1&variant=Vault%20%C2%B7%20Seleccionado"
                scrolling="no" loading="lazy" title="Selecciona monto — Vault Seleccionado"></iframe>
      </div>

    </div>

    <!-- ==================== VARIANTE 2 — Live ==================== -->
    <div class="canvas" id="canvas-2" role="tabpanel" aria-labelledby="tab-2" hidden>

      <div class="zone-banner zone-banner--live" aria-label="SubasCoins promo">
<p class="banner-text">¡Adquiere SubasCoins y disfruta de sus beneficios!</p>
      </div>

<div class="zone zone-info">
        <iframe src="../../../components/subascoins-info/claude.html?embed=1&variant=Sin%20imagen"
                scrolling="no" loading="lazy" title="SubasCoins Info — Sin imagen"></iframe>
      </div>

      <div class="zone zone-select">
        <iframe src="../../../components/select-subascoins/claude.html?embed=1&variant=Live%20%C2%B7%20Naranja"
                scrolling="no" loading="lazy" title="Selecciona monto — Live Naranja"></iframe>
      </div>

    </div>

    <!-- ==================== VARIANTE 3 — Modern ==================== -->
    <div class="canvas" id="canvas-3" role="tabpanel" aria-labelledby="tab-3" hidden>

      <div class="zone-banner zone-banner--vault" aria-label="SubasCoins promo">
<p class="banner-text">¡Adquiere SubasCoins y disfruta de sus beneficios!</p>
      </div>

<div class="zone zone-info">
        <iframe src="../../../components/subascoins-info/claude.html?embed=1&variant=Promo%20card%20(propuesta)"
                scrolling="no" loading="lazy" title="SubasCoins Info — Promo card"></iframe>
      </div>

      <div class="zone zone-select">
        <iframe src="../../../components/select-subascoins/claude.html?embed=1&variant=Modern%20%C2%B7%20Coin%20Selector"
                scrolling="no" loading="lazy" title="Selecciona monto — Modern Coin Selector"></iframe>
      </div>

    </div>

  </div>
</main>

<script>
function handleTabClick(event) {
  var clicked = event.currentTarget;
  var tabs = document.querySelectorAll('.tab');
  var canvases = document.querySelectorAll('.canvas');
  var targetId = clicked.getAttribute('data-target');
  var i = 0;
  for (i = 0; i < tabs.length; i++) {
    tabs[i].setAttribute('aria-selected', tabs[i] === clicked ? 'true' : 'false');
  }
  for (i = 0; i < canvases.length; i++) {
    if (canvases[i].id === targetId) {
      canvases[i].removeAttribute('hidden');
    } else {
      canvases[i].setAttribute('hidden', '');
    }
  }
}

(function bindTabs() {
  var tabs = document.querySelectorAll('.tab');
  var i = 0;
  for (i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', handleTabClick);
  }
})();
</script>
</body>
</html>
