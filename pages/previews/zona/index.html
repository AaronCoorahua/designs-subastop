<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Previews · Zona — Voyager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --voyager-color-vault: #22005C;
  --voyager-color-vault-mid: #3B1782;
  --voyager-color-vault-dark: #2E0F70;
  --voyager-color-vault-ink: #08003A;
  --voyager-color-live: #ED8936;
  --voyager-surface-page: #F8FAF9;
  --voyager-surface-card: #FFFFFF;
  --voyager-surface-section: #F2F4F3;
  --voyager-text-primary: #191C1C;
  --voyager-text-secondary: #494550;
  --voyager-text-on-dark: #FFFFFF;
  --voyager-border-ghost: #22005C1A;
  --voyager-divider-section: #22005C0D;
  --voyager-font-ui: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --voyager-font-number: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background:
    radial-gradient(ellipse 70% 50% at top left, var(--voyager-border-ghost) 0%, transparent 60%),
    var(--voyager-surface-page);
  color: var(--voyager-text-primary);
  font-family: var(--voyager-font-ui);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: 40px 24px 72px;
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 16px;
  color: var(--voyager-text-secondary);
  font-size: 12px;
  font-weight: 600;
}

.breadcrumb a { color: var(--voyager-color-vault); text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb-sep { color: color-mix(in srgb, var(--voyager-color-vault) 32%, transparent); }

.page-title {
  margin: 0 0 4px;
  color: var(--voyager-color-vault);
  font-size: 32px;
  font-weight: 800;
  line-height: 40px;
  letter-spacing: -0.5px;
}

.page-meta {
  margin: 0 0 32px;
  color: var(--voyager-text-secondary);
  font-family: var(--voyager-font-number);
  font-size: 12px;
  font-weight: 500;
}

.tabbar {
  display: flex;
  gap: 4px;
  padding: 4px;
  margin: 0 0 32px;
  border-radius: 4px;
  background: var(--voyager-surface-section);
  border: 1px solid var(--voyager-divider-section);
  width: fit-content;
}

.tab {
  appearance: none;
  border: 0;
  background: transparent;
  padding: 10px 20px;
  border-radius: 4px;
  color: var(--voyager-text-secondary);
  font-family: var(--voyager-font-ui);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 150ms cubic-bezier(0.3,0,0,1), color 150ms cubic-bezier(0.3,0,0,1);
}

.tab:hover {
  background: color-mix(in srgb, var(--voyager-color-vault) 6%, transparent);
  color: var(--voyager-color-vault);
}

.tab:focus-visible { outline: 2px solid var(--voyager-color-live); outline-offset: 2px; }

.tab[aria-selected="true"] {
  color: var(--voyager-text-on-dark);
  background: var(--voyager-color-vault);
  box-shadow: 0 4px 8px color-mix(in srgb, var(--voyager-color-vault) 24%, transparent);
}

.viewer {
  display: flex;
  justify-content: center;
}

/* ===== Canvas — composición de claude.html existentes ===== */

.canvas {
  position: relative;
  width: 790px;
  height: 685.5px;
  overflow: hidden;
  border-radius: 4px;
  background: var(--voyager-surface-card);
  box-shadow: 0 12px 32px color-mix(in srgb, var(--voyager-color-vault) 18%, transparent);
}

.canvas[hidden] { display: none; }

.zone {
  position: absolute;
  overflow: hidden;
}

.zone iframe {
  position: absolute;
  border: 0;
  background: transparent;
}

/* Layout 790×685.5 — columna izquierda 310.02 · columna derecha 440 · banner full */
.zone-profile      { top: 12px;  left: 12px;  width: 310.02px; height: 147.19px; }
.zone-wallet       { top: 171px; left: 12px;  width: 310.02px; height: 221.02px; }
.zone-activity     { top: 404px; left: 12px;  width: 310.02px; height: 145px;    }
.zone-recommended  { top: 12px;  left: 338px; width: 440px;    height: 247.71px; }
.zone-interests    { top: 272px; left: 338px; width: 440px;    height: 279.71px; }
.zone-banner       { top: 565px; left: 12px;  width: 766.01px; height: 100.33px; }

/* Iframe offset uniforme — descarta padding 56 24 + label 16 + gap 12 = top:-84 / left:-24 */
.zone-profile iframe      { left: -24px; top: -84px; width: 358px;    height: 280px;    }
.zone-wallet iframe       { left: -24px; top: -84px; width: 358px;    height: 360px;    }
.zone-activity iframe     { left: -24px; top: -84px; width: 358px;    height: 280px;    }
.zone-recommended iframe  { left: -24px; top: -84px; width: 488px;    height: 380px;    }
.zone-interests iframe    { left: -24px; top: -84px; width: 488px;    height: 410px;    }

/* ===== Banner SubasPass — hardcoded ===== */
.zone-banner {
  border-radius: 4px;
}

.zone-banner img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}
</style>
</head>
<body>
  <main class="page">
    <p class="breadcrumb">
      <a href="../index.html">Previews</a>
      <span class="breadcrumb-sep">›</span>
      <span>Zona</span>
    </p>
    <h1 class="page-title">Zona</h1>

    <div class="tabbar" role="tablist" aria-label="Variantes de la zona">

      <div class="canvas" id="canvas-1" role="tabpanel" aria-labelledby="tab-1">

        </div>
      </div>

    </div>
  </main>

<script>
function handleTabClick(event) {
  var clicked = event.currentTarget;
  var tabs = document.querySelectorAll('.tab');
  var canvases = document.querySelectorAll('.canvas');
  var targetId = clicked.getAttribute('data-target');
  var i = 0;
  for (i = 0; i < tabs.length; i++) {
    tabs[i].setAttribute('aria-selected', tabs[i] === clicked ? 'true' : 'false');
  }
  for (i = 0; i < canvases.length; i++) {
    if (canvases[i].id === targetId) {
      canvases[i].removeAttribute('hidden');
    } else {
      canvases[i].setAttribute('hidden', '');
    }
  }
}

(function bindTabs() {
  var tabs = document.querySelectorAll('.tab');
  var i = 0;
  for (i = 0; i < tabs.length; i++) {
    tabs[i].addEventListener('click', handleTabClick);
  }
})();
</script>
