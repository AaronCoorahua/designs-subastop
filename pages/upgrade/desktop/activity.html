<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tu Actividad · 310 × 145 — Voyager Upgrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --vmc-color-vault-300:   oklch(0.80 0.12 285);
  --vmc-color-vault-500:   oklch(0.45 0.20 285);
  --vmc-color-vault-700:   oklch(0.30 0.20 285);
  --vmc-color-vault-800:   oklch(0.22 0.18 285);

  --vmc-color-orange-500:  oklch(0.72 0.16 55);

  --vmc-color-base-white:  oklch(1 0 0);
  --vmc-color-skeleton:    oklch(0.85 0.008 220);

  --voyager-surface-card:    oklch(1 0 0);
  --voyager-text-on-surface: oklch(0.15 0.008 200);

  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-font-body:    "Roboto", system-ui, -apple-system, sans-serif;
  --voyager-font-mono:    "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 24px 16px;
  background: transparent;
  font-family: var(--voyager-font-display);
  color: var(--voyager-text-on-surface);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  overflow-x: hidden;
}

.catalog-row {
  display: flex; flex-wrap: wrap; justify-content: center;
  align-items: flex-start;
  gap: 40px 48px; padding: 16px 4px 32px;
}
.variant-slot {
  flex: 0 0 auto;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.variant-label {
  font-size: 10px; font-weight: 800;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: color-mix(in oklch, var(--vmc-color-vault-800) 55%, transparent);
  text-align: center;
}
.variant-sublabel {
  font-family: var(--voyager-font-mono);
  font-size: 10px; letter-spacing: 0.04em;
  color: color-mix(in oklch, var(--vmc-color-vault-800) 38%, transparent);
}

/* ═══════════════════════════════════════════════════════════════
   ACTIVITY · base layout
   ═══════════════════════════════════════════════════════════════ */
.act {
  width: 310px;
  position: relative;
  isolation: isolate;
  user-select: none;
}

.act .rounded       { height: 144.84px; }
.act .p-4           { padding: 16px; }
.act .px-3          { padding-left: 12px; padding-right: 12px; padding-top: 0; padding-bottom: 0; }
.act .py-2          { padding-top: 8px; padding-bottom: 8px; height: 32px; display: inline-flex !important; align-items: center; justify-content: center; border-radius: 4px; }
.act .py-2 h4       { margin: 0; line-height: 32px; }
.act .my-4          { margin-top: 12px; margin-bottom: 12px; }
.act .flex          { display: flex; }
.act .items-center  { align-items: center; }
.act .flex-1        { flex: 1 1 0%; }
.act .relative      { position: relative; }
.act .inline-block  { display: inline-block; }
.act .absolute      { position: absolute; }
.act .top-0         { top: 0; }
.act .left-0        { left: 0; }
.act .bottom-0      { bottom: 0; }
.act .right-0       { right: 0; }
.act .space-y-4 > * + * { margin-top: 10px; }
.act .space-y-3 > * + * { margin-top: 9px; }

.act .w-2           { width: 6.7px; }
.act .h-2           { height: 6.7px; }

.act .w-8\/12       { width: 66.666%; }
.act .w-6\/12       { width: 50%; }
.act .w-4\/12       { width: 33.333%; }
.act [class*="h-[8px]"] { height: 8px; }

.act .font-display  { font-family: var(--voyager-font-display); }
.act .text-base     { font-size: 15px; line-height: 18px; }
.act .font-bold     { font-weight: 700; }
.act .leading-none  { line-height: 32px; }
.act .uppercase     { text-transform: uppercase; }

.act svg            { display: inline-block; vertical-align: middle; }
.act .fill-current  { fill: currentColor; }

.act .rounded-lg    { border-radius: 8px; }

.act hr.border-t {
  border: none;
  border-top: 1px solid color-mix(in oklch, var(--vmc-color-vault-800) 5%, transparent);
}

.act .v-portal { display: none !important; }

/* ═══════════════════════════════════════════════════════════════
   V1 · CINEMATIC VAULT
   ═══════════════════════════════════════════════════════════════ */
.act--vault .rounded {
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  background: var(--voyager-surface-card);
  box-shadow:
    0 8px 20px oklch(0.22 0.18 285 / 10%),
    0 2px 6px  oklch(0.22 0.18 285 / 6%);
}
.act--vault .rounded::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 8px;
  background: linear-gradient(90deg,
    var(--vmc-color-vault-800) 0%,
    var(--vmc-color-vault-500) 100%);
  pointer-events: none;
}

.act--vault .bg-coral-100    { background: var(--voyager-surface-card); }
.act--vault .text-purple-400 { color: var(--vmc-color-vault-800); }
.act--vault [class*="D3D6DF"] { background-color: color-mix(in oklch, var(--vmc-color-vault-800) 15%, var(--vmc-color-skeleton)); }

/* ═══════════════════════════════════════════════════════════════
   V2 · IRIDESCENT
   ═══════════════════════════════════════════════════════════════ */
.act--iridescent .rounded {
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  background: var(--voyager-surface-card);
  box-shadow:
    0 8px 20px oklch(0 0 0 / 10%),
    0 2px 6px  oklch(0 0 0 / 6%);
}
.act--iridescent .rounded::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 8px;
  background: linear-gradient(90deg,
    var(--vmc-color-orange-500) 0%,
    var(--vmc-color-vault-500) 100%);
  box-shadow: 0 -1px 6px oklch(0.72 0.16 55 / 25%);
  pointer-events: none;
}

.act--iridescent .bg-coral-100    { background: var(--voyager-surface-card); }
.act--iridescent .text-purple-400 { color: var(--vmc-color-vault-800); }
.act--iridescent [class*="D3D6DF"] { background-color: var(--vmc-color-skeleton); }
</style>
</head>
<body>
  <div class="catalog-row">

    <!-- ═══ V1 · Cinematic Vault ═══ -->
    <div class="variant-slot" data-variant="cinematic-vault">

      </div>

    <!-- ═══ V2 · Iridescent ═══ -->
    <div class="variant-slot" data-variant="iridescent">

      </div>
    </div>

  </div>

  <script src="_iframe-resize.js"></script>
</body>
</html>
