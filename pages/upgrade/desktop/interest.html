<style>
:root {
  --vmc-color-vault-200: oklch(0.87 0.09 285);
  --vmc-color-vault-300: oklch(0.80 0.12 285);
  --vmc-color-vault-500: oklch(0.45 0.20 285);
  --vmc-color-vault-700: oklch(0.30 0.20 285);
  --vmc-color-vault-800: oklch(0.22 0.18 285);
  --vmc-color-base-white: oklch(1 0 0);
  --vmc-color-skeleton: oklch(0.85 0.008 220);
  --voyager-surface-card: oklch(1 0 0);
  --voyager-surface-section: oklch(0.96 0.004 160);
  --voyager-text-on-surface: oklch(0.15 0.008 200);
  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-font-body: "Roboto", system-ui, -apple-system, sans-serif;
  --voyager-font-mono: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
  --voyager-ease-default: cubic-bezier(0.3, 0, 0, 1);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 24px 16px;
  background: transparent;
  font-family: var(--voyager-font-display);
  color: var(--voyager-text-on-surface);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}
.catalog-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px 48px; padding: 16px 4px 32px; }
.variant-slot { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.variant-label { font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in oklch, var(--vmc-color-vault-800) 55%, transparent); text-align: center; }
.variant-sublabel { font-family: var(--voyager-font-mono); font-size: 10px; letter-spacing: 0.04em; color: color-mix(in oklch, var(--vmc-color-vault-800) 38%, transparent); }

/* ═══ OUTER CONTAINER ═══ */
.int-outer {
  width: 440px; height: 280px;
  border-radius: 16px;
  background: var(--voyager-surface-card);
  box-shadow: 0 8px 20px oklch(0.22 0.18 285 / 10%), 0 2px 6px oklch(0.22 0.18 285 / 6%);
  padding: 12px;
  overflow: hidden;
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 32px;
}

/* ═══ TITLE ═══ */
.int-title-wrap {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 8px 12px; height: 32px;
  border-radius: 4px;
  margin-bottom: 0;
}
.int-title-wrap h4 { margin: 0; font-size: 16px; font-weight: 600; line-height: 32px; text-transform: uppercase; color: #3B1782; }
.int-bracket { position: absolute; width: 6.7px; height: 6.7px; }
.int-bracket--tl { top: 0; left: 0; }
.int-bracket--br { bottom: 0; right: 0; }

/* ═══ CARDS GRID ═══ */
.int-grid { display: flex; gap: 12px; align-items: flex-end; align-self: stretch; justify-content: center; }

/* ═══ DISABLED CARD ═══ */
.int-card {
  width: 125px; height: 168px;
  border-radius: 8px;
  background: color-mix(in oklch, var(--vmc-color-vault-800) 4%, var(--voyager-surface-section));
  display: flex; flex-direction: column;
  position: relative;
  border-bottom: 8px solid color-mix(in oklch, var(--vmc-color-vault-800) 10%, var(--vmc-color-skeleton));
}

/* Image area — same bg as body area */
.int-card-img {
  height: 112px;
  flex-shrink: 0;
  position: relative;
  border-radius: 8px 8px 0 0;
}

/* Heart — sits at bottom of image, overflows into body */
.int-heart {
  position: absolute;
  bottom: -16px; right: 10px;
  z-index: 2;
}
.int-heart-circle {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: color-mix(in oklch, var(--vmc-color-vault-800) 10%, oklch(0.92 0.006 280));
  box-shadow: 0 3px 8px oklch(0.22 0.18 285 / 12%);
  display: flex; align-items: center; justify-content: center;
}

/* Body area — empty, same bg as card */
.int-card-body {
  flex: 1;
}
</style>
</head>
