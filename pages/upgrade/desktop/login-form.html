<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login Form — Voyager Upgrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
/* ─── Tokens base · compartido entre componentes desktop ────────── */
:root {
  --vmc-color-vault-200:   oklch(0.87 0.09 285);
  --vmc-color-vault-300:   oklch(0.80 0.12 285);
  --vmc-color-vault-400:   oklch(0.55 0.20 285);
  --vmc-color-vault-500:   oklch(0.45 0.20 285);
  --vmc-color-vault-600:   oklch(0.38 0.20 285);
  --vmc-color-vault-700:   oklch(0.30 0.20 285);
  --vmc-color-vault-800:   oklch(0.22 0.18 285);
  --vmc-color-vault-900:   oklch(0.15 0.27 278);

  --vmc-color-orange-400:  oklch(0.78 0.16 60);
  --vmc-color-orange-500:  oklch(0.72 0.16 55);
  --vmc-color-orange-600:  oklch(0.66 0.17 50);
  --vmc-color-orange-700:  oklch(0.58 0.18 45);

  --vmc-color-base-white:  oklch(1 0 0);
  --vmc-color-neutral-700: oklch(0.45 0.008 220);
  --vmc-color-background-disabled: oklch(0.91 0.004 160);

  --voyager-surface-page:    oklch(0.98 0.004 160);
  --voyager-surface-section: oklch(0.96 0.004 160);
  --voyager-surface-card:    oklch(1 0 0);
  --voyager-input-bg:        oklch(0.94 0.006 285);
  --voyager-text-on-dark:    oklch(1 0 0);
  --voyager-text-on-surface: oklch(0.15 0.008 200);

  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-font-body:    "Roboto", system-ui, -apple-system, sans-serif;

  --vmc-radius-sm:   4px;
  --vmc-radius-md:   8px;
  --vmc-radius-full: 9999px;

  --voyager-shadow-card: 0 8px 16px oklch(0.22 0.18 285 / 6%);

  --voyager-duration-micro:    150ms;
  --voyager-ease-default:      cubic-bezier(0.3, 0, 0, 1);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 24px 16px;
  background: transparent;
  font-family: var(--voyager-font-display);
  color: var(--voyager-text-on-surface);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  overflow-x: hidden;
}

/* ─── Scaffold catalog · compartido ─────────────────────────────── */
.catalog-row {
  display: flex; flex-wrap: wrap; justify-content: center;
  align-items: flex-start;
  gap: 40px 32px; padding: 16px 4px 32px;
}
.variant-slot {
  flex: 0 0 auto;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.variant-label {
  font-size: 10px; font-weight: 800;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: color-mix(in oklch, var(--vmc-color-vault-800) 55%, transparent);
  text-align: center;
}
.variant-sublabel {
  font-family: var(--voyager-font-body);
  font-size: 10px; letter-spacing: 0.04em;
  color: color-mix(in oklch, var(--vmc-color-vault-800) 38%, transparent);
}

/* ═══════════════════════════════════════════════════════════════
   LOGIN FORM · Cinematic Vault
   ═══════════════════════════════════════════════════════════════ */
.lfm {
  width: 360px;
  background: var(--voyager-surface-card);
  border-radius: var(--vmc-radius-md);
  box-shadow: var(--voyager-shadow-card);
  padding: 40px 32px 32px;
  display: flex; flex-direction: column;
  gap: 0;
}

/* ── Welcome heading — bigger, cinematic ──────────────────────── */
.lfm-welcome {
  margin: 0 0 40px;
  text-align: center;
  display: flex; flex-direction: column;
  align-items: center; gap: 6px;
}
.lfm-welcome-h1 {
  margin: 0;
  font-family: var(--voyager-font-display);
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -1px;
  line-height: 1.05;
  background: linear-gradient(135deg, var(--vmc-color-vault-800) 0%, var(--vmc-color-vault-500) 100%);
  background-clip: text;
  color: transparent;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.lfm-welcome-sub {
  margin: 0;
  font-family: var(--voyager-font-display);
  font-size: 16px;
  font-weight: 500;
  color: color-mix(in oklch, var(--vmc-color-vault-800) 70%, transparent);
  letter-spacing: -0.1px;
}

/* ── Form fields ───────────────────────────────────────────────── */
.lfm-form { display: flex; flex-direction: column; gap: 18px; }
.lfm-field { display: flex; flex-direction: column; gap: 6px; }
.lfm-label {
  font-family: var(--voyager-font-display);
  font-size: 13px; font-weight: 400;
  letter-spacing: 0; text-transform: none;
  color: var(--vmc-color-vault-500);
}
[data-variant="v2-primary"] .lfm-label {
  color: var(--voyager-text-on-surface);
}
.lfm-input-wrap { position: relative; }
.lfm-input {
  display: block; width: 100%;
  height: 44px;
  padding: 0 14px;
  border: 1px solid color-mix(in oklch, var(--vmc-color-vault-800) 14%, transparent);
  border-radius: var(--vmc-radius-sm);
  background: var(--voyager-input-bg);
  font-family: var(--voyager-font-body);
  font-size: 14px; font-weight: 400;
  color: var(--voyager-text-on-surface);
  outline: none;
  transition: border-color 150ms var(--voyager-ease-default),
              box-shadow 150ms var(--voyager-ease-default);
}
.lfm-input:focus {
  border-color: var(--vmc-color-vault-500);
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--vmc-color-vault-500) 20%, transparent);
}
.lfm-input--pwd { padding-right: 40px; }
.lfm-eye {
  position: absolute;
  right: 10px; top: 50%;
  transform: translateY(-50%);
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  color: color-mix(in oklch, var(--vmc-color-vault-800) 40%, transparent);
  cursor: pointer;
  background: transparent;
  border: 0; padding: 0;
}
.lfm-eye svg { width: 20px; height: 20px; fill: currentColor; }
.lfm-forgot {
  margin-top: 4px;
  text-align: center;
}
.lfm-forgot a {
  font-family: var(--voyager-font-display);
  font-size: 12px; font-weight: 700;
  color: var(--vmc-color-vault-500);
  text-decoration: none;
}
.lfm-forgot a:hover { color: var(--vmc-color-vault-700); }

/* ── Cinematic Vault Button (psec from referencia.tsx) ───────── */
@property --lfm-angle {
  syntax: '<angle>';
  inherits: false;
  initial-value: 160deg;
}
@property --lfm-stop-a {
  syntax: '<color>';
  inherits: false;
  initial-value: oklch(0.45 0.20 285);
}
@property --lfm-stop-b {
  syntax: '<color>';
  inherits: false;
  initial-value: oklch(0.30 0.20 285);
}

.lfm-submit {
  margin-top: 22px;
  --lfm-stop-a: var(--vmc-color-vault-500);
  --lfm-stop-b: var(--vmc-color-vault-700);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 48px;
  padding: 0 24px;
  border-radius: var(--vmc-radius-full);
  border: 2.5px solid transparent;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  font-family: var(--voyager-font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--vmc-color-base-white);
  text-shadow: 0 1px 3px rgb(0% 0% 0% / 0.30);
  background-image:
    linear-gradient(var(--lfm-angle), var(--lfm-stop-a) 0%, var(--lfm-stop-b) 100%),
    linear-gradient(135deg,
      var(--vmc-color-vault-300) 0%,
      var(--vmc-color-base-white) 35%,
      var(--vmc-color-vault-400) 65%,
      var(--vmc-color-vault-300) 100%
    );
  background-origin: padding-box, border-box;
  background-clip: padding-box, border-box;
  box-shadow:
    inset 0 1px 0 rgb(100% 100% 100% / 0.22),
    0 2px 8px rgb(51.76% 37.65% 89.8% / 0.30);
  transition:
    --lfm-angle  0.4s  cubic-bezier(0.25, 0.8, 0.25, 1),
    --lfm-stop-a 0.35s ease,
    --lfm-stop-b 0.35s ease,
    transform    0.2s  cubic-bezier(0.25, 0.8, 0.25, 1),
    box-shadow   0.25s ease;
  transform: translateZ(0);
}
.lfm-submit::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--vmc-radius-full);
  background: linear-gradient(180deg, rgb(100% 100% 100% / 0.16) 0%, transparent 55%);
  pointer-events: none;
  z-index: 1;
}
.lfm-submit::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: var(--vmc-radius-full);
  background: linear-gradient(135deg, var(--vmc-color-vault-400), var(--vmc-color-vault-600));
  filter: blur(14px);
  opacity: 0;
  z-index: -1;
  transition: opacity 0.3s ease, filter 0.3s ease;
}
.lfm-submit:hover {
  --lfm-angle:  220deg;
  --lfm-stop-a: var(--vmc-color-vault-400);
  --lfm-stop-b: var(--vmc-color-vault-600);
  transform: translateY(-2px) scale(1.02);
  box-shadow:
    inset 0 1px 0 rgb(100% 100% 100% / 0.20),
    0 8px 24px rgb(51.76% 37.65% 89.8% / 0.40),
    0 4px 10px rgb(51.76% 37.65% 89.8% / 0.25);
}
.lfm-submit:hover::after { opacity: 0.45; filter: blur(18px); }
.lfm-submit:active {
  --lfm-angle:  160deg;
  --lfm-stop-a: var(--vmc-color-vault-700);
  --lfm-stop-b: var(--vmc-color-vault-900);
  transform: scale(0.97) translateY(1px);
  box-shadow:
    inset 0 2px 5px rgb(0% 0% 0% / 0.28),
    0 1px 3px rgb(0% 0% 0% / 0.14);
}
.lfm-submit:active::after { opacity: 0; }
.lfm-submit:focus-visible {
  outline: none;
  box-shadow:
    0 0 0 2px var(--vmc-color-base-white),
    0 0 0 5px var(--vmc-color-vault-400),
    0 8px 16px -4px rgb(51.76% 37.65% 89.8% / 0.35);
}

/* ── V2 · Primary Button (pvbtn from referencia.tsx) ─────────── */
@property --lfm2-angle {
  syntax: '<angle>';
  inherits: false;
  initial-value: 135deg;
}
@property --lfm2-stop-a {
  syntax: '<color>';
  inherits: false;
  initial-value: oklch(0.72 0.16 55);
}
@property --lfm2-stop-b {
  syntax: '<color>';
  inherits: false;
  initial-value: oklch(0.55 0.22 285);
}

.lfm-submit--primary {
  margin-top: 22px;
  --lfm2-stop-a: var(--vmc-color-orange-600);
  --lfm2-stop-b: var(--vmc-color-vault-500);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 48px;
  padding: 0 24px;
  border-radius: var(--vmc-radius-full);
  border: 2.5px solid transparent;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  font-family: var(--voyager-font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--vmc-color-base-white);
  text-shadow: 0 1px 3px rgb(0% 0% 0% / 0.25);
  background-image:
    linear-gradient(var(--lfm2-angle), var(--lfm2-stop-a) 0%, var(--lfm2-stop-a) 40%, var(--lfm2-stop-b) 100%),
    linear-gradient(135deg,
      var(--vmc-color-base-white) 0%,
      var(--vmc-color-orange-400) 25%,
      var(--vmc-color-vault-400) 75%,
      var(--vmc-color-base-white) 100%
    );
  background-origin: padding-box, border-box;
  background-clip: padding-box, border-box;
  box-shadow:
    inset 0 1px 0 rgb(100% 100% 100% / 0.28),
    0 2px 6px rgb(92.94% 53.73% 21.18% / 0.30);
  transition:
    --lfm2-angle  0.4s  cubic-bezier(0.25, 0.8, 0.25, 1),
    --lfm2-stop-a 0.35s ease,
    --lfm2-stop-b 0.35s ease,
    transform     0.2s  cubic-bezier(0.25, 0.8, 0.25, 1),
    box-shadow    0.25s ease;
  transform: translateZ(0);
}
.lfm-submit--primary::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--vmc-radius-full);
  background: linear-gradient(180deg, rgb(100% 100% 100% / 0.17) 0%, transparent 55%);
  pointer-events: none;
  z-index: 1;
}
.lfm-submit--primary::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: var(--vmc-radius-full);
  background: linear-gradient(135deg, var(--vmc-color-orange-600), var(--vmc-color-vault-500));
  filter: blur(14px);
  opacity: 0;
  z-index: -1;
  transition: opacity 0.3s ease, filter 0.3s ease;
}
.lfm-submit--primary:hover {
  --lfm2-angle:  220deg;
  --lfm2-stop-a: var(--vmc-color-orange-400);
  --lfm2-stop-b: var(--vmc-color-vault-400);
  transform: translateY(-2px) scale(1.02);
  box-shadow:
    inset 0 1px 0 rgb(100% 100% 100% / 0.22),
    0 8px 24px rgb(51.76% 37.65% 89.8% / 0.35),
    0 4px 10px rgb(92.94% 53.73% 21.18% / 0.40);
}
.lfm-submit--primary:hover::after { opacity: 0.45; filter: blur(18px); }
.lfm-submit--primary:active {
  --lfm2-angle:  135deg;
  --lfm2-stop-a: var(--vmc-color-orange-700);
  --lfm2-stop-b: var(--vmc-color-vault-600);
  transform: scale(0.97) translateY(1px);
  box-shadow:
    inset 0 2px 5px rgb(0% 0% 0% / 0.22),
    0 1px 3px rgb(0% 0% 0% / 0.12);
}
.lfm-submit--primary:active::after { opacity: 0; }
.lfm-submit--primary:focus-visible {
  outline: none;
  transform: scale(0.98);
  box-shadow:
    0 0 0 2px var(--vmc-color-base-white),
    0 0 0 5px var(--vmc-color-vault-500),
    0 8px 16px -4px rgb(51.76% 37.65% 89.8% / 0.30);
}

/* ── Divider ───────────────────────────────────────────────────── */
.lfm-divider {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  margin: 22px 0 16px;
}
.lfm-divider::before {
  content: '';
  position: absolute; inset: 50% 0 auto 0;
  height: 1px;
  background: color-mix(in oklch, var(--vmc-color-vault-800) 12%, transparent);
}
.lfm-divider span {
  position: relative;
  padding: 0 14px;
  background: var(--voyager-surface-card);
  font-family: var(--voyager-font-display);
  font-size: 12px; font-weight: 700;
  color: color-mix(in oklch, var(--vmc-color-vault-800) 45%, transparent);
}

/* ── Register link (ghost) ─────────────────────────────────────── */
.lfm-register {
  display: inline-flex;
  align-items: center; justify-content: center;
  width: 100%;
  height: 44px;
  padding: 0 24px;
  border-radius: var(--vmc-radius-full);
  border: 1.5px solid color-mix(in oklch, var(--vmc-color-vault-800) 35%, transparent);
  background: transparent;
  color: var(--vmc-color-vault-700);
  font-family: var(--voyager-font-display);
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  text-decoration: none;
  transition: background 150ms var(--voyager-ease-default),
              border-color 150ms var(--voyager-ease-default),
              color 150ms var(--voyager-ease-default);
}
.lfm-register:hover {
  background: color-mix(in oklch, var(--vmc-color-vault-500) 6%, transparent);
  border-color: var(--vmc-color-vault-500);
  color: var(--vmc-color-vault-800);
}

/* ── V2 · Ghost Register (pghost · live/orange sobre card claro) */
.lfm-register--ghost {
  height: 48px;
  padding: 0 28px;
  border-radius: var(--vmc-radius-full);
  border: 2px solid color-mix(in oklch, var(--vmc-color-orange-600) 75%, transparent);
  position: relative;
  overflow: hidden;
  background: transparent;
  color: var(--vmc-color-orange-600);
  font-family: var(--voyager-font-display);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0;
  text-transform: none;
  text-shadow: none;
  box-shadow:
    inset 0 1px 0 rgb(100% 100% 100% / 0.50),
    0 0 0 1px color-mix(in oklch, var(--vmc-color-orange-600) 10%, transparent);
  transition:
    background    0.25s ease,
    border-color  0.25s ease,
    color         0.25s ease,
    transform     0.2s  cubic-bezier(0.25, 0.8, 0.25, 1),
    box-shadow    0.25s ease;
  transform: translateZ(0);
}
.lfm-register--ghost::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--vmc-radius-full);
  background: linear-gradient(180deg, rgb(100% 100% 100% / 0.30) 0%, transparent 55%);
  pointer-events: none;
  z-index: 1;
}
.lfm-register--ghost::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: var(--vmc-radius-full);
  background: color-mix(in oklch, var(--vmc-color-orange-500) 55%, transparent);
  filter: blur(14px);
  opacity: 0;
  z-index: -1;
  transition: opacity 0.3s ease, filter 0.3s ease;
}
.lfm-register--ghost:hover {
  background: linear-gradient(135deg, var(--vmc-color-orange-500) 0%, var(--vmc-color-orange-700) 100%);
  border-color: var(--vmc-color-orange-700);
  color: var(--vmc-color-base-white);
  text-shadow: 0 1px 3px rgb(0% 0% 0% / 0.25);
  transform: translateY(-2px) scale(1.02);
  box-shadow:
    inset 0 1px 0 rgb(100% 100% 100% / 0.22),
    0 6px 20px rgb(92.94% 53.73% 21.18% / 0.30);
}
.lfm-register--ghost:hover::after { opacity: 0.40; filter: blur(18px); }
.lfm-register--ghost:active {
  background: linear-gradient(135deg, var(--vmc-color-orange-700) 0%, oklch(0.52 0.18 45) 100%);
  border-color: var(--vmc-color-orange-700);
  color: var(--vmc-color-base-white);
  text-shadow: 0 1px 3px rgb(0% 0% 0% / 0.25);
  transform: scale(0.97) translateY(1px);
  box-shadow: inset 0 2px 5px rgb(0% 0% 0% / 0.22);
}
.lfm-register--ghost:active::after { opacity: 0; }
.lfm-register--ghost:focus-visible {
  outline: none;
  box-shadow:
    0 0 0 2px var(--vmc-color-orange-600),
    0 0 0 4px color-mix(in oklch, var(--vmc-color-orange-500) 35%, transparent);
}
</style>
</head>
<body>
  <main class="catalog-row" aria-label="Login Form — Voyager upgrade">

    <!-- ── V1 · Cinematic Vault ─────────────────────────────────── -->
    <section class="variant-slot" data-variant="v1-cinematic">
      <p class="variant-label">V1 · Cinematic Vault</p>
      <p class="variant-sublabel">welcome XL · psec button</p>

      <div class="lfm">
        <header class="lfm-welcome">
          <h1 class="lfm-welcome-h1">¡Bienvenido!</h1>
          <p class="lfm-welcome-sub">Cazador de ofertas</p>
        </header>

        <form class="lfm-form" novalidate>
          <div class="lfm-field">
            <label class="lfm-label" for="lfm-email-v1">Correo electrónico</label>
            <div class="lfm-input-wrap">
              <input class="lfm-input" id="lfm-email-v1" type="email" name="email" autocomplete="email" />
            </div>
          </div>

          <div class="lfm-field">
            <label class="lfm-label" for="lfm-password-v1">Contraseña</label>
            <div class="lfm-input-wrap">
              <input class="lfm-input lfm-input--pwd" id="lfm-password-v1" type="password" name="password" autocomplete="current-password" />
              <button type="button" class="lfm-eye" data-target="lfm-password-v1" aria-label="Mostrar contraseña">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12.1 5.1C7.5 5.1 3.7 8 2.1 12 3.7 16 7.5 18.9 12.1 18.9 16.6 18.9 20.4 16 22 12 20.4 8 16.6 5.1 12.1 5.1ZM12.1 16.6C9.6 16.6 7.5 14.5 7.5 12 7.5 9.5 9.6 7.4 12.1 7.4 14.6 7.4 16.6 9.5 16.6 12 16.6 14.5 14.6 16.6 12.1 16.6ZM12.1 9.2C10.6 9.2 9.3 10.5 9.3 12 9.3 13.5 10.6 14.8 12.1 14.8 13.6 14.8 14.8 13.5 14.8 12 14.8 10.5 13.6 9.2 12.1 9.2Z"/></svg>
              </button>
            </div>
          </div>

          <div class="lfm-forgot">
            <a href="#">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="lfm-submit">Ingresa</button>
        </form>

        <div class="lfm-divider"><span>ó</span></div>

        <a href="#" class="lfm-register">Regístrate</a>
      </div>

  <script>
    (function initEyeToggles() {
      var eyes = document.querySelectorAll('.lfm-eye');
      function bindEye(eye) {
        var input = document.getElementById(eye.getAttribute('data-target'));
        if (!input) return;
        function handleToggle() {
          var isPwd = input.type === 'password';
          input.type = isPwd ? 'text' : 'password';
          eye.setAttribute('aria-label', isPwd ? 'Ocultar contraseña' : 'Mostrar contraseña');
        }
        eye.addEventListener('click', handleToggle);
      }
      eyes.forEach(bindEye);
    })();
  </script>
