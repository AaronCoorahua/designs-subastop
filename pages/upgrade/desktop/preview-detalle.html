<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Preview Detalle — Voyager Upgrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --vmc-color-vault-500: oklch(0.45 0.20 285);
  --vmc-color-vault-800: oklch(0.22 0.18 285);
  --vmc-color-orange-500: oklch(0.72 0.16 55);
  --voyager-surface-page: oklch(0.98 0.004 160);
  --voyager-surface-card: oklch(1 0 0);
  --voyager-text-on-surface: oklch(0.15 0.008 200);
  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-font-mono: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  /* Fondo gris simulando la página VMC real */
  background: oklch(0.94 0.005 250);
  font-family: var(--voyager-font-display);
  color: var(--voyager-text-on-surface);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}

/* ── Page chrome — header (790px) manda el ancho ────────────────── */
.pd-page {
  max-width: 854px;            /* 790 contenido + 32 lateral × 2 */
  margin: 0 auto;
  padding: 40px 32px 80px;
}
.pd-eyebrow {
  margin: 0 0 6px;
  color: var(--vmc-color-orange-500);
  font-size: 11px; font-weight: 800;
  letter-spacing: 0.12em; text-transform: uppercase;
}
.pd-title {
  margin: 0 0 8px;
  background: linear-gradient(135deg, var(--vmc-color-vault-800), var(--vmc-color-vault-500));
  background-clip: text;
  color: transparent;
  font-size: 30px; font-weight: 800;
  letter-spacing: -0.6px; line-height: 1.1;
}
.pd-subtitle {
  margin: 0 0 28px;
  max-width: 640px;
  color: color-mix(in oklch, var(--voyager-text-on-surface) 60%, transparent);
  font-size: 13px; line-height: 1.55;
}

/* ── Iframe scaffold ────────────────────────────────────────────── */
.pd-frame {
  border: 0;
  display: block;
  background: transparent;
  width: 100%;
  margin: 0;
}

/* ── Header — 790px master ──────────────────────────────────────── */
.pd-header {
  width: 790px;
  max-width: 100%;
  margin: 0 0 16px;
}
.pd-header .pd-frame { min-height: 64px; }

/* ── Body — 2 columnas con gap central (separación visible) ─────── */
.pd-body {
  display: flex;
  flex-wrap: wrap;
  width: 790px;
  max-width: 100%;
  gap: 30px;                   /* 30 entre columnas — 443 + 30 + 317 = 790 */
  margin-bottom: 64px;
}
.pd-col {
  display: flex;
  flex-direction: column;
  gap: 0;                      /* componentes pegados verticalmente */
}
.pd-col-left  { width: 443px; max-width: 100%; }
.pd-col-right { width: 317px; max-width: 100%; }

.pd-col .pd-frame { min-height: 120px; }
.pd-col .pd-frame + .pd-frame { margin-top: -35px; }  /* compresión vertical entre componentes */
.pd-header { margin-bottom: 0; }
.pd-header .pd-frame { margin-bottom: -35px; }         /* header casi pegado al primer iframe del body */

/* Columna derecha sin título visible → conditions pegado a detail-card */
.pd-col-right .pd-cond-title + .pd-frame { margin-top: -35px; }
.pd-col-right .pd-frame + .pd-cond-title { margin-top: -35px; }

/* Columna derecha CON título visible → título visible entre detail-card y conditions */
.pd-col-right.has-cond-title .pd-frame + .pd-cond-title { margin-top: -28px; }
.pd-col-right.has-cond-title .pd-cond-title + .pd-frame { margin-top: 4px; }

/* ── Tabs de variantes (Conditions) — bajo el subtítulo ─────────── */
.pd-tabs-wrap {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 28px;
  padding: 6px 10px 6px 14px;
  border-radius: 9999px;
  background: var(--voyager-surface-card);
  box-shadow: 0 2px 8px color-mix(in oklch, var(--vmc-color-vault-800) 8%, transparent);
}
.pd-tabs-label {
  font-family: inherit;
  font-size: 10px; font-weight: 800;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: color-mix(in oklch, var(--vmc-color-vault-800) 45%, transparent);
  white-space: nowrap;
}
.pd-tabs {
  display: inline-flex;
  gap: 2px;
}
.pd-tab {
  min-width: 36px;
  padding: 6px 10px;
  border: 0;
  border-radius: 9999px;
  background: transparent;
  color: color-mix(in oklch, var(--vmc-color-vault-800) 55%, transparent);
  cursor: pointer;
  font-family: inherit;
  font-size: 10px; font-weight: 800;
  letter-spacing: 0.06em; text-transform: uppercase;
  text-align: center;
  white-space: nowrap;
  transition: background 150ms ease, color 150ms ease;
}
.pd-tab:hover:not(.is-active) {
  background: color-mix(in oklch, var(--vmc-color-vault-800) 5%, transparent);
  color: var(--vmc-color-vault-800);
}
.pd-tab.is-active {
  background: linear-gradient(135deg, var(--vmc-color-vault-800), var(--vmc-color-vault-500));
  color: oklch(1 0 0);
  border-radius: 9999px;
  box-shadow:
    inset 0 1px 0 oklch(1 0 0 / 18%),
    0 2px 6px oklch(0.45 0.20 285 / 22%);
}

/* ── Toggle "title" — al costado de los tabs ────────────────────── */
.pd-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding-left: 10px;
  margin-left: 4px;
  border-left: 1px solid color-mix(in oklch, var(--vmc-color-vault-800) 12%, transparent);
  cursor: pointer;
  user-select: none;
}
.pd-toggle input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  margin: 0;
  border-radius: 3px;
  border: 1.5px solid color-mix(in oklch, var(--vmc-color-vault-800) 35%, transparent);
  background: oklch(1 0 0);
  cursor: pointer;
  transition: background 150ms ease, border-color 150ms ease;
  position: relative;
}
.pd-toggle input[type="checkbox"]:checked {
  background: linear-gradient(135deg, var(--vmc-color-vault-800), var(--vmc-color-vault-500));
  border-color: var(--vmc-color-vault-500);
}
.pd-toggle input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  inset: 0;
  display: block;
  background-image: linear-gradient(45deg, transparent 38%, oklch(1 0 0) 38% 56%, transparent 56%),
                    linear-gradient(-45deg, transparent 38%, oklch(1 0 0) 38% 56%, transparent 56%);
  background-size: 70% 2px, 70% 2px;
  background-position: 2px 8px, 5px 8px;
  background-repeat: no-repeat;
}
.pd-toggle-label {
  font-family: inherit;
  font-size: 10px; font-weight: 800;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: color-mix(in oklch, var(--vmc-color-vault-800) 60%, transparent);
}

/* ── Heading "Condiciones" con L-mark (estilo listing-area V2) ──── */
.pd-cond-title {
  display: none;                         /* visible solo cuando checkbox activo */
  align-items: center;
  gap: 10px;
  padding: 8px 12px 8px 4px;
  margin-bottom: 4px;
}
.pd-cond-title.is-visible { display: inline-flex; }
.pd-cond-mark {
  flex-shrink: 0;
  width: 10px;
  height: 10px;
  border-top: 2px solid var(--vmc-color-orange-500);
  border-left: 2px solid var(--vmc-color-orange-500);
}
.pd-cond-text {
  font-family: var(--voyager-font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--vmc-color-vault-800);
  line-height: 20px;
  margin: 0;
}

</style>
</head>
<body>
  <main class="pd-page">
    <p class="pd-eyebrow">Voyager · UI Upgrade · Composición</p>
    <h1 class="pd-title">Preview Detalle</h1>
    <p class="pd-subtitle">Mockup de página de detalle compuesta con variantes específicas de cada componente. No registrado en el catálogo.</p>

    <div class="pd-tabs-wrap" aria-label="Selector de variantes de Conditions">
      <span class="pd-tabs-label">Conditions</span>
      <div class="pd-tabs" role="tablist">
        <button class="pd-tab is-active" type="button" role="tab" data-variant-index="0">V1</button>
        <button class="pd-tab" type="button" role="tab" data-variant-index="1">V2</button>
        <button class="pd-tab" type="button" role="tab" data-variant-index="2">V3</button>
        <button class="pd-tab" type="button" role="tab" data-variant-index="3">V4</button>
        <button class="pd-tab" type="button" role="tab" data-variant-index="4">V5</button>
      </div>
      <label class="pd-toggle" for="pd-cond-title-toggle">
        <input type="checkbox" id="pd-cond-title-toggle" />
        <span class="pd-toggle-label">Title</span>
      </label>
    </div>

    <!-- ═══════════ Header V2 (top) ═══════════ -->
    <section class="pd-header" aria-label="Header V2">
      <iframe
        class="pd-frame"
        data-component="header"
        src="header.html?variantIndex=1&embed=1"
        loading="lazy"
        title="Header · V2 D Primary Clone"></iframe>
    </section>

    <!-- ═══════════ Body 2 columnas ═══════════ -->
    <div class="pd-body">

      <!-- LEFT: Detail Header Images V1 + General Info + Conditions Offering -->
      <div class="pd-col pd-col-left">
        <iframe
          class="pd-frame"
          data-component="detail-header-images"
          src="detail-header-images.html?variantIndex=0&embed=1"
          loading="lazy"
          title="Detail Header Images · V1 Default"></iframe>
        <iframe
          class="pd-frame"
          data-component="general-info"
          src="general-info.html?variantIndex=0&embed=1"
          loading="lazy"
          title="General Info · V1 Iridescent"></iframe>
        <iframe
          class="pd-frame"
          data-component="conditions-offering"
          src="conditions-offering.html?variantIndex=0&embed=1"
          loading="lazy"
          title="Conditions Offering · V1 Iridescent"></iframe>
      </div>

      <!-- RIGHT: Detail Card V4 + Conditions (variante controlada por tabs del header) -->
      <div class="pd-col pd-col-right" id="pd-col-right">
        <iframe
          class="pd-frame"
          data-component="detail-card"
          src="detail-card.html?variantIndex=3&embed=1"
          loading="lazy"
          title="Detail Card · V4 Vault Sunset"></iframe>
        <div class="pd-cond-title" id="pd-cond-title" aria-hidden="true">
          <span class="pd-cond-mark" aria-hidden="true"></span>
          <p class="pd-cond-text">Detalles</p>
        </div>
        <iframe
          class="pd-frame"
          data-component="conditions"
          id="pd-conditions-frame"
          src="conditions.html?variantIndex=0&embed=1"
          loading="lazy"
          title="Conditions · variante seleccionada (V1 Check + Dash por defecto)"></iframe>
      </div>

    </div>

  </main>

  <script>
    /* Auto-resize de iframes vía postMessage — escucha ambos formatos:
       - voyager-iframe-height (de _iframe-resize.js)
       - subastop:variant-height (de variant-filter.js) */
    (function initPreviewDetalleResize() {
      var frames = document.querySelectorAll('iframe.pd-frame');

      function applyHeight(source, height) {
        if (!height || height < 1) { return; }
        for (var i = 0; i < frames.length; i++) {
          if (frames[i].contentWindow === source) {
            var target = (height + 4) + 'px';
            if (frames[i].style.height !== target) {
              frames[i].style.height = target;
            }
            return;
          }
        }
      }

      window.addEventListener('message', function onMsg(e) {
        if (!e.data) { return; }
        if (e.data.type === 'voyager-iframe-height') {
          applyHeight(e.source, Number(e.data.height));
        } else if (e.data.type === 'subastop:variant-height') {
          applyHeight(e.source, Number(e.data.height));
        }
      });
    })();

    /* Tabs · cambian dinámicamente el variantIndex del iframe de Conditions */
    (function initConditionsTabs() {
      var tabs  = document.querySelectorAll('.pd-tab');
      var frame = document.getElementById('pd-conditions-frame');
      if (!frame) { return; }

      function activate(index) {
        tabs.forEach(function syncTab(tab) {
          var active = tab.dataset.variantIndex === String(index);
          tab.classList.toggle('is-active', active);
          tab.setAttribute('aria-selected', active ? 'true' : 'false');
        });
        frame.src = 'conditions.html?variantIndex=' + index + '&embed=1';
      }

      tabs.forEach(function bindTab(tab) {
        tab.addEventListener('click', function onClickTab() {
          activate(Number(tab.dataset.variantIndex));
        });
      });
    })();

    /* Checkbox "Title" · muestra/oculta el heading "Condiciones" sobre el iframe */
    (function initConditionsTitleToggle() {
      var toggle = document.getElementById('pd-cond-title-toggle');
      var title  = document.getElementById('pd-cond-title');
      var col    = document.getElementById('pd-col-right');
      if (!toggle || !title || !col) { return; }
      toggle.addEventListener('change', function onChange() {
        title.classList.toggle('is-visible', toggle.checked);
        col.classList.toggle('has-cond-title', toggle.checked);
        title.setAttribute('aria-hidden', toggle.checked ? 'false' : 'true');
      });
    })();
  </script>
</body>
</html>
