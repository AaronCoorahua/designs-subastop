<html lang="es">
<head>
<meta charset="utf-8" />

<title>Recomendados · 440 × 248 — Voyager Upgrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --vmc-color-vault-200: oklch(0.87 0.09 285);
  --vmc-color-vault-300: oklch(0.80 0.12 285);
  --vmc-color-vault-500: oklch(0.45 0.20 285);
  --vmc-color-vault-700: oklch(0.30 0.20 285);
  --vmc-color-vault-800: oklch(0.22 0.18 285);
  --vmc-color-orange-500: oklch(0.72 0.16 55);
  --vmc-color-base-white: oklch(1 0 0);
  --voyager-surface-card: oklch(1 0 0);
  --voyager-surface-section: oklch(0.96 0.004 160);
  --voyager-text-on-surface: oklch(0.15 0.008 200);
  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-font-body: "Roboto", system-ui, -apple-system, sans-serif;
  --voyager-font-mono: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
  --voyager-ease-default: cubic-bezier(0.3, 0, 0, 1);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 24px 16px;
  background: transparent;
  font-family: var(--voyager-font-display);
  color: var(--voyager-text-on-surface);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
}
.catalog-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px 48px; padding: 16px 4px 32px; }
.variant-slot { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.variant-label { font-size: 10px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: color-mix(in oklch, var(--vmc-color-vault-800) 55%, transparent); text-align: center; }
.variant-sublabel { font-family: var(--voyager-font-mono); font-size: 10px; letter-spacing: 0.04em; color: color-mix(in oklch, var(--vmc-color-vault-800) 38%, transparent); }

/* ═══ OUTER CONTAINER ═══ */
.rec-outer {
  width: 440px; height: 248px;
  border-radius: 16px;
  background: var(--voyager-surface-card);
  box-shadow: 0 8px 20px oklch(0.22 0.18 285 / 10%), 0 2px 6px oklch(0.22 0.18 285 / 6%);
  padding: 12px;
  overflow: hidden;
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 16px;
}

/* ═══ TITLE ═══ */
.rec-title-wrap {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 8px 12px; height: 32px;
  border-radius: 4px;
  margin-bottom: 0;
}
.rec-title-wrap h4 { margin: 0; font-size: 16px; font-weight: 600; line-height: 32px; text-transform: uppercase; color: #3B1782; }
.rec-bracket { position: absolute; width: 6.7px; height: 6.7px; }
.rec-bracket--tl { top: 0; left: 0; }
.rec-bracket--br { bottom: 0; right: 0; }

/* ═══ CARDS GRID ═══ */
.rec-grid { display: flex; gap: 12px; align-items: flex-end; align-self: stretch; justify-content: center; }

/* ═══ INNER CARD ═══ */
.rec-card {
  width: 134px; height: 168px;
  border-radius: 8px;
  background: var(--voyager-surface-card);
  overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 2px 8px oklch(0.22 0.18 285 / 10%), 0 1px 3px oklch(0.22 0.18 285 / 6%);
  position: relative;
}
.rec-card::after {
  content: ""; position: absolute;
  left: 0; right: 0; bottom: 0; height: 8px;
  border-radius: 0 0 8px 8px;
  background: linear-gradient(90deg, #FF9C3B 0%, #EF852E 50%, #BE3D00 100%);
  pointer-events: none; z-index: 3;
}
.rec-card--negotiable::after {
  background: linear-gradient(90deg, #009597 0%, #00D2D3 50%, #00EDEE 100%);
}

/* ═══ IMAGE AREA ═══ */
.rec-img { position: relative; height: 112px; overflow: hidden; flex-shrink: 0; background: var(--voyager-surface-section); }
.rec-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* ═══ PILLS ═══ */
.pill-live {
  position: absolute; top: 6px; left: 6px; z-index: 2;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px 2px 6px;
  border-radius: 9999px;
  background: linear-gradient(135deg, #FF9C3B 0%, #EF852E 50%, #BE3D00 100%);
  box-shadow: 0 2px 6px oklch(0.72 0.16 55 / 30%);
}
.pill-live-dot { width: 5px; height: 5px; border-radius: 50%; background: #FF3B3B; animation: dotpulse 1.4s ease-in-out infinite; }
@keyframes dotpulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.pill-live span { font-size: 8px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: white; line-height: 1; }

.pill-proxima {
  position: absolute; top: 6px; right: 6px; z-index: 2;
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 8px 2px 5px;
  border-radius: 9999px;
  background: linear-gradient(135deg, var(--vmc-color-vault-700), var(--vmc-color-vault-800));
  box-shadow: 0 2px 6px oklch(0.22 0.18 285 / 20%);
}
.pill-proxima svg { flex-shrink: 0; }
.pill-proxima span { font-size: 8px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: white; line-height: 1; }

/* Price badge overlay (card 3) */
.price-badge {
  position: absolute; top: 6px; left: 6px; z-index: 2;
  display: inline-flex; align-items: center; gap: 2px;
  height: 22px;
  padding: 0 8px 0 2px;
  border-radius: 9999px;
  background: linear-gradient(135deg, oklch(0.55 0.20 285), oklch(0.22 0.18 285));
  box-shadow: 0 3px 16px oklch(0.13 0 285 / 55%);
  border: 1px solid transparent;
  background-image:
    linear-gradient(135deg, oklch(0.55 0.20 285), oklch(0.22 0.18 285)),
    linear-gradient(135deg, #8776FF, oklch(1 0 0 / 40%) 38%, #532BC7 68%, #8776FF);
  background-origin: padding-box, border-box;
  background-clip: padding-box, border-box;
}
.price-badge span { font-size: 10px; font-weight: 700; color: white; white-space: nowrap; letter-spacing: 0.02em; }
.price-badge svg { flex-shrink: 0; }

/* ═══ HEART BUTTON ═══ */
.rec-heart { position: absolute; bottom: 6px; right: 6px; z-index: 2; }
.like-btn {
  cursor: pointer;
  transition: transform 0.2s var(--voyager-ease-default);
  filter: drop-shadow(0 2px 4px oklch(0.45 0.20 285 / 18%));
}
.like-btn:hover { transform: scale(1.15); }
.like-btn:active { transform: scale(0.88); }

/* ═══ CARD BODY ═══ */
.rec-body { padding: 6px 8px 12px; flex: 1; }
.rec-body h4 { margin: 0; font-size: 12px; font-weight: 600; color: #3B1782; line-height: 1.4; }
.rec-body p { margin: 2px 0 0; font-family: var(--voyager-font-body); font-size: 11px; font-weight: 400; color: color-mix(in oklch, var(--vmc-color-vault-800) 50%, transparent); line-height: 1.3; }
</style>
