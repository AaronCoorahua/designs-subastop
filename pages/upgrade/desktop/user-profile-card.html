<title>User Profile Card · 310 × 147 — Voyager Upgrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --vmc-color-vault-200:   oklch(0.87 0.09 285);
  --vmc-color-vault-300:   oklch(0.80 0.12 285);
  --vmc-color-vault-400:   oklch(0.55 0.20 285);
  --vmc-color-vault-500:   oklch(0.45 0.20 285);
  --vmc-color-vault-600:   oklch(0.38 0.20 285);
  --vmc-color-vault-700:   oklch(0.30 0.20 285);
  --vmc-color-vault-800:   oklch(0.22 0.18 285);
  --vmc-color-vault-900:   oklch(0.15 0.27 278);

  --vmc-color-orange-400:  oklch(0.78 0.16 60);
  --vmc-color-orange-500:  oklch(0.72 0.16 55);
  --vmc-color-orange-600:  oklch(0.66 0.17 50);
  --vmc-color-orange-700:  oklch(0.58 0.18 45);

  --vmc-color-base-white:  oklch(1 0 0);
  --vmc-color-skeleton:    oklch(0.85 0.008 220);

  --voyager-surface-page:    oklch(0.98 0.004 160);
  --voyager-surface-section: oklch(0.96 0.004 160);
  --voyager-surface-card:    oklch(1 0 0);
  --voyager-text-on-dark:    oklch(1 0 0);
  --voyager-text-on-surface: oklch(0.15 0.008 200);

  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-font-body:    "Roboto", system-ui, -apple-system, sans-serif;
  --voyager-font-mono:    "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;

  --voyager-duration-micro:    150ms;
  --voyager-duration-standard: 300ms;
  --voyager-ease-default:      cubic-bezier(0.3, 0, 0, 1);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 24px 16px;
  background: transparent;
  font-family: var(--voyager-font-display);
  color: var(--voyager-text-on-surface);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  overflow-x: hidden;
}

/* ─── Scaffold catalog ─────────────────────────────────────────── */
.catalog-row {
  display: flex; flex-wrap: wrap; justify-content: center;
  align-items: flex-start;
  gap: 40px 48px; padding: 16px 4px 32px;
}
.variant-slot {
  flex: 0 0 auto;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.variant-label {
  font-size: 10px; font-weight: 800;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: color-mix(in oklch, var(--vmc-color-vault-800) 55%, transparent);
  text-align: center;
}
.variant-sublabel {
  font-family: var(--voyager-font-mono);
  font-size: 10px; letter-spacing: 0.04em;
  color: color-mix(in oklch, var(--vmc-color-vault-800) 38%, transparent);
}

/* ═══════════════════════════════════════════════════════════════
   USER PROFILE CARD · 310 × 147 · 2 variantes
   ═══════════════════════════════════════════════════════════════ */
.upc {
  width: 310px;
  position: relative;
  isolation: isolate;
  border-radius: 16px;
  overflow: hidden;
  user-select: none;
}

/* ─── Inner layout (frozen outerHTML structure) ────────────────── */
.upc .p-4         { padding: 16px; }
.upc .mt-3        { margin-top: 12px; }
.upc .ml-1        { margin-left: 4px; }
.upc .flex        { display: flex; }
.upc .inline-flex { display: inline-flex; }
.upc .items-center{ align-items: center; }
.upc .justify-center { justify-content: center; }
.upc .flex-1      { flex: 1 1 0%; }
.upc .flex-grow   { flex-grow: 1; }
.upc .flex-shrink-0 { flex-shrink: 0; }
.upc .block       { display: block; }
.upc .space-x-1 > * + * { margin-left: 4px; }

.upc .w-4 { width: 16px; }
.upc .h-4 { height: 16px; }
.upc .w-5 { width: 20px; }
.upc .h-5 { height: 20px; }

.upc .font-display      { font-family: var(--voyager-font-display); }
.upc .text-base         { font-size: 16px; letter-spacing: 0.04em; }
.upc .text-xl           { font-size: 22px; letter-spacing: -0.01em; }
.upc .text-xs           { font-size: 11px; letter-spacing: 0.06em; }
.upc .text-sm           { font-size: 13px; letter-spacing: 0; }
.upc .font-light        { font-weight: 400; }
.upc .font-normal       { font-weight: 500; }
.upc .font-bold         { font-weight: 700; }
.upc .leading-tight     { line-height: 1.1; }
.upc .leading-6         { line-height: 24px; }
.upc .uppercase         { text-transform: uppercase; }

.upc svg { display: inline-block; vertical-align: middle; }
.upc .fill-current { fill: currentColor; }

/* Remove ALL hover/active effects — static only */
.upc a,
.upc button.button {
  text-decoration: none;
  color: inherit;
  background: transparent;
  border: 0;
  padding: 0;
  margin: 0;
  cursor: default;
  font: inherit;
  pointer-events: none;
}
.upc a:focus-visible,
.upc button.button:focus-visible {
  outline: none;
}

/* Hidden portal */
.upc .v-portal { display: none !important; }

/* ═══════════════════════════════════════════════════════════════
   V1 · CINEMATIC VAULT
   Deep purple atmosphere, vault gradient signature, monochrome text
   ═══════════════════════════════════════════════════════════════ */
.upc--vault .rounded {
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  background: var(--voyager-surface-card);
  box-shadow:
    0 8px 20px oklch(0.22 0.18 285 / 10%),
    0 2px 6px  oklch(0.22 0.18 285 / 6%);
}
.upc--vault .rounded::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 8px;
  background: linear-gradient(90deg,
    var(--vmc-color-vault-800) 0%,
    var(--vmc-color-vault-500) 100%);
}

.upc--vault .text-purple-500 { color: var(--vmc-color-vault-800); }
.upc--vault .text-purple-900 { color: var(--vmc-color-vault-700); }
.upc--vault .text-coral-500  { color: var(--vmc-color-vault-500); }
.upc--vault .text-gray-300   { color: var(--vmc-color-vault-300); }
.upc--vault .bg-coral-100    { background: var(--voyager-surface-card); }

.upc--vault .text-xl.font-bold {
  background: linear-gradient(135deg, var(--vmc-color-vault-800), var(--vmc-color-vault-500));
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

/* Star icon — vault tinted */
.upc--vault .text-gray-300 svg {
  color: var(--vmc-color-vault-300);
}

/* ═══════════════════════════════════════════════════════════════
   V2 · IRIDESCENT
   Silvery shimmer, orange→vault gradient accents, warm glow
   ═══════════════════════════════════════════════════════════════ */
.upc--iridescent .rounded {
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  background: var(--voyager-surface-card);
  box-shadow:
    0 8px 20px oklch(0 0 0 / 10%),
    0 2px 6px  oklch(0 0 0 / 6%);
}
.upc--iridescent .rounded::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 8px;
  background: linear-gradient(90deg,
    var(--vmc-color-orange-500) 0%,
    var(--vmc-color-vault-500) 100%);
  box-shadow: 0 -1px 6px oklch(0.72 0.16 55 / 25%);
}

.upc--iridescent .text-purple-500 { color: var(--vmc-color-vault-800); }
.upc--iridescent .text-purple-900 { color: var(--vmc-color-vault-700); }
.upc--iridescent .text-coral-500  { color: var(--vmc-color-orange-500); }
.upc--iridescent .text-gray-300   { color: var(--vmc-color-skeleton); }
.upc--iridescent .bg-coral-100    { background: var(--voyager-surface-card); }

.upc--iridescent .text-xl.font-bold {
  background: linear-gradient(135deg, var(--vmc-color-orange-500), var(--vmc-color-vault-500));
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

/* Star icon — iridescent shimmer */
.upc--iridescent .text-gray-300 svg {
  color: var(--vmc-color-skeleton);
  filter: drop-shadow(0 1px 2px oklch(0.72 0.16 55 / 20%));
}

/* Chevron accents */
.upc--iridescent .text-coral-500 svg {
  filter: drop-shadow(0 1px 2px oklch(0.72 0.16 55 / 30%));
}
</style>
