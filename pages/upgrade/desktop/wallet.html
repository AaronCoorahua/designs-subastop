<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Wallet · 310 × 221 — Voyager Upgrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --vmc-color-vault-200:   oklch(0.87 0.09 285);
  --vmc-color-vault-300:   oklch(0.80 0.12 285);
  --vmc-color-vault-400:   oklch(0.55 0.20 285);
  --vmc-color-vault-500:   oklch(0.45 0.20 285);
  --vmc-color-vault-600:   oklch(0.38 0.20 285);
  --vmc-color-vault-700:   oklch(0.30 0.20 285);
  --vmc-color-vault-800:   oklch(0.22 0.18 285);
  --vmc-color-vault-900:   oklch(0.15 0.27 278);

  --vmc-color-orange-400:  oklch(0.78 0.16 60);
  --vmc-color-orange-500:  oklch(0.72 0.16 55);
  --vmc-color-orange-600:  oklch(0.66 0.17 50);
  --vmc-color-orange-700:  oklch(0.58 0.18 45);

  --vmc-color-base-white:  oklch(1 0 0);
  --vmc-color-skeleton:    oklch(0.85 0.008 220);

  --voyager-surface-page:    oklch(0.98 0.004 160);
  --voyager-surface-section: oklch(0.96 0.004 160);
  --voyager-surface-card:    oklch(1 0 0);
  --voyager-text-on-dark:    oklch(1 0 0);
  --voyager-text-on-surface: oklch(0.15 0.008 200);

  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-font-body:    "Roboto", system-ui, -apple-system, sans-serif;
  --voyager-font-mono:    "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;

  --vmc-radius-full: 9999px;

  --voyager-duration-micro:    150ms;
  --voyager-duration-standard: 300ms;
  --voyager-ease-default:      cubic-bezier(0.3, 0, 0, 1);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 24px 16px;
  background: transparent;
  font-family: var(--voyager-font-display);
  color: var(--voyager-text-on-surface);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  overflow-x: hidden;
}

/* ─── Scaffold catalog ─────────────────────────────────────────── */
.catalog-row {
  display: flex; flex-wrap: wrap; justify-content: center;
  align-items: flex-start;
  gap: 40px 48px; padding: 16px 4px 32px;
}
.variant-slot {
  flex: 0 0 auto;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.variant-label {
  font-size: 10px; font-weight: 800;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: color-mix(in oklch, var(--vmc-color-vault-800) 55%, transparent);
  text-align: center;
}
.variant-sublabel {
  font-family: var(--voyager-font-mono);
  font-size: 10px; letter-spacing: 0.04em;
  color: color-mix(in oklch, var(--vmc-color-vault-800) 38%, transparent);
}

/* ═══════════════════════════════════════════════════════════════
   WALLET · base layout
   ═══════════════════════════════════════════════════════════════ */
.wlt {
  width: 310px;
  position: relative;
  isolation: isolate;
  user-select: none;
}

/* ─── Inner layout (frozen outerHTML structure) ────────────────── */
.wlt .rounded       { height: 220.84px; }
.wlt .p-4          { padding: 16px; }
.wlt .px-3         { padding-left: 12px; padding-right: 12px; padding-top: 0; padding-bottom: 0; }
.wlt .py-2         { padding-top: 8px; padding-bottom: 8px; height: 32px; display: inline-flex !important; align-items: center; justify-content: center; border-radius: 4px; }
.wlt .py-2 h4      { margin: 0; line-height: 32px; vertical-align: middle; }
.wlt .py-1         { padding-top: 3px; padding-bottom: 3px; }
.wlt .pr-4         { padding-right: 16px; }
.wlt .my-4         { margin-top: 14px; margin-bottom: 14px; }
.wlt .mt-6         { margin-top: 24px; }
.wlt .ml-1         { margin-left: 4px; }
.wlt .mr-1         { margin-right: 4px; }
.wlt .flex         { display: flex; }
.wlt .inline-flex  { display: inline-flex; }
.wlt .items-center { align-items: center; }
.wlt .justify-center { justify-content: center; }
.wlt .flex-1       { flex: 1 1 0%; }
.wlt .flex-shrink-0 { flex-shrink: 0; }
.wlt .relative     { position: relative; }
.wlt .inline-block { display: inline-block; }
.wlt .absolute     { position: absolute; }
.wlt .top-0        { top: 0; }
.wlt .left-0       { left: 0; }
.wlt .bottom-0     { bottom: 0; }
.wlt .right-0      { right: 0; }
.wlt .w-full       { width: 100%; }
.wlt .text-center  { text-align: center; }
.wlt .space-y-3 > * + * { margin-top: 8px; }

.wlt .w-2  { width: 6.7px; }
.wlt .h-2  { height: 6.7px; }
.wlt .w-4  { width: 16px; }
.wlt .h-4  { height: 16px; }
.wlt .w-5  { width: 20px; }
.wlt .h-5  { height: 20px; }
.wlt .w-10 { width: 28px; }
.wlt .h-10 { height: 28px; }

.wlt .font-display { font-family: var(--voyager-font-display); }
.wlt .text-base    { font-size: 16px; line-height: 1.5; }
.wlt .text-sm      { font-size: 14px; line-height: 1.43; }
.wlt .text-xs      { font-size: 12px; line-height: 1.5; }
.wlt .font-normal  { font-weight: 400; }
.wlt .font-bold    { font-weight: 700; }
.wlt .leading-none { line-height: 32px; }
.wlt .leading-6    { line-height: 24px; }
.wlt .uppercase    { text-transform: uppercase; }

.wlt svg           { display: inline-block; vertical-align: middle; }
.wlt .fill-current { fill: currentColor; }

/* No hover/active — static only (except CTA buttons) */
.wlt a:not(.button),
.wlt button {
  text-decoration: none;
  color: inherit;
  background: transparent;
  border: 0;
  padding: 0;
  margin: 0;
  cursor: default;
  font: inherit;
  pointer-events: none;
}

/* ─── @property for vault CTA gradient animation ───────────── */
@property --wlt-angle {
  syntax: '<angle>';
  inherits: false;
  initial-value: 160deg;
}
@property --wlt-stop-a {
  syntax: '<color>';
  inherits: false;
  initial-value: oklch(0.45 0.20 285);
}
@property --wlt-stop-b {
  syntax: '<color>';
  inherits: false;
  initial-value: oklch(0.30 0.20 285);
}
@property --wlt2-angle {
  syntax: '<angle>';
  inherits: false;
  initial-value: 135deg;
}
@property --wlt2-stop-a {
  syntax: '<color>';
  inherits: false;
  initial-value: oklch(0.66 0.17 50);
}
@property --wlt2-stop-b {
  syntax: '<color>';
  inherits: false;
  initial-value: oklch(0.45 0.20 285);
}

/* HR divider */
.wlt hr.border-t {
  border: none;
  border-top: 1px solid color-mix(in oklch, var(--vmc-color-vault-800) 5%, transparent);
}

/* ═══════════════════════════════════════════════════════════════
   V1 · CINEMATIC VAULT
   ═══════════════════════════════════════════════════════════════ */
.wlt--vault .rounded {
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  background: var(--voyager-surface-card);
  box-shadow:
    0 8px 20px oklch(0.22 0.18 285 / 10%),
    0 2px 6px  oklch(0.22 0.18 285 / 6%);
}
.wlt--vault .rounded::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 8px;
  background: linear-gradient(90deg,
    var(--vmc-color-vault-800) 0%,
    var(--vmc-color-vault-500) 100%);
  pointer-events: none;
}

.wlt--vault .bg-coral-100    { background: var(--voyager-surface-card); }
.wlt--vault .text-purple-400 { color: var(--vmc-color-vault-800); }
.wlt--vault .text-purple-500 { color: var(--vmc-color-vault-700); }
.wlt--vault .text-coral-400  { color: var(--vmc-color-vault-300); }
.wlt--vault .text-white      { color: var(--vmc-color-base-white); }

/* CTA button — Cinematic Vault (psec style from login) */
.wlt--vault .bg-purple-500.rounded-lg {
  --wlt-stop-a: var(--vmc-color-vault-500);
  --wlt-stop-b: var(--vmc-color-vault-700);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 42px;
  padding: 0 16px;
  border-radius: var(--vmc-radius-full);
  border: 2.5px solid transparent;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  font-family: var(--voyager-font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--vmc-color-base-white);
  text-shadow: 0 1px 3px rgb(0% 0% 0% / 0.30);
  background-image:
    linear-gradient(var(--wlt-angle), var(--wlt-stop-a) 0%, var(--wlt-stop-b) 100%),
    linear-gradient(135deg,
      var(--vmc-color-vault-300) 0%,
      var(--vmc-color-base-white) 35%,
      var(--vmc-color-vault-400) 65%,
      var(--vmc-color-vault-300) 100%
    );
  background-origin: padding-box, border-box;
  background-clip: padding-box, border-box;
  box-shadow:
    inset 0 1px 0 rgb(100% 100% 100% / 0.22),
    0 2px 8px rgb(51.76% 37.65% 89.8% / 0.30);
  text-decoration: none;
  pointer-events: auto;
  transition:
    --wlt-angle  0.4s  cubic-bezier(0.25, 0.8, 0.25, 1),
    --wlt-stop-a 0.35s ease,
    --wlt-stop-b 0.35s ease,
    transform    0.2s  cubic-bezier(0.25, 0.8, 0.25, 1),
    box-shadow   0.25s ease;
  transform: translateZ(0);
}
.wlt--vault .bg-purple-500.rounded-lg::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--vmc-radius-full);
  background: linear-gradient(180deg, rgb(100% 100% 100% / 0.16) 0%, transparent 55%);
  pointer-events: none;
  z-index: 1;
}
.wlt--vault .bg-purple-500.rounded-lg::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: var(--vmc-radius-full);
  background: linear-gradient(135deg, var(--vmc-color-vault-400), var(--vmc-color-vault-600));
  filter: blur(14px);
  opacity: 0;
  z-index: -1;
  transition: opacity 0.3s ease, filter 0.3s ease;
}
.wlt--vault .bg-purple-500.rounded-lg:hover {
  --wlt-angle: 220deg;
  --wlt-stop-a: var(--vmc-color-vault-400);
  --wlt-stop-b: var(--vmc-color-vault-600);
  transform: translateY(-2px) scale(1.02);
  box-shadow:
    inset 0 1px 0 rgb(100% 100% 100% / 0.20),
    0 8px 24px rgb(51.76% 37.65% 89.8% / 0.40),
    0 4px 10px rgb(51.76% 37.65% 89.8% / 0.25);
}
.wlt--vault .bg-purple-500.rounded-lg:hover::after { opacity: 0.45; filter: blur(18px); }
.wlt--vault .bg-purple-500.rounded-lg:active {
  --wlt-angle: 160deg;
  --wlt-stop-a: var(--vmc-color-vault-700);
  --wlt-stop-b: var(--vmc-color-vault-900);
  transform: scale(0.97) translateY(1px);
  box-shadow:
    inset 0 2px 5px rgb(0% 0% 0% / 0.28),
    0 1px 3px rgb(0% 0% 0% / 0.14);
}
.wlt--vault .bg-purple-500.rounded-lg:active::after { opacity: 0; }
.wlt--vault .bg-purple-500.rounded-lg:focus-visible {
  outline: none;
  box-shadow:
    0 0 0 2px var(--vmc-color-base-white),
    0 0 0 5px var(--vmc-color-vault-400),
    0 8px 16px -4px rgb(51.76% 37.65% 89.8% / 0.35);
}

/* ═══════════════════════════════════════════════════════════════
   V2 · IRIDESCENT
   ═══════════════════════════════════════════════════════════════ */
.wlt--iridescent .rounded {
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  background: var(--voyager-surface-card);
  box-shadow:
    0 8px 20px oklch(0 0 0 / 10%),
    0 2px 6px  oklch(0 0 0 / 6%);
}
.wlt--iridescent .rounded::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 8px;
  background: linear-gradient(90deg,
    var(--vmc-color-orange-500) 0%,
    var(--vmc-color-vault-500) 100%);
  box-shadow: 0 -1px 6px oklch(0.72 0.16 55 / 25%);
  pointer-events: none;
}

.wlt--iridescent .bg-coral-100    { background: var(--voyager-surface-card); }
.wlt--iridescent .text-purple-400 { color: var(--vmc-color-vault-800); }
.wlt--iridescent .text-purple-500 { color: var(--vmc-color-vault-700); }
.wlt--iridescent .text-coral-400  { color: var(--vmc-color-orange-500); }
.wlt--iridescent .text-white      { color: var(--vmc-color-base-white); }

/* CTA button — Iridescent (pvbtn style from login) */
.wlt--iridescent .bg-purple-500.rounded-lg {
  --wlt2-stop-a: var(--vmc-color-orange-600);
  --wlt2-stop-b: var(--vmc-color-vault-500);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 42px;
  padding: 0 16px;
  border-radius: var(--vmc-radius-full);
  border: 2.5px solid transparent;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  font-family: var(--voyager-font-display);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--vmc-color-base-white);
  text-shadow: 0 1px 3px rgb(0% 0% 0% / 0.25);
  background-image:
    linear-gradient(var(--wlt2-angle), var(--wlt2-stop-a) 0%, var(--wlt2-stop-a) 40%, var(--wlt2-stop-b) 100%),
    linear-gradient(135deg,
      var(--vmc-color-base-white) 0%,
      var(--vmc-color-orange-400) 25%,
      var(--vmc-color-vault-400) 75%,
      var(--vmc-color-base-white) 100%
    );
  background-origin: padding-box, border-box;
  background-clip: padding-box, border-box;
  box-shadow:
    inset 0 1px 0 rgb(100% 100% 100% / 0.28),
    0 2px 6px rgb(92.94% 53.73% 21.18% / 0.30);
  text-decoration: none;
  pointer-events: auto;
  transition:
    --wlt2-angle  0.4s  cubic-bezier(0.25, 0.8, 0.25, 1),
    --wlt2-stop-a 0.35s ease,
    --wlt2-stop-b 0.35s ease,
    transform     0.2s  cubic-bezier(0.25, 0.8, 0.25, 1),
    box-shadow    0.25s ease;
  transform: translateZ(0);
}
.wlt--iridescent .bg-purple-500.rounded-lg::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--vmc-radius-full);
  background: linear-gradient(180deg, rgb(100% 100% 100% / 0.20) 0%, transparent 55%);
  pointer-events: none;
  z-index: 1;
}
.wlt--iridescent .bg-purple-500.rounded-lg::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: var(--vmc-radius-full);
  background: linear-gradient(135deg, var(--vmc-color-orange-500), var(--vmc-color-vault-500));
  filter: blur(14px);
  opacity: 0;
  z-index: -1;
  transition: opacity 0.3s ease, filter 0.3s ease;
}
.wlt--iridescent .bg-purple-500.rounded-lg:hover {
  --wlt2-angle: 180deg;
  --wlt2-stop-a: var(--vmc-color-orange-500);
  --wlt2-stop-b: var(--vmc-color-vault-400);
  transform: translateY(-2px) scale(1.02);
  box-shadow:
    inset 0 1px 0 rgb(100% 100% 100% / 0.25),
    0 8px 24px rgb(92.94% 53.73% 21.18% / 0.40),
    0 4px 10px rgb(92.94% 53.73% 21.18% / 0.25);
}
.wlt--iridescent .bg-purple-500.rounded-lg:hover::after { opacity: 0.45; filter: blur(18px); }
.wlt--iridescent .bg-purple-500.rounded-lg:active {
  --wlt2-angle: 135deg;
  --wlt2-stop-a: var(--vmc-color-orange-700);
  --wlt2-stop-b: var(--vmc-color-vault-700);
  transform: scale(0.97) translateY(1px);
  box-shadow:
    inset 0 2px 5px rgb(0% 0% 0% / 0.28),
    0 1px 3px rgb(0% 0% 0% / 0.14);
}
.wlt--iridescent .bg-purple-500.rounded-lg:active::after { opacity: 0; }
.wlt--iridescent .bg-purple-500.rounded-lg:focus-visible {
  outline: none;
  box-shadow:
    0 0 0 2px var(--vmc-color-base-white),
    0 0 0 5px var(--vmc-color-orange-500),
    0 8px 16px -4px rgb(92.94% 53.73% 21.18% / 0.35);
}
</style>
