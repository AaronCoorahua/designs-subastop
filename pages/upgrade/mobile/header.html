<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Header Mobile · 420 × 56 — Voyager Upgrade</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
/* ─── Tokens base · compartido entre componentes mobile ────────── */
:root {
  --vmc-color-vault-200:   oklch(0.87 0.09 285);
  --vmc-color-vault-300:   oklch(0.80 0.12 285);
  --vmc-color-vault-400:   oklch(0.55 0.20 285);
  --vmc-color-vault-500:   oklch(0.45 0.20 285);
  --vmc-color-vault-600:   oklch(0.38 0.20 285);
  --vmc-color-vault-700:   oklch(0.30 0.20 285);
  --vmc-color-vault-800:   oklch(0.22 0.18 285);
  --vmc-color-vault-900:   oklch(0.15 0.27 278);

  --vmc-color-orange-400:  oklch(0.78 0.16 60);
  --vmc-color-orange-500:  oklch(0.72 0.16 55);
  --vmc-color-orange-600:  oklch(0.66 0.17 50);
  --vmc-color-orange-700:  oklch(0.58 0.18 45);

  --vmc-color-base-white:  oklch(1 0 0);

  --voyager-text-on-dark:    oklch(1 0 0);
  --voyager-text-on-surface: oklch(0.15 0.008 200);

  --voyager-font-display: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
  --voyager-font-mono:    "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
  --voyager-ease-default: cubic-bezier(0.3, 0, 0, 1);
}
@property --vbtn-angle  { syntax: '<angle>'; inherits: false; initial-value: 160deg; }
@property --vbtn-stop-a { syntax: '<color>'; inherits: false; initial-value: oklch(0.66 0.17 50); }
@property --vbtn-stop-b { syntax: '<color>'; inherits: false; initial-value: oklch(0.45 0.20 285); }

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 24px 16px;
  background: transparent;
  font-family: var(--voyager-font-display);
  color: var(--voyager-text-on-surface);
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  overflow-x: hidden;
}

/* ─── Scaffold catalog · compartido ─────────────────────────────── */
.catalog-row {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 32px 24px; padding: 16px 4px 24px;
}
.variant-slot {
  flex: 0 0 auto;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.variant-label {
  font-size: 10px; font-weight: 800;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: color-mix(in oklch, var(--vmc-color-vault-800) 55%, transparent);
  text-align: center;
}
.variant-sublabel {
  font-family: var(--voyager-font-mono);
  font-size: 10px; letter-spacing: 0.04em;
  color: color-mix(in oklch, var(--vmc-color-vault-800) 38%, transparent);
}

/* ═══════════════════════════════════════════════════════════════
   HEADER MOBILE · 420 × 56 · vault background
   Layout: hamburger · logo · auth button
   ═══════════════════════════════════════════════════════════════ */
.hd {
  width: 420px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  background: var(--vmc-color-vault-800);
  position: relative;
  isolation: isolate;
  overflow: hidden;
  user-select: none;
}
.hd-btn { margin-left: auto; }
.hd::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 80% at 0% 50%, oklch(1 0 0 / 6%) 0%, transparent 60%),
    radial-gradient(ellipse 40% 80% at 100% 50%, oklch(0.66 0.17 50 / 8%) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}
.hd > * { position: relative; z-index: 1; }

/* ── Hamburger button ──────────────────────────────────────────── */
.hd-menu {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: 0; padding: 0;
  border-radius: 8px;
  cursor: pointer;
  color: var(--vmc-color-base-white);
  transition: background 150ms var(--voyager-ease-default);
}
.hd-menu:hover { background: oklch(1 0 0 / 8%); }
.hd-menu:active { background: oklch(1 0 0 / 12%); }
.hd-menu svg {
  width: 22px; height: 22px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round;
}

/* ── Brand logo (left) ─────────────────────────────────────────── */
.hd-brand {
  display: flex; align-items: center;
  height: 100%;
}
.hd-brand img {
  display: block;
  width: 140px; height: 20px;
  object-fit: contain;
  filter: drop-shadow(0 1px 3px oklch(0 0 0 / 25%));
}

/* ── HD · Auth button base ──────────────────────────────────────── */
.hd-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 14px 0 4px;
  border-radius: 9999px;
  border: 2px solid transparent;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  font-family: var(--voyager-font-display);
  font-size: 13px;
  font-weight: 500;
  color: var(--vmc-color-base-white);
  text-shadow: 0 1px 2px oklch(0 0 0 / 22%);
  background-origin: padding-box, border-box;
  background-clip: padding-box, border-box;
  transition:
    --vbtn-angle 0.4s var(--voyager-ease-default),
    --vbtn-stop-a 0.35s ease,
    --vbtn-stop-b 0.35s ease,
    transform 0.2s var(--voyager-ease-default),
    box-shadow 0.25s ease;
  transform: translateZ(0);
}
.hd-btn::before {
  content: ''; position: absolute; inset: 0;
  border-radius: 9999px;
  background: linear-gradient(180deg, oklch(1 0 0 / 15%) 0%, transparent 55%);
  pointer-events: none; z-index: 1;
}
.hd-btn > *:not(.hd-btn-icon) { position: relative; z-index: 2; }
.hd-btn-icon {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  position: relative; z-index: 2;
}
.hd-btn-icon svg { width: 16px; height: 16px; fill: currentColor; }
.hd-btn-username { font-weight: 700; }
.hd-btn-light { font-weight: 300; }

/* ── V1 · SM Ingresa Guest (orange→vault iridescent) ────────────── */
.hd-btn--sm {
  --vbtn-stop-a: var(--vmc-color-orange-600);
  --vbtn-stop-b: var(--vmc-color-vault-500);
  background-image:
    linear-gradient(var(--vbtn-angle), var(--vbtn-stop-a) 0%, var(--vbtn-stop-a) 40%, var(--vbtn-stop-b) 100%),
    linear-gradient(135deg,
      var(--vmc-color-base-white) 0%,
      var(--vmc-color-orange-400) 25%,
      var(--vmc-color-vault-400) 75%,
      var(--vmc-color-base-white) 100%);
  box-shadow:
    inset 0 1px 0 oklch(1 0 0 / 25%),
    0 2px 6px oklch(0.66 0.17 50 / 25%);
}
.hd-btn--sm .hd-btn-icon {
  background: oklch(0 0 0 / 18%);
  color: var(--vmc-color-base-white);
}
.hd-btn--sm:hover {
  --vbtn-angle: 220deg;
  --vbtn-stop-a: oklch(0.84 0.11 70);
  --vbtn-stop-b: oklch(0.70 0.16 290);
  transform: translateY(-1px) scale(1.02);
  box-shadow:
    inset 0 1px 0 oklch(1 0 0 / 30%),
    0 4px 10px oklch(0.66 0.17 50  / 0.40),
    0 8px 24px oklch(0.55 0.20 285 / 0.35);
}
.hd-btn--sm:active {
  --vbtn-angle: 135deg;
  --vbtn-stop-a: var(--vmc-color-orange-700);
  --vbtn-stop-b: var(--vmc-color-vault-600);
  transform: scale(0.97) translateY(1px);
  box-shadow: inset 0 2px 4px oklch(0 0 0 / 22%), 0 1px 2px oklch(0 0 0 / 10%);
}

/* ── V2 · D Primary Clone (orange→vault iridescent · logged-in) ── */
.hd-btn--d {
  --vbtn-stop-a: var(--vmc-color-orange-600);
  --vbtn-stop-b: var(--vmc-color-vault-500);
  background-image:
    linear-gradient(var(--vbtn-angle), var(--vbtn-stop-a) 0%, var(--vbtn-stop-a) 40%, var(--vbtn-stop-b) 100%),
    linear-gradient(135deg,
      var(--vmc-color-base-white) 0%,
      var(--vmc-color-orange-400) 25%,
      var(--vmc-color-vault-400) 75%,
      var(--vmc-color-base-white) 100%);
  box-shadow:
    inset 0 1px 0 oklch(1 0 0 / 28%),
    0 2px 6px oklch(0.66 0.17 50 / 30%);
}
.hd-btn--d .hd-btn-icon {
  background: oklch(0 0 0 / 18%);
  color: var(--vmc-color-base-white);
}
.hd-btn--d:hover {
  --vbtn-angle: 220deg;
  --vbtn-stop-a: oklch(0.84 0.11 70);
  --vbtn-stop-b: oklch(0.70 0.16 290);
  transform: translateY(-1px) scale(1.02);
  box-shadow:
    inset 0 1px 0 oklch(1 0 0 / 30%),
    0 4px 10px oklch(0.66 0.17 50  / 0.40),
    0 8px 24px oklch(0.55 0.20 285 / 0.35);
}
.hd-btn--d:active {
  --vbtn-angle: 135deg;
  --vbtn-stop-a: var(--vmc-color-orange-700);
  --vbtn-stop-b: var(--vmc-color-vault-600);
  transform: scale(0.97) translateY(1px);
  box-shadow: inset 0 2px 5px oklch(0 0 0 / 22%), 0 1px 2px oklch(0 0 0 / 10%);
}

/* ── V3 · E Vault→Orange ─────────────────────────────────────────── */
.hd-btn--e {
  background-image:
    linear-gradient(135deg,
      var(--vmc-color-vault-600) 0%,
      var(--vmc-color-vault-500) 45%,
      var(--vmc-color-orange-500) 100%),
    linear-gradient(135deg,
      var(--vmc-color-vault-400) 0%,
      var(--vmc-color-base-white) 40%,
      var(--vmc-color-orange-400) 75%,
      var(--vmc-color-base-white) 100%);
  box-shadow:
    inset 0 1px 0 oklch(1 0 0 / 22%),
    0 2px 8px oklch(0.45 0.20 285 / 35%);
}
.hd-btn--e .hd-btn-icon {
  background: oklch(1 0 0 / 18%);
  color: var(--vmc-color-base-white);
}
.hd-btn--e .hd-btn-username {
  color: oklch(0.86 0.10 60);
  text-shadow: 0 1px 2px oklch(0 0 0 / 25%);
}
.hd-btn--e:hover {
  transform: translateY(-1px) scale(1.02);
  box-shadow:
    inset 0 1px 0 oklch(1 0 0 / 20%),
    0 8px 22px oklch(0.45 0.20 285 / 40%),
    0 4px 10px oklch(0.66 0.17 50 / 35%);
}
.hd-btn--e:active {
  transform: scale(0.97) translateY(1px);
  box-shadow: inset 0 2px 5px oklch(0 0 0 / 25%), 0 1px 2px oklch(0 0 0 / 10%);
}

/* ── V4 · A Cinematic Dark (vault dark · orange ring + glow) ────── */
.hd-btn--a {
  background-image:
    linear-gradient(135deg, var(--vmc-color-vault-700) 0%, var(--vmc-color-vault-900) 100%),
    linear-gradient(135deg,
      var(--vmc-color-orange-600) 0%,
      var(--vmc-color-orange-400) 45%,
      var(--vmc-color-vault-400) 100%);
  box-shadow:
    inset 0 1px 0 oklch(1 0 0 / 15%),
    0 0 16px oklch(0.66 0.17 50 / 25%);
}
.hd-btn--a .hd-btn-icon {
  background: oklch(0.66 0.17 50 / 22%);
  color: var(--vmc-color-base-white);
}
.hd-btn--a .hd-btn-username {
  color: var(--vmc-color-orange-400);
  text-shadow: 0 0 8px oklch(0.66 0.17 50 / 55%);
}
.hd-btn--a:hover {
  transform: translateY(-1px);
  box-shadow:
    inset 0 1px 0 oklch(1 0 0 / 18%),
    0 0 24px oklch(0.66 0.17 50 / 40%),
    0 4px 16px oklch(0.15 0.27 278 / 50%);
}
.hd-btn--a:active {
  transform: scale(0.97) translateY(1px);
  box-shadow: inset 0 2px 5px oklch(0 0 0 / 35%), 0 1px 2px oklch(0 0 0 / 15%);
}
</style>
</head>
<body>
